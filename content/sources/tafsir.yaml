  notes: '« طبع الله على قلوب هؤلاء… فلم يوفقهم للهدى » (épisode qalb : « قلوب اتقفلت »)'

  text_ar: طبع الله على قلوب هؤلاء وعلى سمعهم، وجعل على أبصارهم غطاء; بسبب كفرهم وعنادهم مِن بعد ما تبيَّن لهم الحق، فلم يوفقهم للهدى، ولهم عذاب شديد في نار جهنم.
