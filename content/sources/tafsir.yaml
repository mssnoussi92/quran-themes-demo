  notes: '« إذا أصابه المكروه والعسر فهو كثير الجزع… وإذا أصابه الخير واليسر فهو كثير المنع… إلا المقيمين للصلاة » (épisode haluu)'
  text_ar: إن الإنسان جُبِلَ على الجزع وشدة الحرص، إذا أصابه المكروه والعسر فهو كثير الجزع والأسى، وإذا أصابه الخير واليسر فهو كثير المنع والإمساك، إلا المقيمين للصلاة الذين يحافظون على أدائها في جميع الأوقات، ولا يَشْغَلهم عنها شاغل، والذين في أموالهم نصيب معيَّن فرضه الله عليهم، وهو الزكاة لمن يسألهم المعونة، ولمن يتعفف عن سؤالها، والذين يؤمنون بيوم الحساب والجزاء فيستعدون له بالأعمال الصالحة، والذين هم خائفون من عذاب الله. إن عذاب ربهم لا ينبغي أن يأمنه أحد. والذين هم حافظون لفروجهم عن كل ما حرَّم الله عليهم، إلا على أزواجهم وإمائهم، فإنهم غير مؤاخذين.
