  notes: "« إذا رآه الجاهل بحاله ظن أنه أرض زكية… » ; « شرط العمل أن يكون لله وحده » (وتحسبونه هيّنًا, riya)"
  text_ar: 'ينهى عباده تعالى لطفا بهم ورحمة عن إبطال صدقاتهم بالمن والأذى ففيه أن المن والأذى يبطل الصدقة، ويستدل بهذا على أن الأعمال السيئة تبطل الأعمال الحسنة، كما قال تعالى: { ولا تجهروا له بالقول كجهر بعضكم لبعض أن تحبط أعمالكم وأنتم لا تشعرون } فكما أن الحسنات يذهبن السيئات فالسيئات تبطل ما قابلها من الحسنات، وفي هذه الآية مع قوله تعالى { ولا تبطلوا أعمالكم } حث على تكميل الأعمال وحفظها من كل ما يفسدها لئلا يضيع العمل سدى، وقوله: { كالذي ينفق ماله رئاء الناس ولا يؤمن بالله واليوم الآخر } أي: أنتم وإن قصدتم بذلك وجه الله في ابتداء الأمر، فإن المنة والأذى مبطلان لأعمالكم، فتصير أعمالكم بمنزلة الذي يعمل لمراءاة الناس ولا يريد به الله والدار الآخرة، فهذا لا شك أن عمله من أصله مردود، لأن شرط العمل أن يكون لله وحده وهذا في الحقيقة عمل للناس لا لله، فأعماله باطلة وسعيه غير مشكور، فمثله المطابق لحاله { كمثل صفوان } وهو الحجر الأملس الشديد { عليه تراب فأصابه وابل } أي: مطر غزير { فتركه صلدا } أي: ليس عليه شيء من التراب، فكذلك حال هذا المرائي، قلبه غليظ قاس بمنزلة الصفوان، وصدقته ونحوها من أعماله بمنزلة التراب الذي على الصفوان، إذا رآه الجاهل بحاله ظن أنه أرض زكية قابلة للنبات، فإذا انكشفت حقيقة حاله زال ذلك التراب وتبين أن عمله بمنزلة السراب، وأن قلبه غير صالح لنبات الزرع وزكائه عليه، بل الرياء الذي فيه والإرادات الخبيثة تمنع من انتفاعه بشيء من عمله، فلهذا { لا يقدرون على شيء } من أعمالهم التي اكتسبوها، لأنهم وضعوها في غير موضعها وجعلوها لمخلوق مثلهم، لا يملك لهم ضررا ولا نفعا وانصرفوا عن عبادة من تنفعهم عبادته، فصرف الله قلوبهم عن الهداية، فلهذا قال: { والله لا يهدي القوم الكافرين }'
