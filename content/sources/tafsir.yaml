  status: proposed
  notes: "« علمت ما لم تعلمه من الأمر على وجه الإحاطة » : la huppe à Soulayman (معاك 5 ثواني, hudhud)"
  text_ar: 'فمكث الهدهد زمنًا غير بعيد ثم حضر فعاتبه سليمان على مغيبه وتخلُّفه، فقال له الهدهد: علمت ما لم تعلمه من الأمر على وجه الإحاطة، وجئتك من مدينة «سبأ» بـ «اليمن» بخبر خطير الشأن، وأنا على يقين منه.'
- id: tafsir.saadi.27.22
  type: tafsir
  ref: {edition: saadi, surah: 27, ayah: 22}
