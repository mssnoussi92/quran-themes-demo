  notes: "pourquoi « العزيز الحكيم » : un pardon « عن تمام عزة وقدرة، لا… عن عجز », et sage, pour qui vient avec les causes du pardon (معاك ٥ ثواني, khatima)"
  text_ar: '{ إِنْ تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ } وأنت أرحم بهم من أنفسهم وأعلم بأحوالهم، فلولا أنهم عباد متمردون لم تعذبهم. { وَإِنْ تَغْفِرْ لَهُمْ فَإِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ } أي: فمغفرتك صادرة عن تمام عزة وقدرة، لا كمن يغفر ويعفو عن عجز وعدم قدرة. الحكيم حيث كان من مقتضى حكمتك أن تغفر لمن أتى بأسباب المغفرة.'
