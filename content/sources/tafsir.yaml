  notes: '« يعلمه الله » (épisode sadr : ce qui est caché dans les poitrines, Dieu le sait)'
  text_ar: 'قل -أيها النبي- للمؤمنين: إن تكتموا ما استقر في قلوبكم من موالاة الكافرين ونصرتهم أو تظهروا ذلك لا يَخْفَ على الله منه شيء، فإنَّ علمه محيط بكل ما في السماوات وما في الأرض، وله القدرة التامة على كل شيء.'
