  notes: "l'excuse du décret, « حجة فاسدة » : sinon le châtiment ne serait pas tombé ; une preuve demande un savoir, pas une conjecture (le film) ; film « مخيّر ولا مسيّر؟ » (qadar, 2026-11-17)"
  text_ar: 'هذا إخبار من الله أن المشركين سيحتجون على شركهم وتحريمهم ما أحل الله، بالقضاء والقدر، ويجعلون مشيئة الله الشاملة لكل شيء من الخير والشر حجة لهم في دفع اللوم عنهم. وقد قالوا ما أخبر الله أنهم سيقولونه، كما قال في الآية الأخرى: { وَقَالَ الَّذِينَ أَشْرَكُوا لَوْ شَاءَ اللَّهُ مَا عَبَدْنَا مِنْ دُونِهِ مِنْ شَيْءٍ } الآية. فأخبر تعالى أن هذة الحجة، لم تزل الأمم المكذبة تدفع بها عنهم دعوة الرسل، ويحتجون بها، فلم تجد فيهم شيئا ولم تنفعهم، فلم يزل هذا دأبهم حتى أهكلهم الله، وأذاقهم بأسه. فلو كانت حجة صحيحة، لدفعت عنهم العقاب، ولما أحل الله بهم العذاب، لأنه لا يحل بأسه إلا بمن استحقه، فعلم أنها حجة فاسدة، وشبهة كاسدة، من عدة أوجه: منها: ما ذكر الله من أنها لو كانت صحيحة، لم تحل بهم العقوبة. ومنها: أن الحجة، لا بد أن تكون حجة مستندة إلى العلم والبرهان، فأما إذا كانت مستندة إلى مجرد الظن والخرص، الذي لا يغني من الحق شيئا، فإنها باطلة، ولهذا قال: { قُلْ هَلْ عِنْدَكُمْ مِنْ عِلْمٍ فَتُخْرِجُوهُ لَنَا } فلو كان لهم علم - وهم خصوم ألداء- لأخرجوه، فلما لم يخرجوه علم أنه لا علم عندهم. { إِنْ تَتَّبِعُونَ إِلَّا الظَّنَّ وَإِنْ أَنْتُمْ إِلَّا تَخْرُصُونَ } ومَنْ بنى حججه على الخرص والظن، فهو مبطل خاسر، فكيف إذا بناها على البغي والعناد والشر والفساد؟'
