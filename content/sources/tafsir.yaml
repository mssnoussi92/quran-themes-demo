  text_ar: '{ وَوَجَدَكَ عَائِلًا } أي: فقيرًا { فَأَغْنَى } بما فتح الله عليك من البلدان، التي جبيت لك أموالها وخراجها. فالذي أزال عنك هذه النقائص، سيزيل عنك كل نقص، والذي أوصلك إلى الغنى، وآواك ونصرك وهداك، قابل نعمته بالشكران.'
