  notes: "le pardon porte sur le passé (« عما تقدم منهم من الإساءة والأذى ») ; il vient après l'innocence descendue, quand celui qui avait parlé s'était repenti et avait reçu sa peine (« وقد ولق ولقة تاب الله عليه منها، وضرب الحد عليها ») : la réplique « المسامحة على اللي فات… مش سكوت على الغلط لو اتكرر » (idée du propriétaire, 2026-11-15) et celle qui la précède (short 4 de « آية وحكايتها »)"
  text_ar: "يقول تعالى : ( ولا يأتل ) من الألية ، [ وهي : الحلف ] أي : لا يحلف ( أولو الفضل منكم ) أي : الطول والصدقة والإحسان ) والسعة ) أي : الجدة ( أن يؤتوا أولي القربى والمساكين والمهاجرين في سبيل الله ) أي : لا تحلفوا ألا تصلوا قراباتكم المساكين والمهاجرين . وهذه في غاية الترفق والعطف على صلة الأرحام; ولهذا قال : ( وليعفوا وليصفحوا ) أي : عما تقدم منهم من الإساءة والأذى ، وهذا من حلمه تعالى وكرمه ولطفه بخلقه مع ظلمهم لأنفسهم .\nوهذه الآية نزلت في الصديق ، حين حلف ألا ينفع مسطح بن أثاثة بنافعة بعدما قال في عائشة ما قال ، كما تقدم في الحديث . فلما أنزل الله براءة أم المؤمنين عائشة ، وطابت النفوس المؤمنة واستقرت ، وتاب الله على من كان تكلم من المؤمنين في ذلك ، وأقيم الحد على من أقيم عليه - شرع تبارك وتعالى ، وله الفضل والمنة ، يعطف الصديق على قريبه ونسيبه ، وهو مسطح بن أثاثة ، فإنه كان ابن خالة الصديق ، وكان مسكينا لا مال له إلا ما ينفق عليه أبو بكر ، رضي الله عنه ، وكان من المهاجرين في سبيل الله ، وقد ولق ولقة تاب الله عليه منها ، وضرب الحد عليها . وكان الصديق ، رضي الله عنه ، معروفا بالمعروف ، له الفضل والأيادي على الأقارب والأجانب . فلما نزلت هذه الآية إلى قوله : ( ألا تحبون أن يغفر الله لكم والله غفور رحيم ) أي : فإن الجزاء من جنس العمل ، فكما تغفر عن المذنب إليك نغفر لك ، وكما تصفح نصفح عنك . فعند ذلك قال الصديق : بلى ، والله إنا نحب - يا ربنا - أن تغفر لنا . ثم رجع إلى مسطح ما كان يصله من النفقة ، وقال : والله لا أنزعها منه أبدا ، في مقابلة ما كان قال : والله لا أنفعه بنافعة أبدا ، فلهذا كان الصديق هو الصديق [ رضي الله عنه وعن بنته ] ."
