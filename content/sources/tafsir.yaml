  notes: '« كحال من يصعد في طبقات الجو العليا، فيصاب بضيق شديد في التنفس » (épisode sky)'
  text_ar: فمن يشأ الله أن يوفقه لقَبول الحق يشرح صدره للتوحيد والإيمان، ومن يشأ أن يضله يجعل صدره في حال شديدة من الانقباض عن قَبول الهدى، كحال مَن يصعد في طبقات الجو العليا، فيصاب بضيق شديد في التنفس. وكما يجعل الله صدور الكافرين شديدة الضيق والانقباض، كذلك يجعل العذاب على الذين لا يؤمنون به.
