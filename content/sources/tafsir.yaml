  notes: '« إن الإنسان لِنعم ربه لَجحود » (épisode kanud : « الكلمة دي… معناها: ناكر لنعمة ربه »)'
  text_ar: إن الإنسان لِنعم ربه لَجحود، وإنه بجحوده ذلك لمقر. وإنه لحب المال لشديد.
