  notes: '« فتحنا عليهم أبواب كل شيء من الرزق… استدراجا منا لهم… أخذناهم بالعذاب فجأة » (épisode 1 : la deuxième réponse)'
  text_ar: فلما تركوا العمل بأوامر الله تعالى معرضين عنها، فتحنا عليهم أبواب كل شيء من الرزق فأبدلناهم بالبأساء رخاءً في العيش، وبالضراء صحة في الأجسام; استدراجا منا لهم، حتى إذا بطروا، وأعجبوا بما أعطيناهم من الخير والنعمة أخذناهم بالعذاب فجأة، فإذا هم آيسون منقطعون من كل خير.
