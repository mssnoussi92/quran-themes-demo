  notes: "le sens de 24:22 : ne pas jurer de couper le bien à des proches pauvres « بسبب ذنب فعلوه » ; « ألا تحبون أن يتجاوز الله عنكم؟ فتجاوزوا عنهم » (short 4 de « آية وحكايتها »)"
  text_ar: ولا يحلف أهل الفضل في الدين والسَّعَة في المال على ترك صلة أقربائهم الفقراء والمحتاجين والمهاجرين، ومنعهم النفقة؛ بسبب ذنب فعلوه، ولْيتجاوزوا عن إساءتهم، ولا يعاقبوهم. ألا تحبون أن يتجاوز الله عنكم؟ فتجاوزوا عنهم. والله غفور لعباده، رحيم بهم. وفي هذا الحثُّ على العفو والصفح، ولو قوبل بالإساءة.
- id: tafsir.saadi.24.22
