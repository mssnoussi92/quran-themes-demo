  text_ar: '{ وَمَا تَشَاءُونَ إِلَّا أَنْ يَشَاءَ اللَّهُ رَبُّ الْعَالَمِينَ } أي: فمشيئته نافذة، لا يمكن أن تعارض أو تمانع. وفي هذه الآية وأمثالها رد على فرقتي القدرية النفاة، والقدرية المجبرة كما تقدم مثلها [والله أعلم والحمد لله].'
