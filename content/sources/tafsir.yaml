  status: proposed
  notes: "le mauvais choix « دابة آخر الزمان » est un vrai sens : « علامة من علامات الساعة الكبرى، وهي الدابة » (معاك 5 ثواني, dabba)"
  text_ar: وإذا وجب العذاب عليهم; لتماديهم في المعاصي والطغيان، وإعراضهم عن شرع الله وحكمه، حتى صاروا من شرار خلقه، أخرجنا لهم من الأرض في آخر الزمان علامة من علامات الساعة الكبرى، وهي «الدابة» ، تحدثهم أن الناس المنكرين للبعث كانوا بالقرآن ومحمد صلى الله عليه وسلم ودينه لا يصدقون ولا يعملون.
