  text_ar: "ولهذا قال تعالى : ( يا أيها الذين آمنوا لا تبطلوا صدقاتكم بالمن والأذى ) فأخبر أن الصدقة تبطل بما يتبعها من المن والأذى ، فما يفي ثواب الصدقة بخطيئة المن والأذى .\nثم قال تعالى : ( كالذي ينفق ماله رئاء الناس ) أي : لا تبطلوا صدقاتكم بالمن والأذى ، كما تبطل صدقة من راءى بها الناس ، فأظهر لهم أنه يريد وجه الله وإنما قصده مدح الناس له أو شهرته بالصفات الجميلة ، ليشكر بين الناس ، أو يقال : إنه كريم ونحو ذلك من المقاصد الدنيوية ، مع قطع نظره عن معاملة الله تعالى وابتغاء مرضاته وجزيل ثوابه ; ولهذا قال : ( ولا يؤمن بالله واليوم الآخر )\nثم ضرب تعالى مثل ذلك المرائي بإنفاقه قال الضحاك : والذي يتبع نفقته منا أو أذى فقال : ( فمثله كمثل صفوان ) وهو جمع صفوانة ، ومنهم من يقول : الصفوان يستعمل مفردا أيضا ، وهو الصفا ، وهو الصخر الأملس ( عليه تراب فأصابه وابل ) وهو المطر الشديد ( فتركه صلدا ) أي : فترك الوابل ذلك الصفوان صلدا ، أي : أملس يابسا ، أي : لا شيء عليه من ذلك التراب ، بل قد ذهب كله ، أي : وكذلك أعمال المرائين تذهب وتضمحل عند الله وإن ظهر لهم أعمال فيما يرى الناس كالتراب ; ولهذا قال : ( لا يقدرون على شيء مما كسبوا والله لا يهدي القوم الكافرين ) ."
