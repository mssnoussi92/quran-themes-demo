  notes: "le récit de Mistah et la leçon : « إذا عاملتم عبيده بالعفو والصفح عاملكم بذلك » ; « لا تترك النفقة والإحسان بمعصية الإنسان » (short 4 de « آية وحكايتها »)"
  text_ar: '{ وَلَا يَأْتَلِ } أي: لا يحلف { أُولُو الْفَضْلِ مِنْكُمْ وَالسَّعَةِ أَنْ يُؤْتُوا أُولِي الْقُرْبَى وَالْمَسَاكِينَ وَالْمُهَاجِرِينَ فِي سَبِيلِ اللَّهِ وَلْيَعْفُوا وَلْيَصْفَحُوا } كان من جملة الخائضين في الإفك " مسطح بن أثاثة " وهو قريب لأبي بكر الصديق رضي الله عنه، وكان مسطح فقيرا من المهاجرين في سبيل الله، فحلف أبو بكر أن لا ينفق عليه، لقوله الذي قال. فنزلت هذه الآية، ينهاهم عن هذا الحلف المتضمن لقطع النفقة عنه، ويحثه على العفو والصفح، ويعده بمغفرة الله إن غفر له، فقال: { أَلَا تُحِبُّونَ أَنْ يَغْفِرَ اللَّهُ لَكُمْ وَاللَّهُ غَفُورٌ رَحِيمٌ } إذا عاملتم عبيده، بالعفو والصفح، عاملكم بذلك، فقال أبو بكر - لما سمع هذه الآية-: بلى، والله إني لأحب أن يغفر الله لي، فرجع النفقة إلى مسطح، وفي هذه الآية دليل على النفقة على القريب، وأنه لا تترك النفقة والإحسان بمعصية الإنسان، والحث على العفو والصفح، ولو جرى عليه ما جرى من أهل الجرائم.'
