  text_ar: 'ثم أرسل إليه الرسل، وأنزل عليه الكتب، وهداه الطريق الموصلة إلى الله ، ورغبه فيها، وأخبره بما له عند الوصول إلى الله.ثم أخبره بالطريق الموصلة إلى الهلاك، ورهبه منها، وأخبره بما له إذا سلكها، وابتلاه بذلك، فانقسم الناس إلى شاكر لنعمة الله عليه، قائم بما حمله الله من حقوقه، وإلى كفور لنعمة الله عليه، أنعم الله عليه بالنعم الدينية والدنيوية، فردها، وكفر بربه، وسلك الطريق الموصلة إلى الهلاك.ثم ذكر تعالى حال الفريقين عند الجزاء فقال:'
