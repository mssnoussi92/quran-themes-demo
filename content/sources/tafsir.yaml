  notes: '« فلنحيينه في الدنيا حياة سعيدة مطمئنة، ولو كان قليل المال » (épisode 2 : la première réponse)'
  text_ar: مَن عمل عملا صالحًا ذكرًا كان أم أنثى، وهو مؤمن بالله ورسوله، فلنحيينه في الدنيا حياة سعيدة مطمئنة، ولو كان قليل المال، ولنجزينَّهم في الآخرة ثوابهم بأحسن ما عملوا في الدنيا.
