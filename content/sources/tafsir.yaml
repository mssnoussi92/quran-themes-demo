  status: proposed
  notes: '« وقوموا بذلك على القريب والبعيد، والصديق والعدو »… « لا يحملنكم بغض قوم على ألا تعدلوا » (épisode qist)'
  text_ar: 'أي { يَأَيُّهَا الَّذِينَ آمَنُوا ْ} بما أُمِرُوا بالإيمان به، قوموا بلازم إيمانكم، بأن تكونوا { قَوَّامِينَ لِلَّهِ شُهَدَاءَ بِالْقِسْطِ ْ} بأن تنشط للقيام بالقسط حركاتكم الظاهرة والباطنة. وأن يكون ذلك القيام لله وحده، لا لغرض من الأغراض الدنيوية، وأن تكونوا قاصدين للقسط، الذي هو العدل، لا الإفراط ولا التفريط، في أقوالكم ولا أفعالكم، وقوموا بذلك على القريب والبعيد، والصديق والعدو. { وَلَا يَجْرِمَنَّكُمْ ْ} أي: لا يحملنكم بغض { قَوْمٍ عَلَى أَلَّا تَعْدِلُوا ْ} كما يفعله من لا عدل عنده ولا قسط، بل كما تشهدون لوليكم، فاشهدوا عليه، وكما تشهدون على عدوكم فاشهدوا له، ولو كان كافرا أو مبتدعا، فإنه يجب العدل فيه، وقبول ما يأتي به من الحق، لأنه حق لا لأنه قاله، ولا يرد الحق لأجل قوله، فإن هذا ظلم للحق. { اعْدِلُوا هُوَ أَقْرَبُ لِلتَّقْوَى ْ} أي: كلما حرصتم على العدل واجتهدتم في العمل به، كان ذلك أقرب لتقوى قلوبكم، فإن تم العدل كملت التقوى. { إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ ْ} فمجازيكم بأعمالكم، خيرها وشرها، صغيرها وكبيرها، جزاء عاجلا، وآجلا.'
