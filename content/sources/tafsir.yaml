  notes: '« وإنما حجب قلوبهم عن التصديق به ما غشاها من كثرة ما يرتكبون من الذنوب » (épisode qalb : « قلوب اتقفلت »)'

  text_ar: 'عذاب شديد يومئذ للمكذبين، الذين يكذبون بوقوع يوم الجزاء، وما يكذِّب به إلا كل ظالم كثير الإثم، إذا تتلى عليه آيات القرآن قال: هذه أباطيل الأولين. ليس الأمر كما زعموا، بل هو كلام الله ووحيه إلى نبيه، وإنما حجب قلوبهم عن التصديق به ما غشاها من كثرة ما يرتكبون من الذنوب. ليس الأمر كما زعم الكفار، بل إنهم يوم القيامة عن رؤية ربهم- جل وعلا- لمحجوبون، (وفي هذه الآية دلالة على رؤية المؤمنين ربَّهم في الجنة) ثم إنهم لداخلو النار يقاسون حرها، ثم يقال لهم: هذا الجزاء الذي كنتم به تكذبون.'
