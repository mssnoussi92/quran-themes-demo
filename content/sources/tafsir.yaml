  text_ar: لا تظن -أيها الرسول- أن قصة أصحاب الكهف واللوح الذي كُتِبت فيه أسماؤهم من آياتنا عجيبة وغريبة؛ فإن خلق السموات والأرض وما فيهما أعجب من ذلك.
- id: tafsir.muyassar.18.21
  type: tafsir
  ref: {edition: muyassar, surah: 18, ayah: 21}
  url: https://quran.com/18:21/tafsirs/ar-tafsir-muyassar
