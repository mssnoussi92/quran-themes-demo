  notes: "le sens de « سيارة » : « قافلة تريد مصر » (معاك ٥ ثواني, sayyara)"
  text_ar: 'أي: مكث يوسف في الجب ما مكث، حتى { جَاءَتْ سَيَّارَةٌ } أي: قافلة تريد مصر، { فَأَرْسَلُوا وَارِدَهُمْ } أي: فرطهم ومقدمهم، الذي يعس لهم المياه، ويسبرها ويستعد لهم بتهيئة الحياض ونحو ذلك، { فَأَدْلَى } ذلك الوارد { دَلْوَهُ } فتعلق فيه يوسف عليه السلام وخرج. { قَالَ يَا بُشْرَى هَذَا غُلَامٌ } أي: استبشر وقال: هذا غلام نفيس، { وَأَسَرُّوهُ بِضَاعَةً }'
