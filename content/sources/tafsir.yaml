  notes: "« فأثبت تعالى للعباد مشيئة حقيقة وفعلا، وجعل ذلك تابعا لمشيئته » : la réponse du film (short 2 `shaa`, conclusion) ; film « مخيّر ولا مسيّر؟ » (qadar, 2026-11-17)"
  text_ar: '{ وَمَا يَذْكُرُونَ إِلَّا أَنْ يَشَاءَ اللَّهُ } فإن مشيئته نافذة عامة، لا يخرج عنها حادث قليل ولا كثير، ففيها رد على القدرية، الذين لا يدخلون أفعال العباد تحت مشيئة الله، والجبرية الذين يزعمون أنه ليس للعبد مشيئة، ولا فعل حقيقة، وإنما هو مجبور على أفعاله، فأثبت تعالى للعباد مشيئة حقيقة وفعلا، وجعل ذلك تابعا لمشيئته، { هُوَ أَهْلُ التَّقْوَى وَأَهْلُ الْمَغْفِرَةِ } أي: هو أهل أن يتقى ويعبد، لأنه الإله الذي لا تنبغي العبادة إلا له، وأهل أن يغفر لمن اتقاه واتبع رضاه. تم تفسير سورة المدثر ولله الحمد'
