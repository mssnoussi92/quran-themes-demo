  notes: "l'aisance « يقارنه ويصاحبه » ; « العسر » défini, « يسرا » indéfini et répété : « فلن يغلب عسر يسرين » (passage commun à 94:5-6) (pilote « une image, puis le verset » (2026-11-15))"
  text_ar: '{ فَإِنَّ مَعَ الْعُسْرِ يُسْرًا إِنَّ مَعَ الْعُسْرِ يُسْرًا } بشارة عظيمة، أنه كلما وجد عسر وصعوبة، فإن اليسر يقارنه ويصاحبه، حتى لو دخل العسر جحر ضب لدخل عليه اليسر، فأخرجه كما قال تعالى: { سَيَجْعَلُ اللَّهُ بَعْدَ عُسْرٍ يُسْرًا } وكما قال النبي صلى الله عليه وسلم: \" وإن الفرج مع الكرب، وإن مع العسر يسرا \" .وتعريف \" العسر \" في الآيتين، يدل على أنه واحد، وتنكير \" اليسر \" يدل على تكراره، فلن يغلب عسر يسرين.وفي تعريفه بالألف واللام، الدالة على الاستغراق والعموم يدل على أن كل عسر -وإن بلغ من الصعوبة ما بلغ- فإنه في آخره التيسير ملازم له.'
