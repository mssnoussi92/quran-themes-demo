  text_ar: 'قوله تعالى : يا أيها الذين آمنوا اجتنبوا كثيرا من الظن إن بعض الظن إثم ولا تجسسوا ولا يغتب بعضكم بعضا أيحب أحدكم أن يأكل لحم أخيه ميتا فكرهتموه واتقوا الله إن الله تواب رحيم .فيه عشر مسائل :الأولى : قوله تعالى : يا أيها الذين آمنوا اجتنبوا كثيرا من الظن قيل : إنها نزلت في رجلين من أصحاب النبي - صلى الله عليه وسلم - اغتابا رفيقهما . وذلك أن النبي - صلى الله عليه وسلم - كان إذا سافر ضم الرجل المحتاج إلى الرجلين الموسرين فيخدمهما . فضم سلمان إلى رجلين ، فتقدم سلمان إلى المنزل فغلبته عيناه فنام ولم يهيئ لهما شيئا ، فجاءا فلم يجدا طعاما وإداما ، فقالا له : انطلق فاطلب لنا من النبي - صلى الله عليه وسلم - طعاما وإداما ، فذهب فقال له النبي - صلى الله عليه وسلم - : اذهب إلى أسامة بن زيد فقل له إن كان عندك فضل من طعام فليعطك وكان أسامة خازن النبي - صلى الله عليه وسلم - ، فذهب إليه ، فقال أسامة : ما عندي شيء ، فرجع إليهما فأخبرهما ، فقالا : قد كان عنده ولكنه بخل . ثم بعثا [ ص: 300 ] سلمان إلى طائفة من الصحابة فلم يجد عندهم شيئا ، فقالا : لو بعثنا سلمان إلى بئر سميحة لغار ماؤها . ثم انطلقا يتجسسان هل عند أسامة شيء ، فرآهما النبي - صلى الله عليه وسلم - فقال : ( ما لي أرى خضرة اللحم في أفواهكما ) فقالا : يا نبي الله ، والله ما أكلنا في يومنا هذا لحما ولا غيره . فقال : ( ولكنكما ظلتما تأكلان لحم سلمان وأسامة ) فنزلت : يا أيها الذين آمنوا اجتنبوا كثيرا من الظن إن بعض الظن إثم ذكره الثعلبي . أي : لا تظنوا بأهل الخير سوءا إن كنتم تعلمون من ظاهر أمرهم الخير .الثانية : ثبت في الصحيحين عن أبي هريرة أن النبي - صلى الله عليه وسلم - قال : إياكم والظن فإن الظن أكذب الحديث ولا تحسسوا ولا تجسسوا ولا تناجشوا ولا تحاسدوا ولا تباغضوا ولا تدابروا وكونوا عباد الله إخوانا لفظ البخاري . قال علماؤنا : فالظن هنا وفي الآية هو التهمة . ومحل التحذير والنهي إنما هو تهمة لا سبب لها يوجبها ، كمن يتهم بالفاحشة أو بشرب الخمر مثلا ولم يظهر عليه ما يقتضي ذلك . ودليل كون الظن هنا بمعنى التهمة قوله تعالى : ولا تجسسوا وذلك أنه قد يقع له خاطر التهمة ابتداء ويريد أن يتجسس خبر ذلك ويبحث عنه ، ويتبصر ويستمع لتحقيق ما وقع له من تلك التهمة . فنهى النبي - صلى الله عليه وسلم - عن ذلك . وإن شئت قلت : والذي يميز الظنون التي يجب اجتنابها عما سواها ، أن كل ما لم تعرف له أمارة صحيحة وسبب ظاهر كان حراما واجب الاجتناب . وذلك إذا كان المظنون به ممن شوهد منه الستر والصلاح ، وأونست منه الأمانة في الظاهر ، فظن الفساد به والخيانة محرم ، بخلاف من اشتهره الناس بتعاطي الريب والمجاهرة بالخبائث .وعن النبي - صلى الله عليه وسلم - أن الله حرم من المسلم دمه وعرضه وأن يظن به ظن السوء . وعن الحسن : كنا في زمن الظن بالناس فيه حرام ، وأنت اليوم في زمن اعمل واسكت وظن في الناس ما شئت .الثالثة : للظن حالتان : حالة تعرف وتقوى بوجه من وجوه الأدلة فيجوز الحكم بها ، وأكثر أحكام الشريعة مبنية على غلبة الظن ، كالقياس وخبر الواحد وغير ذلك من قيم المتلفات وأروش الجنايات . والحالة الثانية : أن يقع في النفس شيء من غير دلالة فلا يكون ذلك أولى من ضده ، فهذا هو الشك ، فلا يجوز الحكم به ، وهو المنهي عنه على ما قررناه آنفا . وقد أنكرت جماعة من المبتدعة تعبد الله بالظن وجواز العمل به ، تحكما في الدين ودعوى في المعقول . وليس في ذلك أصل يعول عليه ، فإن البارئ تعالى لم يذم جميعه ، وإنما أورد الذم [ ص: 301 ] في بعضه . وربما تعلقوا بحديث أبي هريرة إياكم والظن فإن هذا لا حجة فيه ; لأن الظن في الشريعة قسمان : محمود ومذموم ، فالمحمود منه ما سلم معه دين الظان والمظنون به عند بلوغه . والمذموم ضده ، بدلالة قوله تعالى : إن بعض الظن إثم ، وقوله : لولا إذ سمعتموه ظن المؤمنون والمؤمنات بأنفسهم خيرا ، وقوله : وظننتم ظن السوء وكنتم قوما بورا وقال النبي - صلى الله عليه وسلم - : إذا كان أحدكم مادحا أخاه فليقل أحسب كذا ولا أزكي على الله أحدا . وقال : إذا ظننت فلا تحقق وإذا حسدت فلا تبغ وإذا تطيرت فامض خرجه أبو داود . وأكثر العلماء على أن الظن القبيح بمن ظاهره الخير لا يجوز ، وأنه لا حرج في الظن القبيح بمن ظاهره القبيح ، قاله المهدوي .الرابعة : قوله تعالى : ولا تجسسوا قرأ أبو رجاء والحسن باختلاف وغيرهما ( ولا تحسسوا ) بالحاء . واختلف هل هما بمعنى واحد أو بمعنيين ، فقال الأخفش : ليس تبعد إحداهما من الأخرى ; لأن التجسس البحث عما يكتم عنك . والتحسس ( بالحاء ) طلب الأخبار والبحث عنها . وقيل : إن التجسس ( بالجيم ) هو البحث ، ومنه قيل : رجل جاسوس إذا كان يبحث عن الأمور . وبالحاء : هو ما أدركه الإنسان ببعض حواسه . وقول ثان في الفرق : أنه بالحاء تطلبه لنفسه ، وبالجيم أن يكون رسولا لغيره ، قاله ثعلب . والأول أعرف . جسست الأخبار وتجسستها أي : تفحصت عنها ، ومنه الجاسوس . ومعنى الآية : خذوا ما ظهر ولا تتبعوا عورات المسلمين ، أي : لا يبحث أحدكم عن عيب أخيه حتى يطلع عليه بعد أن ستره الله . وفي كتاب أبي داود عن معاوية قال سمعت رسول الله - صلى الله عليه وسلم - يقول : إنك إن اتبعت عورات الناس أفسدتهم أو كدت تفسدهم فقال أبو الدرداء : كلمة سمعها معاوية من رسول الله - صلى الله عليه وسلم - نفعه الله تعالى بها . وعن المقدام بن معدي كرب عن أبي أمامة عن النبي - صلى الله عليه وسلم - قال : ( إن الأمير إذا ابتغى الريبة في الناس أفسدهم ) . وعن زيد بن وهب قال : أتي ابن مسعود فقيل : هذا [ ص: 302 ] فلان تقطر لحيته خمرا . فقال عبد الله : إنا قد نهينا عن التجسس ، ولكن إن يظهر لنا شيء نأخذ به . وعن أبي برزة الأسلمي قال : قال رسول الله - صلى الله عليه وسلم - : يا معشر من آمن بلسانه ولم يدخل الإيمان قلبه لا تغتابوا المسلمين ولا تتبعوا عوراتهم ، فإن من اتبع عوراتهم يتبع الله عورته ومن يتبع الله عورته يفضحه في بيته . وقال عبد الرحمن بن عوف : حرست ليلة مع عمر بن الخطاب - رضي الله عنه - بالمدينة إذ تبين لنا سراج في بيت بابه مجاف على قوم لهم أصوات مرتفعة ولغط ، فقال عمر : هذا بيت ربيعة بن أمية بن خلف ، وهم الآن شرب فما ترى! ؟ قلت : أرى أنا قد أتينا ما نهى الله عنه ، قال الله تعالى : ولا تجسسوا وقد تجسسنا ، فانصرف عمر وتركهم . وقال أبو قلابة : حدث عمر بن الخطاب أن أبا محجن الثقفي يشرب الخمر مع أصحاب له في بيته ، فانطلق عمر حتى دخل عليه ، فإذا ليس عنده إلا رجل ، فقال أبو محجن : إن هذا لا يحل لك! قد نهاك الله عن التجسس ، فخرج عمر وتركه . وقال زيد بن أسلم : خرج عمر وعبد الرحمن يعسان ، إذ تبينت لهما نار فاستأذنا ففتح الباب ، فإذا رجل وامرأة تغني وعلى يد الرجل قدح ، فقال عمر : وأنت بهذا يا فلان ؟ فقال : وأنت بهذا يا أمير المؤمنين! قال عمر : فمن هذه منك ؟ قال امرأتي ، قال فما في هذا القدح ؟ قال ماء زلال ، فقال للمرأة : وما الذي تغنين ؟ فقالت :تطاول هذا الليل واسود جانبه وأرقني أن لا خليل ألاعبه فوالله لولا الله أني أراقبهلزعزع من هذا السرير جوانبه ولكن عقلي والحياء يكفنيوأكرم بعلي أن تنال مراكبهثم قال الرجل : ما بهذا أمرنا يا أمير المؤمنين! قال الله تعالى : ولا تجسسوا قال صدقت .قلت : لا يفهم من هذا الخبر أن المرأة كانت غير زوجة الرجل ; لأن عمر لا يقر على الزنى ، وإنما غنت بتلك الأبيات تذكارا لزوجها ، وأنها قالتها في مغيبه عنها . والله أعلم .وقال عمرو بن دينار : كان رجل من أهل المدينة له أخت فاشتكت ، فكان يعودها فماتت فدفنها . فكان هو الذي نزل في قبرها ، فسقط من كمه كيس فيه دنانير ، فاستعان ببعض أهله فنبشوا [ ص: 303 ] قبرها فأخذ الكيس ثم قال : لأكشفن حتى أنظر ما آل حال أختي إليه ، فكشف عنها فإذا القبر مشتعل نارا ، فجاء إلى أمه فقال : أخبريني ما كان عمل أختي ؟ فقالت : قد ماتت أختك فما سؤالك عن عملها! فلم يزل بها حتى قالت له : كان من عملها أنها كانت تؤخر الصلاة عن مواقيتها ، وكانت إذا نام الجيران قامت إلى بيوتهم فألقمت أذنها أبوابهم ، فتجسس عليهم وتخرج أسرارهم ، فقال : بهذا هلكت !الخامسة : قوله تعالى : ولا يغتب بعضكم بعضا نهى - عز وجل - عن الغيبة ، وهي أن تذكر الرجل بما فيه ، فإن ذكرته بما ليس فيه فهو البهتان . ثبت معناه في صحيح مسلم عن أبي هريرة أن رسول الله - صلى الله عليه وسلم - قال : أتدرون ما الغيبة ؟ قالوا : الله ورسوله أعلم . قال : ذكرك أخاك بما يكره قيل : أفرأيت إن كان في أخي ما أقول ؟ قال : إن كان فيه ما تقول فقد اغتبته وإن لم يكن فيه فقد بهته . يقال : اغتابه اغتيابا إذا وقع فيه ، والاسم الغيبة ، وهي ذكر العيب بظهر الغيب .قال الحسن : الغيبة ثلاثة أوجه كلها في كتاب الله تعالى : الغيبة والإفك والبهتان . فأما الغيبة فهو أن تقول في أخيك ما هو فيه . وأما الإفك فأن تقول فيه ما بلغك عنه . وأما البهتان فأن تقول فيه ما ليس فيه .وعن شعبة قال : قال لي معاوية - يعني ابن قرة - : لو مر بك رجل أقطع ، فقلت هذا أقطع كان غيبة . قال شعبة : فذكرته لأبي إسحاق فقال صدق . وروى أبو هريرة أن الأسلمي ماعزا جاء إلى النبي - صلى الله عليه وسلم - فشهد على نفسه بالزنى فرجمه رسول الله - صلى الله عليه وسلم - . فسمع نبي الله - صلى الله عليه وسلم - رجلين من أصحابه يقول أحدهما للآخر : انظر إلى هذا الذي ستر الله عليه فلم تدعه نفسه حتى رجم رجم الكلب ، فسكت عنهما . ثم سار ساعة حتى مر بجيفة حمار شائل برجله فقال : أين فلان وفلان ؟ فقالا : نحن ذا يا رسول الله ، قال : انزلا فكلا من جيفة هذا الحمار فقالا : يا نبي الله ومن يأكل من هذا! قال : فما نلتما من عرض أخيكما أشد من الأكل منه والذي نفسي بيده إنه الآن لفي أنهار الجنة ينغمس فيها .السادسة : قوله تعالى : أيحب أحدكم أن يأكل لحم أخيه ميتا مثل الله الغيبة بأكل الميتة ; لأن الميت لا يعلم بأكل لحمه كما أن الحي لا يعلم بغيبة من اغتابه .وقال ابن عباس : إنما ضرب الله هذا المثل للغيبة لأن أكل لحم الميت حرام مستقذر ، وكذا الغيبة حرام [ ص: 304 ] في الدين وقبيح في النفوس . وقال قتادة : كما يمتنع أحدكم أن يأكل لحم أخيه ميتا كذلك يجب أن يمتنع من غيبته حيا . واستعمل أكل اللحم مكان الغيبة لأن عادة العرب بذلك جارية . قال الشاعر [ المقنع الكندي ] :فإن أكلوا لحمي وفرت لحومهم وإن هدموا مجدي بنيت لهم مجداوقال - صلى الله عليه وسلم - : ما صام من ظل يأكل لحوم الناس . فشبه الوقيعة في الناس بأكل لحومهم . فمن تنقص مسلما أو ثلم عرضه فهو كالآكل لحمه حيا ، ومن اغتابه فهو كالآكل لحمه ميتا . وفي كتاب أبي داود عن أنس بن مالك قال : قال رسول الله - صلى الله عليه وسلم - : لما عرج بي مررت بقوم لهم أظفار من نحاس يخمشون وجوههم وصدورهم فقلت من هؤلاء يا جبريل ؟ قال هؤلاء الذين يأكلون لحوم الناس ويقعون في أعراضهم . وعن المستورد أن رسول الله - صلى الله عليه وسلم - قال : من أكل برجل مسلم أكلة فإن الله يطعمه مثلها من جهنم ومن كسي ثوبا برجل مسلم فإن الله يكسوه مثله من جهنم ومن أقام برجل مقام سمعة ورياء فإن الله يقوم به مقام سمعة ورياء يوم القيامة . وقد تقدم قوله - صلى الله عليه وسلم - : يا معشر من آمن بلسانه ولم يدخل الإيمان قلبه لا تغتابوا المسلمين . وقوله للرجلين : ما لي أرى خضرة اللحم في أفواهكما . وقال أبو قلابة الرقاشي : سمعت أبا عاصم يقول : ما اغتبت أحدا مذ عرفت ما في الغيبة . وكان ميمون بن سياه لا يغتاب أحدا ، ولا يدع أحدا يغتاب أحدا عنده ، ينهاه فإن انتهى وإلا قام . وذكر الثعلبي من حديث أبي هريرة قال : قام رجل من عند النبي - صلى الله عليه وسلم - فرأوا في قيامه عجزا فقالوا : يا رسول الله ما أعجز فلانا! فقال : أكلتم لحم أخيكم واغتبتموه . وعن سفيان الثوري قال : أدنى الغيبة أن تقول إن فلانا جعد قطط ، إلا أنه يكره ذلك . وقال عمر بن الخطاب - رضي الله عنه - : إياكم وذكر الناس فإنه داء ، وعليكم بذكر الله فإنه شفاء . وسمع علي بن الحسين - رضي الله عنهما رجلا يغتاب آخر ، فقال : إياك والغيبة فإنها إدام كلاب الناس . وقيل : لعمرو بن عبيد : لقد وقع فيك فلان حتى رحمناك ، قال : إياه فارحموا . وقال رجل للحسن : بلغني أنك تغتابني! فقال : لم يبلغ قدرك عندي أن أحكمك في حسناتي .[ ص: 305 ] السابعة : ذهب قوم إلى أن الغيبة لا تكون إلا في الدين ولا تكون في الخلقة والحسب . وقالوا : ذلك فعل الله به . وذهب آخرون إلى عكس هذا فقالوا : لا تكون الغيبة إلا في الخلق والخلق والحسب . والغيبة في الخلق أشد ; لأن من عيب صنعة فإنما عيب صانعها . وهذا كله مردود . أما الأول فيرده حديث عائشة حين قالت في صفية : إنها امرأة قصيرة ، فقال لها النبي - صلى الله عليه وسلم - : لقد قلت كلمة لو مزج بها البحر لمزجته . خرجه أبو داود . وقال فيه الترمذي : حديث حسن صحيح ، وما كان في معناه حسب ما تقدم . وإجماع العلماء قديما على أن ذلك غيبة إذا أريد به العيب . وأما الثاني فمردود أيضا عند جميع العلماء ; لأن العلماء من أول الدهر من أصحاب رسول الله - صلى الله عليه وسلم - والتابعين بعدهم لم تكن الغيبة عندهم في شيء أعظم من الغيبة في الدين ; لأن عيب الدين أعظم العيب ، فكل مؤمن يكره أن يذكر في دينه أشد مما يكره في بدنه . وكفى ردا لمن قال هذا القول قوله - عليه السلام - : إذا قلت في أخيك ما يكره فقد اغتبته . . . الحديث . فمن زعم أن ذلك ليس بغيبة فقد رد ما قال النبي - صلى الله عليه وسلم - نصا . وكفى بعموم قول النبي - صلى الله عليه وسلم - : دماؤكم وأموالكم وأعراضكم عليكم حرام وذلك عام للدين والدنيا . وقول النبي : من كانت عنده لأخيه مظلمة في عرضه أو ماله فليتحلله منه . فعم كل عرض ، فمن خص من ذلك شيئا دون شيء فقد عارض ما قال النبي صلى الله عليه وسلم .الثامنة : لا خلاف أن الغيبة من الكبائر ، وأن من اغتاب أحدا عليه أن يتوب إلى الله عز وجل . وهل يستحل المغتاب ؟ اختلف فيه ، فقالت فرقة : ليس عليه استحلاله ، وإنما هي خطيئة بينه وبين ربه . واحتجت بأنه لم يأخذ من ماله ولا أصاب من بدنه ما ينقصه ، فليس ذلك بمظلمة يستحلها منه ، وإنما المظلمة ما يكون منه البدل والعوض في المال والبدن . وقالت فرقة : هي مظلمة ، وكفارتها الاستغفار لصاحبها الذي اغتابه . واحتجت بحديث يروى عن الحسن قال : كفارة الغيبة أن تستغفر لمن اغتبته . وقالت فرقة : هي مظلمة وعليه الاستحلال منها . واحتجت بقول النبي - صلى الله عليه وسلم - : من كانت لأخيه عنده مظلمة في عرض أو مال فليتحلله منه من قبل أن يأتي يوم ليس هناك دينار ولا درهم يؤخذ من حسناته فإن لم يكن له حسنات أخذ من سيئات صاحبه فزيد على سيئاته . خرجه البخاري من حديث أبي هريرة - رضي الله عنه - [ ص: 306 ] قال : قال رسول الله - صلى الله عليه وسلم - : من كانت له مظلمة لأخيه من عرضه أو شيء فليتحلله منه اليوم قبل ألا يكون له دينار ولا درهم إن كان له عمل صالح أخذ منه بقدر مظلمته وإن لم يكن له حسنات أخذ من سيئات صاحبه فحمل عليه . وقد تقدم هذا المعنى في سورة ( آل عمران ) عند قوله تعالى : ولا تحسبن الذين قتلوا في سبيل الله أمواتا بل أحياء . وقد روي من حديث عائشة أن امرأة دخلت عليها فلما قامت قالت امرأة : ما أطول ذيلها! فقالت لها عائشة : لقد اغتبتيها فاستحليها . فدلت الآثار عن النبي - صلى الله عليه وسلم - أنها مظلمة يجب على المغتاب استحلالها . وأما قول من قال : إنما الغيبة في المال والبدن ، فقد أجمعت العلماء على أن على القاذف للمقذوف مظلمة يأخذه بالحد حتى يقيمه عليه ، وذلك ليس في البدن ولا في المال ، ففي ذلك دليل على أن الظلم في العرض والبدن والمال ، وقد قال الله تعالى في القاذف : فإذ لم يأتوا بالشهداء فأولئك عند الله هم الكاذبون . وقد قال رسول الله - صلى الله عليه وسلم - : من بهت مؤمنا بما ليس فيه حبسه الله في طينة الخبال . وذلك كله في غير المال والبدن . وأما من قال : إنها مظلمة ، وكفارة المظلمة أن يستغفر لصاحبها ، فقد ناقض إذ سماها مظلمة ثم قال : كفارتها أن يستغفر لصاحبها ; لأن قوله مظلمة تثبت ظلامة المظلوم ، فإذا ثبتت الظلامة لم يزلها عن الظالم إلا إحلال المظلوم له . وأما قول الحسن فليس بحجة ، وقد قال النبي - صلى الله عليه وسلم - : من كانت له عند أخيه مظلمة في عرض أو مال فليتحللها منه .وقد ذهب بعضهم إلى ترك التحليل لمن سأله ، ورأى أنه لا يحل ما حرم الله عليه ، منهم سعيد بن المسيب قال : لا أحلل من ظلمني . وقيل : لابن سيرين : يا أبا بكر ، هذا رجل سألك أن تحلله من مظلمة هي لك عنده ، فقال : إني لم أحرمها عليه فأحلها ، إن الله حرم الغيبة عليه ، وما كنت لأحل ما حرم الله عليه أبدا . وخبر النبي - صلى الله عليه وسلم - يدل على التحليل ، وهو الحجة والمبين . والتحليل يدل على الرحمة وهو من وجه العفو ، وقد قال تعالى : فمن عفا وأصلح فأجره على الله .التاسعة : ليس من هذا الباب غيبة الفاسق المعلن به المجاهر ، فإن في الخبر من ألقى جلباب الحياء فلا غيبة له . وقال - صلى الله عليه وسلم - : اذكروا الفاجر بما فيه كي يحذره الناس . [ ص: 307 ] فالغيبة إذا في المرء الذي يستر نفسه . وروي عن الحسن أنه قال : ثلاثة ليس لهم حرمة : صاحب الهوى ، والفاسق المعلن ، والإمام الجائر . وقال الحسن لما مات الحجاج : اللهم أنت أمته فاقطع عنا سنته - وفي رواية شينه - فإنه أتانا أخيفش أعيمش ، يمد بيد قصيرة البنان ، والله ما عرق فيها غبار في سبيل الله ، يرجل جمته ويخطر في مشيته ، ويصعد المنبر فيهدر حتى تفوته الصلاة . لا من الله يتقي ، ولا من الناس يستحي ، فوقه الله وتحته مائة ألف أو يزيدون ، لا يقول له قائل : الصلاة أيها الرجل . ثم يقول الحسن : هيهات! حال دون ذلك السيف والسوط . وروى الربيع بن صبيح عن الحسن قال : ليس لأهل البدع غيبة . وكذلك قولك للقاضي تستعين به على أخذ حقك ممن ظلمك فتقول فلان ظلمني أو غضبني أو خانني أو ضربني أو قذفني أو أساء إلي ، ليس بغيبة . وعلماء الأمة على ذلك مجمعة . وقال النبي - صلى الله عليه وسلم - في ذلك : لصاحب الحق مقال . وقال : مطل الغني ظلم وقال لي الواجد يحل عرضه وعقوبته . ومن ذلك الاستفتاء ، كقول هند للنبي - صلى الله عليه وسلم - : إن أبا سفيان رجل شحيح لا يعطيني ما يكفيني أنا وولدي ، فآخذ من غير علمه ؟ فقال النبي - صلى الله عليه وسلم - : نعم فخذي . فذكرته بالشح والظلم لها ولولدها ، ولم يرها مغتابة ; لأنه لم يغير عليها ، بل أجابها عليه الصلاة والسلام بالفتيا لها . وكذلك إذا كان في ذكره بالسوء فائدة ، كقوله - صلى الله عليه وسلم - : أما معاوية فصعلوك لا مال له وأما أبو جهم فلا يضع عصاه عن عاتقه . فهذا جائز ، وكان مقصوده ألا تغتر فاطمة بنت قيس بهما . قال جميعه المحاسبي رحمه الله .العاشرة : قوله تعالى : ميتا وقرئ ( ميتا ) وهو نصب على الحال من اللحم . ويجوز أن ينصب على الأخ ، ولما قررهم - عز وجل - بأن أحدا منهم لا يجب أكل جيفة أخيه عقب [ ص: 308 ] ذلك بقوله تعالى : فكرهتموه وفيه وجهان : أحدهما : فكرهتم أكل الميتة فكذلك فاكرهوا الغيبة ، روي معناه عن مجاهد . الثاني : فكرهتم أن يغتابكم الناس فاكرهوا غيبة الناس . وقال الفراء : أي : فقد كرهتموه فلا تفعلوه . وقيل : لفظه خبر ومعناه أمر ، أي : اكرهوه . واتقوا الله عطف عليه . وقيل : عطف على قوله : اجتنبوا . ولا تجسسوا إن الله تواب رحيم'
