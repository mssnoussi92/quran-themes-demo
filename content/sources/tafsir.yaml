  notes: '« القطمير: هو اللفافة التي تكون على نواة التمرة » (épisode stone : قطمير)'
  text_ar: "وهذا أيضا من قدرته التامة وسلطانه العظيم ، في تسخيره الليل بظلامه والنهار بضيائه ، ويأخذ من طول هذا فيزيده في قصر هذا فيعتدلان . ثم يأخذ من هذا في هذا ، فيطول هذا ويقصر هذا ، ثم يتقارضان صيفا وشتاء ، ( وسخر الشمس والقمر ) أي : والنجوم السيارات ، والثوابت الثاقبات بأضوائهن أجرام السماوات ، الجميع يسيرون بمقدار معين ، وعلى منهاج مقنن محرر ، تقديرا من عزيز عليم .\n( كل يجري لأجل مسمى ) أي : إلى يوم القيامة .\n( ذلكم الله ربكم ) أي : الذي فعل هذا هو الرب العظيم ، الذي لا إله غيره ، ( والذين تدعون من دونه ) أي : من الأنداد والأصنام التي هي على صورة من تزعمون من الملائكة المقربين ، ( ما يملكون من قطمير ) .\nقال ابن عباس ، ومجاهد ، وعكرمة ، وعطاء وعطية العوفي ، والحسن ، وقتادة وغيرهم : القطمير : هو اللفافة التي تكون على نواة التمرة ، أي : لا يملكون من السماوات والأرض شيئا ، ولا بمقدار هذا القطمير ."
- id: tafsir.muyassar.70.19
