  status: proposed
  notes: "« عسى الله أن يردَّ إليَّ أبنائي الثلاثة » : Yusuf, son frère et l'aîné resté en Égypte (معاك 5 ثواني, sabr)"
  text_ar: 'قال لهم: بل زَيَّنَت لكم أنفسكم الأمَّارة بالسوء مكيدة دبَّرتموها كما فعلتم مِن قبل مع يوسف، فصبري صبر جميل لا جزع فيه ولا شكوى معه، عسى الله أن يردَّ إليَّ أبنائي الثلاثة -وهم يوسف وشقيقه وأخوهم الكبير المتخلف من أجل أخيه- إنه هو العليم بحالي، الحكيم في تدبيره.'
- id: tafsir.saadi.12.83
  type: tafsir
  ref: {edition: saadi, surah: 12, ayah: 83}
  url: https://quran.com/12:83/tafsirs/ar-tafseer-al-saddi
