  notes: '« وإنا لموسعون [أيضا] على عبادنا، بالرزق » (épisode universe)'
  text_ar: 'يقول تعالى مبينًا لقدرته العظيمة: {وَالسَّمَاءَ بَنَيْنَاهَا} أي: خلقناها وأتقناها، وجعلناها سقفًا للأرض وما عليها. {بِأَيْدٍ} أي: بقوة وقدرة عظيمة {وَإِنَّا لَمُوسِعُونَ} لأرجائها وأنحائها، وإنا لموسعون [أيضا] على عبادنا، بالرزق الذي ما ترك الله دابة في مهامه القفار، ولجج البحار، وأقطار العالم العلوي والسفلي، إلا وأوصل إليها من الرزق، ما يكفيها، وساق إليها من الإحسان ما يغنيها. فسبحان من عم بجوده جميع المخلوقات، وتبارك الذي وسعت رحمته جميع البريات.'
