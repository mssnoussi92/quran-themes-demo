  notes: "les jinns avaient fait croire qu'ils savaient l'invisible : « فأراد اللّه تعالى أن يُرِيَ العباد كذبهم » ; « المنسأة » = la canne (معاك 5 ثواني, dabba)"
  text_ar: فلم يزل الشياطين يعملون لسليمان, عليه الصلاة والسلام, كل بناء، وكانوا قد موهوا على الإنس, وأخبروهم أنهم يعلمون الغيب, ويطلعون على المكنونات، فأراد اللّه تعالى أن يُرِيَ العباد كذبهم في هذه الدعوى, فمكثوا يعملون على عملهم، وقضى اللّه الموت على سليمان عليه السلام, واتَّكأ على عصاه, وهي المنسأة، فصاروا إذا مروا به وهو متكئ عليها, ظنوه حيا, وهابوه.فغدوا على عملهم كذلك سنة كاملة على ما قيل, حتى سلطت دابة الأرض على عصاه, فلم تزل ترعاها, حتى باد وسقط فسقط سليمان عليه السلام وتفرقت الشياطين وتبينت الإنس أن الجن { لَوْ كَانُوا يَعْلَمُونَ الْغَيْبَ مَا لَبِثُوا فِي الْعَذَابِ الْمُهِينِ } وهو العمل الشاق عليهم، فلو علموا الغيب, لعلموا موت سليمان, الذي هم أحرص شيء عليه, ليسلموا مما هم فيه.
