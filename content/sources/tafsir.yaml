  status: proposed
  notes: "le Diable « زيَّن للإنسان الكفر ودعاه إليه، فلما كفر قال: إني بريء منك » (معاك ٥ ثواني, qalaha)"
  text_ar: 'ومثل هؤلاء المنافقين في إغراء اليهود على القتال ووَعْدهم بالنصر على رسول الله صلى الله عليه وسلم، كمثل الشيطان حين زيَّن للإنسان الكفر ودعاه إليه، فلما كفر قال: إني بريء منك، إني أخاف الله رب الخلق أجمعين.'
