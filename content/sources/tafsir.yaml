  notes: "le sens de 24:15, pour le film « وتحسبونه هيّنًا » (2026-11-21)"
  text_ar: '{ إِذْ تَلَقَّوْنَهُ بِأَلْسِنَتِكُمْ } أي: تلقفونه، ويلقيه بعضكم إلى بعض، وتستوشون حديثه، وهو قول باطل. { وَتَقُولُونَ بِأَفْوَاهِكُمْ مَا لَيْسَ لَكُمْ بِهِ عِلْمٌ } والأمران محظوران، التكلم بالباطل، والقول بلا علم، { وَتَحْسَبُونَهُ هَيِّنًا } فلذلك أقدم عليه من أقدم من المؤمنين الذين تابوا منه، وتطهروا بعد ذلك، { وَهُوَ عِنْدَ اللَّهِ عَظِيمٌ } وهذا فيه الزجر البليغ، عن تعاطي بعض الذنوب على وجه التهاون بها، فإن العبد لا يفيده حسبانه شيئا، ولا يخفف من عقوبة الذنب، بل يضاعف الذنب، ويسهل عليه مواقعته مرة أخرى.'
