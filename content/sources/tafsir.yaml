  notes: '« وفسر الهلوع بأنه: إذا مسه الشر جزوعا » (épisode haluu : le mot expliqué par les versets suivants)'
  text_ar: 'وفسر الهلوع بأنه: { إِذَا مَسَّهُ الشَّرُّ جَزُوعًا } فيجزع إن أصابه فقر أو مرض، أو ذهاب محبوب له، من مال أو أهل أو ولد، ولا يستعمل في ذلك الصبر والرضا بما قضى الله.'
