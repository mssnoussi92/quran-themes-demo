  text_ar: 'أمرهم الله أن يستعينوا في أمورهم كلها بالصبر بجميع أنواعه، وهو الصبر على طاعة الله حتى يؤديها، والصبر عن معصية الله حتى يتركها, والصبر على أقدار الله المؤلمة فلا يتسخطها، فبالصبر وحبس النفس على ما أمر الله بالصبر عليه معونة عظيمة على كل أمر من الأمور, ومن يتصبر يصبره الله، وكذلك الصلاة التي هي ميزان الإيمان, وتنهى عن الفحشاء والمنكر, يستعان بها على كل أمر من الأمور { وَإِنَّهَا } أي: الصلاة { لَكَبِيرَةٌ } أي: شاقة { إِلَّا عَلَى الْخَاشِعِينَ } فإنها سهلة عليهم خفيفة؛ لأن الخشوع, وخشية الله, ورجاء ما عنده يوجب له فعلها, منشرحا صدره لترقبه للثواب, وخشيته من العقاب، بخلاف من لم يكن كذلك, فإنه لا داعي له يدعوه إليها, وإذا فعلها صارت من أثقل الأشياء عليه. والخشوع هو: خضوع القلب وطمأنينته, وسكونه لله تعالى, وانكساره بين يديه, ذلا وافتقارا, وإيمانا به وبلقائه.'
