  notes: "Soulayman vérifie : « سنتأمل فيما جئتنا به من الخبر أصدقت… » (معاك 5 ثواني, hudhud)"
  text_ar: 'قال سليمان للهدهد: سنتأمل فيما جئتنا به من الخبر أصدقت في ذلك أم كنت من الكاذبين فيه؟ اذهب بكتابي هذا إلى أهل «سبأ» فأعطهم إياه، ثم تنحَّ عنهم قريبًا منهم بحيث تسمع كلامهم، فتأمل ما يتردد بينهم من الكلام.'
