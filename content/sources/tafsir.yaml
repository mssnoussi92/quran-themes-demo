  text_ar: '{ آتُونِي زُبَرَ الْحَدِيدِ ْ} أي: قطع الحديد، فأعطوه ذلك. { حَتَّى إِذَا سَاوَى بَيْنَ الصَّدَفَيْنِ ْ} أي: الجبلين اللذين بني بينهما السد { قَالَ انْفُخُوا ْ} النار أي: أوقدوها إيقادا عظيما، واستعملوا لها المنافيخ لتشتد، فتذيب النحاس، فلما ذاب النحاس، الذي يريد أن يلصقه بين زبر الحديد { قَالَ آتُونِي أُفْرِغْ عَلَيْهِ قِطْرًا ْ} أي: نحاسا مذابا، فأفرغ عليه القطر، فاستحكم السد استحكاما هائلا، وامتنع من وراءه من الناس، من ضرر يأجوج ومأجوج.'
