  notes: "la leçon du short 1 : « فجمعوا بين السعي والفرار من الفتنة… وبين تضرعهم وسؤالهم لله تيسير أمورهم، وعدم اتكالهم على أنفسهم وعلى الخلق، فلذلك استجاب الله دعاءهم »"
  text_ar: 'ثم ذكر قصتهم مجملة، وفصلها بعد ذلك فقال: { إِذْ أَوَى الْفِتْيَةُ } أي: الشباب، { إِلَى الْكَهْفِ } يريدون بذلك التحصن والتحرز من فتنة قومهم لهم، { فَقَالُوا رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً } أي تثبتنا بها وتحفظنا من الشر، وتوفقنا للخير { وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا } أي: يسر لنا كل سبب موصل إلى الرشد، وأصلح لنا أمر ديننا ودنيانا، فجمعوا بين السعي والفرار من الفتنة، إلى محل يمكن الاستخفاء فيه، وبين تضرعهم وسؤالهم لله تيسير أمورهم، وعدم اتكالهم على أنفسهم وعلى الخلق، فلذلك استجاب الله دعاءهم'
- id: tafsir.muyassar.18.17
