  text_ar: "هذه الآية الكريمة دالة على أن الله تعالى أرحم بعباده من الوالد بولده لأنه ينهى [ تعالى عن قتل الأولاد كما أوصى بالأولاد في الميراث وكان أهل الجاهلية لا يورثون البنات بل كان أحدهم ربما قتل ابنته لئلا تكثر عيلته فنهى الله [ تعالى عن ذلك فقال : ( ولا تقتلوا أولادكم خشية إملاق ) أي خوف أن تفتقروا في ثاني الحال ولهذا قدم الاهتمام برزقهم فقال ( نحن نرزقهم وإياكم ) وفي الأنعام \" ( ولا تقتلوا أولادكم من إملاق ) أي من فقر ( نحن نرزقكم وإياهم ) [ الأنعام 151\nوقوله : ( إن قتلهم كان خطئا كبيرا ) أي ذنبا عظيما\nوقرأ بعضهم كان خطأ كبيرا وهو بمعناه\nوفي الصحيحين عن عبد الله بن مسعود قلت يا رسول الله أي الذنب أعظم ؟ قال أن تجعل لله ندا وهو خلقك \" قلت ثم أي ؟ قال أن تقتل ولدك خشية أن يطعم معك قلت ثم أي ؟ قال أن تزاني بحليلة جارك \""
