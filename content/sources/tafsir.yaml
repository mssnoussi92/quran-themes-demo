  text_ar: 'يا أيها المؤمنون اطلبوا العون من الله في كل أموركم: بالصبر على النوائب والمصائب، وبالصبر على ترك المعاصي والذنوب، والصبر على الطاعات والقربات، وبالصلاة التي تطمئن بها النفس، وتنهى عن الفحشاء والمنكر. إن الله مع الصابرين بعونه وتوفيقه وتسديده. وفي الآية: إثبات معيَّة الله الخاصة بالمؤمنين، المقتضية لما سلف ذكره; أما المعية العامة، المقتضية للعلم والإحاطة فهي لجميع الخلق.'
