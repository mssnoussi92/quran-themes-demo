  notes: '« من انشرح صدره للإسلام… فإن هذا علامة على أن الله قد هداه » (épisode sky)'
  text_ar: 'يقول تعالى -مبينا لعباده علامة سعادة العبد وهدايته، وعلامة شقاوته وضلاله-: إن من انشرح صدره للإسلام، أي: اتسع وانفسح، فاستنار بنور الإيمان، وحيي بضوء اليقين، فاطمأنت بذلك نفسه، وأحب الخير، وطوعت له نفسه فعله، متلذذا به غير مستثقل، فإن هذا علامة على أن الله قد هداه، ومَنَّ عليه بالتوفيق، وسلوك أقوم الطريق. وأن علامة من يرد الله أن يضله، أن يجعل صدره ضيقا حرجا. أي: في غاية الضيق عن الإيمان والعلم واليقين، قد انغمس قلبه في الشبهات والشهوات، فلا يصل إليه خير، لا ينشرح قلبه لفعل الخير كأنه من ضيقه وشدته يكاد يصعد في السماء، أي: كأنه يكلف الصعود إلى السماء، الذي لا حيلة له فيه. وهذا سببه، عدم إيمانهم، هو الذي أوجب أن يجعل الله الرجس عليهم، لأنهم سدوا على أنفسهم باب الرحمة والإحسان، وهذا ميزان لا يعول، وطريق لا يتغير، فإن من أعطى واتقى، وصدق بالحسنى، يسره الله لليسرى، ومن بخل واستغنى وكذب بالحسنى، فسييسره للعسرى.'
