  notes: "« ذكرك أخاك بما يكره ولو كان فيه » ; « الغيبة من الكبائر » (وتحسبونه هيّنًا, ghiba)"
  text_ar: 'نهى الله تعالى عن كثير من الظن السوء بالمؤمنين، فـ { إِنَّ بَعْضَ الظَّنِّ إِثْمٌ } وذلك، كالظن الخالي من الحقيقة والقرينة، وكظن السوء، الذي يقترن به كثير من الأقوال، والأفعال المحرمة، فإن بقاء ظن السوء بالقلب، لا يقتصر صاحبه على مجرد ذلك، بل لا يزال به، حتى يقول ما لا ينبغي، ويفعل ما لا ينبغي، وفي ذلك أيضًا، إساءة الظن بالمسلم، وبغضه، وعداوته المأمور بخلاف ذلك منه.{ وَلَا تَجَسَّسُوا } أي: لا تفتشوا عن عورات المسلمين، ولا تتبعوها، واتركوا المسلم على حاله، واستعملوا التغافل عن أحواله التي إذا فتشت، ظهر منها ما لا ينبغي.{ وَلَا يَغْتَبْ بَعْضُكُمْ بَعْضًا } والغيبة، كما قال النبي صلى الله عليه وسلم: { ذكرك أخاك بما يكره ولو كان فيه } ثم ذكر مثلاً منفرًا عن الغيبة، فقال: { أَيُحِبُّ أَحَدُكُمْ أَنْ يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ } شبه أكل لحمه ميتًا، المكروه للنفوس غاية الكراهة، باغتيابه، فكما أنكم تكرهون أكل لحمه، وخصوصًا إذا كان ميتًا، فاقد الروح، فكذلك، [فلتكرهوا] غيبته، وأكل لحمه حيًا.{ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ تَوَّابٌ رَحِيمٌ } والتواب، الذي يأذن بتوبة عبده، فيوفقه لها، ثم يتوب عليه، بقبول توبته، رحيم بعباده، حيث دعاهم إلى ما ينفعهم، وقبل منهم التوبة، وفي هذه الآية، دليل على التحذير الشديد من الغيبة، وأن الغيبة من الكبائر، لأن الله شبهها بأكل لحم الميت، وذلك من الكبائر.'
