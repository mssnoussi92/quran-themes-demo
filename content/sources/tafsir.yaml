  notes: "le sens de « سيارة » : « جماعة من المسافرين », et le seau où s'accroche Yusuf (معاك ٥ ثواني, sayyara)"
  text_ar: 'وجاءت جماعة من المسافرين، فأرسلوا مَن يطلب لهم الماء، فلما أرسل دلوه في البئر تعلَّق بها يوسف، ففرح وارد الماء وابتهج بالعثور على غلام، وقال: يا بشري هذا غلام نفيس، وأخفى الواردُ وأصحابه يوسفَ عن بقية المسافرين فلم يظهروه لهم، وقالوا: إن هذه بضاعة استبضعناها، والله عليم بما يعملونه بيوسف.'
