  text_ar: 'فرق لهما موسى عليه السلام ورحمهما { فَسَقَى لَهُمَا } غير طالب منهما الأجرة، ولا له قصد غير وجه اللّه تعالى، فلما سقى لهما، وكان ذلك وقت شدة حر، وسط النهار، بدليل قوله: { ثُمَّ تَوَلَّى إِلَى الظِّلِّ } مستريحا لذلك الظلال بعد التعب.{ فَقَالَ } في تلك الحالة، مسترزقا ربه { رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ } أي: إني مفتقر للخير الذي تسوقه إليَّ وتيسره لي. وهذا سؤال منه بحاله، والسؤال بالحال أبلغ من السؤال بلسان المقال، فلم يزل في هذه الحالة داعيا ربه متملقا. وأما المرأتان، فذهبتا إلى أبيهما، وأخبرتاه بما جرى.'
