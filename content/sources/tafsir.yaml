  notes: "« نقل كلام بعض الناس لبعض، لقصد الإفساد بينهم » (وتحسبونه هيّنًا, namima)"
  text_ar: '{ هَمَّازٍ } أي: كثير العيب [للناس] والطعن فيهم بالغيبة والاستهزاء، وغير ذلك.{ مَشَّاءٍ بِنَمِيمٍ } أي: يمشي بين الناس بالنميمة، وهي: نقل كلام بعض الناس لبعض، لقصد الإفساد بينهم، وإلقاء العداوة والبغضاء.'
