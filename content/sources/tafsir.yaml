  notes: "le sens de 107:5 : « عن » صلاتهم et non « في » ; le sahw dans la prière arrive à tous, même au Prophète ﷺ (short sahun)"

  text_ar: 'أي: مضيعون لها، تاركون لوقتها، مفوتون لأركانها وهذا لعدم اهتمامهم بأمر الله حيث ضيعوا الصلاة، التي هي أهم الطاعات وأفضل القربات، والسهو عن الصلاة، هو الذي يستحق صاحبه الذم واللوم وأما السهو في الصلاة، فهذا يقع من كل أحد، حتى من النبي صلى الله عليه وسلم.'
  validated_by: mssnoussi92
