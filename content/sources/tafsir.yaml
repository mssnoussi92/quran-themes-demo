  notes: "la remarque de 'Ata' ibn Dinar sur « عن صلاتهم » et non « في صلاتهم » (short sahun)"

  text_ar: "وقال عطاء بن دينار : والحمد لله الذي قال : ( عن صلاتهم ساهون ) ولم يقل : في صلاتهم ساهون .\nوإما عن وقتها الأول فيؤخرونها إلى آخره دائما أو غالبا . وإما عن أدائها بأركانها وشروطها على الوجه المأمور به . وإما عن الخشوع فيها والتدبر لمعانيها ، فاللفظ يشمل هذا كله ، ولكل من اتصف بشيء من ذلك قسط من هذه الآية . ومن اتصف بجميع ذلك ، فقد تم نصيبه منها ، وكمل له النفاق العملي . كما ثبت في الصحيحين أن رسول الله صلى الله عليه وسلم قال : \" تلك صلاة المنافق ، تلك صلاة المنافق ، تلك صلاة المنافق ، يجلس يرقب الشمس ، حتى إذا كانت بين قرني الشيطان قام فنقر أربعا لا يذكر الله فيها إلا قليلا \" فهذا آخر صلاة العصر التي هي الوسطى ، كما ثبت به النص إلى آخر وقتها ، وهو وقت كراهة ، ثم قام إليها فنقرها نقر الغراب ، لم يطمئن ولا خشع فيها أيضا ; ولهذا قال : \" لا يذكر الله فيها إلا قليلا \" . ولعله إنما حمله على القيام إليها مراءاة الناس ، لا ابتغاء وجه الله ، فهو إذا لم يصل بالكلية . قال تعالى : ( إن المنافقين يخادعون الله وهو خادعهم وإذا قاموا إلى الصلاة قاموا كسالى يراءون الناس ولا يذكرون الله إلا قليلا ) [ النساء : 142 ] ."
  validated_by: mssnoussi92
