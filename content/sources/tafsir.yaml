  notes: "pourquoi ils fuient, « خشية من فتنة قومهم لهم، وإرغامهم على عبادة الأصنام », et ce qu'ils demandent, « رحمة، تثبتنا بها، وتحفظنا من الشر، ويسِّر لنا الطريق الصواب » (caverne, short 1)"
  text_ar: 'اذكر -أيها الرسول- حين لجأ الشبَّان المؤمنون إلى الكهف؛ خشية من فتنة قومهم لهم، وإرغامهم على عبادة الأصنام، فقالوا: ربنا أعطنا مِن عندك رحمة، تثبتنا بها، وتحفظنا من الشر، ويسِّر لنا الطريق الصواب الذي يوصلنا إلى العمل الذي تحب، فنكون راشدين غير ضالين.'
