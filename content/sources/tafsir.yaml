  text_ar: '. ثم قال له مخبرا أنه لا يريد أن يتعرض لقتله، لا ابتداء ولا مدافعة فقال: { لَئِن بَسَطْتَ إِلَيَّ يَدَكَ لِتَقْتُلَنِي مَا أَنَا بِبَاسِطٍ يَدِيَ إِلَيْكَ لِأَقْتُلَكَ } وليس ذلك جبنا مني ولا عجزا. وإنما ذلك لأني { أَخَافُ اللَّهَ رَبَّ الْعَالَمِينَ } والخائف لله لا يقدم على الذنوب، خصوصا الذنوب الكبار. وفي هذا تخويف لمن يريد القتل، وأنه ينبغي لك أن تتقي الله وتخافه.'
