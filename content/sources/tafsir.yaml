  text_ar: 'تفسير الآيتين 38 و 39 :ـحيث ألهمنا أمك أن تقذفك في التابوت وقت الرضاع، خوفا من فرعون، لأنه أمر بذبح أبناء بني إسرائيل، فأخفته أمه، وخافت عليه خوفا شديدا فقذفته في التابوت، ثم قذفته في اليم، أي: شط نيل مصر، فأمر الله اليم، أن يلقيه في الساحل، وقيض أن يأخذه، أعدى الأعداء لله ولموسى، ويتربى في أولاده، ويكون قرة عين لمن رآه، ولهذا قال: { وَأَلْقَيْتُ عَلَيْكَ مَحَبَّةً مِنِّي } فكل من رآه أحبه { وَلِتُصْنَعَ عَلَى عَيْنِي } ولتتربى على نظري وفي حفظي وكلاءتي، وأي نظر وكفالة أجلّ وأكمل، من ولاية البر الرحيم، القادر على إيصال مصالح عبده، ودفع المضار عنه؟! فلا ينتقل من حالة إلى حالة، إلا والله تعالى هو الذي دبّر ذلك لمصلحة موسى،'
