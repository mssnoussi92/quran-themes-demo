  notes: "« اطلعت على ما لم تطلع عليه أنت ولا جنودك » (معاك 5 ثواني, hudhud)"
  text_ar: "يقول تعالى : ( فمكث ) الهدهد ( غير بعيد ) أي : غاب زمانا يسيرا ، ثم جاء فقال لسليمان : ( أحطت بما لم تحط به ) أي : اطلعت على ما لم تطلع عليه أنت ولا جنودك ، ( وجئتك من سبإ بنبإ يقين ) أي : بخبر صدق حق يقين .\nوسبأ : هم : حمير ، وهم ملوك اليمن ."
