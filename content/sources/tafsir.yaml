  text_ar: 'وألْهمنا أم موسى حين ولدته وخشيت عليه أن يذبحه فرعون كما يذبح أبناء بني إسرائيل: أن أرضعيه مطمئنة، فإذا خشيت أن يُعرف أمره فضعيه في صندوق وألقيه في النيل، دون خوف من فرعون وقومه أن يقتلوه، ودون حزن على فراقه، إنا رادُّو ولدك إليك وباعثوه رسولا. فوضعته في صندوق وألقته في النيل، فعثر عليه أعوان فرعون وأخذوه، فكانت عاقبةُ ذلك ما قدره الله بأن يكون موسى عدوا لهم بمخالفة دينهم، وموقعا لهم في الحزن بإغراقهم وزوال ملكهم على يده. إن فرعون وهامان وأعوانهما كانوا آثمين مشركين.'
