  notes: '« وإنا لموسعون لأرجائها وأنحائها » (épisode universe)'
  text_ar: والسماء خلقناها وأتقناها، وجعلناها سَقْفًا للأرض بقوة وقدرة عظيمة، وإنا لموسعون لأرجائها وأنحائها.
