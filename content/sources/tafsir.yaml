  notes: "short dathur : rivalisez vers les causes du pardon, le repentir et l'éloignement des péchés ; le Paradis ne s'obtient que par la miséricorde et la faveur d'Allah, et l'œuvre bonne (« ذكر وحكايته »)"
  text_ar: سابقوا -أيها الناس- في السعي إلى أسباب المغفرة من التوبة النصوح والابتعاد عن المعاصي؛ لِتُجْزَوْا مغفرة من ربكم وجنة عرضها كعرض السماء والأرض، وهي مُعَدَّة للذين وحَّدوا الله واتَّبَعوا رسله، ذلك فضل الله الذي يؤتيه مَن يشاء مِن خلقه، فالجنة لا تُنال إلا برحمة الله وفضله، والعمل الصالح. والله ذو الإحسان والعطاء الكثير الواسع على عباده المؤمنين.
