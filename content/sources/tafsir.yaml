  notes: '« معيشة ضيقة شاقة -وإن ظهر أنه من أهل الفضل واليسار- » (sujet 1 : la première réponse)'
  text_ar: ومن تولَّى عن ذكري الذي أذكِّره به فإن له في الحياة الأولى معيشة ضيِّقة شاقة -وإن ظهر أنه من أهل الفضل واليسار-، ويُضيَّق قبره عليه ويعذَّب فيه، ونحشره يوم القيامة أعمى عن الرؤية وعن الحجة.
