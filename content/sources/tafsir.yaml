  text_ar: 'أي: { قُلْ ْ} يا محمد للكفار وغيرهم: { إِنَّمَا أَنَا بَشَرٌ مِثْلُكُمْ ْ} أي: لست بإله، ولا لي شركة في الملك، ولا علم بالغيب، ولا عندي خزائن الله، { إِنَّمَا أَنَا بَشَرٌ مِثْلُكُمْ ْ} عبد من عبيد ربي، { يُوحَى إِلَيَّ أَنَّمَا إِلَهُكُمْ إِلَهٌ وَاحِدٌ ْ} أي: فضلت عليكم بالوحي، الذي يوحيه الله إلي، الذي أجله الإخبار لكم: أنما إلهكم إله واحد، أي: لا شريك له، ولا أحد يستحق من العبادة مثقال ذرة غيره، وأدعوكم إلى العمل الذي يقربكم منه، وينيلكم ثوابه، ويدفع عنكم عقابه. ولهذا قال: { فَمَنْ كَانَ يَرْجُوا لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا ْ} وهو الموافق لشرع الله، من واجب ومستحب، { وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا ْ} أي: لا يرائي بعمله بل يعمله خالصا لوجه الله تعالى، فهذا الذي جمع بين الإخلاص والمتابعة، هو الذي ينال ما يرجو ويطلب، وأما من عدا ذلك، فإنه خاسر في دنياه وأخراه، وقد فاته القرب من مولاه، ونيل رضاه. آخر تفسير سورة الكهف، ولله الحمد.'
  validated_by: mssnoussi92
