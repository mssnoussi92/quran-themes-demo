  notes: "la leçon de 62:11 : la patience dans l'obéissance ne fait pas perdre la subsistance (short caravan)"
  text_ar: '{ وَإِذَا رَأَوْا تِجَارَةً أَوْ لَهْوًا انْفَضُّوا إِلَيْهَا } أي: خرجوا من المسجد، حرصًا على ذلك اللهو، و [تلك] التجارة، وتركوا الخير، { وَتَرَكُوكَ قَائِمًا } تخطب الناس، وذلك [في] يوم جمعة، بينما النبي صلى الله عليه وسلم يخطب الناس، إذ قدم المدينة، عير تحمل تجارة، فلما سمع الناس بها، وهم في المسجد، انفضوا من المسجد، وتركوا النبي صلى الله عليه وسلم يخطب استعجالًا لما لا ينبغي أن يستعجل له، وترك أدب، { قُلْ مَا عِنْدَ اللَّهِ } من الأجر والثواب، لمن لازم الخير وصبر نفسه على عبادة الله.{ خَيْرٌ مِنَ اللَّهْوِ وَمِنَ التِّجَارَةِ } التي، وإن حصل منها بعض المقاصد، فإن ذلك قليل منغص، مفوت لخير الآخرة، وليس الصبر على طاعة الله مفوتًا للرزق، فإن الله خير الرازقين، فمن اتقى الله رزقه من حيث لا يحتسب.وفي هذه الآيات فوائد عديدة:منها: أن الجمعة فريضة على جميع المؤمنين، يجب عليهم السعي لها، والمبادرة والاهتمام بشأنها.ومنها: أن الخطبتين يوم الجمعة، فريضتان يجب حضورهما، لأنه فسر الذكر هنا بالخطبتين، فأمر الله بالمضي إليه والسعي له.ومنها: مشروعية النداء ليوم الجمعة، والأمر به.ومنها: النهى عن البيع والشراء، بعد نداء الجمعة، وتحريم ذلك، وما ذاك إلا لأنه يفوت الواجب ويشغل عنه، فدل ذلك على أن كل أمر ولو كان مباحًا في الأصل، إذا كان ينشأ عنه تفويت واجب، فإنه لا يجوز في تلك الحال.ومنها: الأمر بحضور الخطبتين يوم الجمعة، وذم من لم يحضرهما، ومن لازم ذلك الإنصات لهما.ومنها: أنه ينبغي للعبد المقبل على عبادة الله، وقت دواعي النفس لحضور اللهو [والتجارات] والشهوات، أن يذكرها بما عند الله من الخيرات، وما لمؤثر رضاه على هواه.تم تفسير سورة الجمعة، ولله الحمد والثناء'
