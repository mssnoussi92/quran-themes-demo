  status: proposed
  notes: "« ثم لجأ إلى حصول الفرج لما رأى أن الأمر اشتد، والكربة انتهت » ; le beau patience « لا يصحبه تسخط ولا جزع، ولا شكوى للخلق » (معاك 5 ثواني, sabr)"
  text_ar: 'فلما رجعوا إلى أبيهم وأخبروه بهذا الخبر، اشتد حزنه وتضاعف كمده، واتهمهم أيضا في هذه القضية، كما اتهمهم في الأولى، و { قَالَ بَلْ سَوَّلَتْ لَكُمْ أَنْفُسُكُمْ أَمْرًا فَصَبْرٌ جَمِيلٌ } أي: ألجأ في ذلك إلى الصبر الجميل، الذي لا يصحبه تسخط ولا جزع، ولا شكوى للخلق، ثم لجأ إلى حصول الفرج لما رأى أن الأمر اشتد، والكربة انتهت فقال: { عَسَى اللَّهُ أَنْ يَأْتِيَنِي بِهِمْ جَمِيعًا } أي: يوسف و "بنيامين" وأخوهم الكبير الذي أقام في مصر. { إِنَّهُ هُوَ الْعَلِيمُ } الذي يعلم حالي، واحتياجي إلى تفريجه ومنَّته، واضطراري إلى إحسانه، { الْحَكِيمُ } الذي جعل لكل شيء قدرا، ولكل أمر منتهى، بحسب ما اقتضته حكمته الربانية.'
