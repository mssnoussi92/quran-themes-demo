  text_ar: ألم يَجِدْك من قبلُ يتيمًا مات أبوك وأنت حمل في بطن أمك، فآواك ورعاك؟ ووجدك لا تدري ما الكتاب ولا الإيمان، فعلَّمك ما لم تكن تعلم، ووفقك لأحسن الأعمال؟ ووجدك فقيرًا، فساق إليك رزقك، وأغنى نفسك بالقناعة والصبر؟
