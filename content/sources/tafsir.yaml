  notes: "« عندي العلم علم ما أحطت به على علمك الواسع وعلى درجتك فيه » (معاك 5 ثواني, hudhud)"
  text_ar: 'فَمَكَثَ غَيْرَ بَعِيدٍ ثم جاء وهذا يدل على هيبة جنوده منه وشدة ائتمارهم لأمره، حتى إن هذا الهدهد الذي خلفه العذر الواضح لم يقدر على التخلف زمنا كثيرا، فَقَالَ لسليمان: أَحَطْتُ بِمَا لَمْ تُحِطْ بِهِ أي: عندي العلم علم ما أحطت به على علمك الواسع وعلى درجتك فيه، وَجِئْتُكَ مِنْ سَبَإٍ القبيلة المعروفة في اليمن بِنَبَإٍ يَقِينٍ أي: خبر متيقن.'
