  status: proposed
  notes: "« ثم ترجى من الله أن يرد عليه أولاده الثلاثة » (معاك 5 ثواني, sabr ; les noms qu'il donne ne sont pas dits)"
  text_ar: "قال لهم كما قال لهم حين جاءوا على قميص يوسف بدم كذب : ( بل سولت لكم أنفسكم أمرا فصبر جميل )\nقال محمد بن إسحاق : لما جاءوا يعقوب وأخبروه بما يجري اتهمهم ، وظن أنها كفعلتهم بيوسف ( قال بل سولت لكم أنفسكم أمرا فصبر جميل ) .\nوقال بعض الناس : لما كان صنيعهم هذا مرتبا على فعلهم الأول ، سحب حكم الأول عليه ، وصح قوله : ( بل سولت لكم أنفسكم أمرا فصبر جميل )\nثم ترجى من الله أن يرد عليه أولاده الثلاثة : يوسف وأخاه بنيامين ، وروبيل الذي أقام بديار مصر ينتظر أمر الله فيه ، إما أن يرضى عنه أبوه فيأمره بالرجوع إليه ، وإما أن يأخذ أخاه خفية; ولهذا قال : ( عسى الله أن يأتيني بهم جميعا إنه هو العليم ) أي : العليم بحالي ، ( الحكيم ) في أفعاله وقضائه وقدره ."
