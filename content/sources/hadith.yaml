- id: hadith.bukhari.6339
  type: hadith
  ref: {collection: bukhari, number: 6339}
  grade: sahih
  graded_by: Sahih al-Bukhari
  text_ar: حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ "‏ لاَ يَقُولَنَّ أَحَدُكُمُ اللَّهُمَّ اغْفِرْ لِي، اللَّهُمَّ ارْحَمْنِي، إِنْ شِئْتَ‏.‏ لِيَعْزِمِ الْمَسْأَلَةَ، فَإِنَّهُ لاَ مُكْرِهَ لَهُ ‏"‏‏.‏
  text_en: "Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"None of you should say: 'O Allah, forgive me if You wish; O Allah, be merciful to me if You wish,' but he should always appeal to Allah with determination, for nobody can force Allah to do something against His Will"
  url: https://sunnah.com/bukhari:6339
  origin:
    api: hadith-api (fawazahmed0)
    text_ar: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-bukhari/6339.json
    text_en: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/eng-bukhari/6339.json
    translator: Muhsin Khan
    book: 80
    hadith_in_book: 36
    retrieved: '2026-11-06'
  status: proposed
  notes: Demander avec résolution, sans « si Tu veux » (reel dua-02)
- id: hadith.muslim.2679a
  type: hadith
  ref: {collection: muslim, number: 2679, narration: 1}
  grade: sahih
  graded_by: Sahih Muslim
  text_ar: حَدَّثَنَا يَحْيَى بْنُ أَيُّوبَ، وَقُتَيْبَةُ، وَابْنُ، حُجْرٍ قَالُوا حَدَّثَنَا إِسْمَاعِيلُ، - يَعْنُونَ ابْنَ جَعْفَرٍ - عَنِ الْعَلاَءِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ "‏ إِذَا دَعَا أَحَدُكُمْ فَلاَ يَقُلِ اللَّهُمَّ اغْفِرْ لِي إِنْ شِئْتَ وَلَكِنْ لِيَعْزِمِ الْمَسْأَلَةَ وَلْيُعَظِّمِ الرَّغْبَةَ فَإِنَّ اللَّهَ لاَ يَتَعَاظَمُهُ شَىْءٌ أَعْطَاهُ ‏"‏ ‏.‏
  text_en: "Abu Huraira reported Allah's Messenger (ﷺ) as saying:When one of you makes a supplication (to his Lord) one should not say: O Allah, grant me pardon, if Thou so likest, but one should beg one's (Lord) with a will and full devotion, for there is nothing so great in the eye of Allah which He cannot grant"
  url: https://sunnah.com/muslim:2679a
  origin:
    api: hadith-api (fawazahmed0)
    text_ar: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-muslim/6812.json
    text_en: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/eng-muslim/6812.json
    translator: Abdul Hamid Siddiqui
    book: 48
    hadith_in_book: 8
    retrieved: '2026-11-06'
  status: proposed
  notes: Même sens, avec « qu'il intensifie son désir » (reel dua-02). 2679 a 2 narrations (hadith-api 2679.01, .02), la 1re seule contient « وليعظم الرغبة »
- id: hadith.bukhari.6340
  type: hadith
  ref: {collection: bukhari, number: 6340}
  grade: sahih
  graded_by: Sahih al-Bukhari
  text_ar: حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنِ ابْنِ شِهَابٍ، عَنْ أَبِي عُبَيْدٍ، مَوْلَى ابْنِ أَزْهَرَ عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ "‏ يُسْتَجَابُ لأَحَدِكُمْ مَا لَمْ يَعْجَلْ يَقُولُ دَعَوْتُ فَلَمْ يُسْتَجَبْ لِي ‏"‏‏.‏
  text_en: Narrated Abu Huraira:Allah's Messenger (ﷺ) said, "The invocation of anyone of you is granted (by Allah) if he does not show impatience (by saying, "I invoked Allah but my request has not been granted)
  url: https://sunnah.com/bukhari:6340
  origin:
    api: hadith-api (fawazahmed0)
    text_ar: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-bukhari/6340.json
    text_en: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/eng-bukhari/6340.json
    translator: Muhsin Khan
    book: 80
    hadith_in_book: 37
    retrieved: '2026-11-06'
  status: proposed
  notes: « Il est répondu à chacun tant qu'il ne s'impatiente pas » (reel dua-04)
- id: hadith.muslim.2735a
  type: hadith
  ref: {collection: muslim, number: 2735, narration: 1}
  grade: sahih
  graded_by: Sahih Muslim
  text_ar: حَدَّثَنَا يَحْيَى بْنُ يَحْيَى، قَالَ قَرَأْتُ عَلَى مَالِكٍ عَنِ ابْنِ شِهَابٍ، عَنْ أَبِي عُبَيْدٍ، مَوْلَى ابْنِ أَزْهَرَ عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ "‏ يُسْتَجَابُ لأَحَدِكُمْ مَا لَمْ يَعْجَلْ فَيَقُولُ قَدْ دَعَوْتُ فَلاَ أَوْ فَلَمْ يُسْتَجَبْ لِي ‏"‏ ‏.‏
  text_en: "Abu Huraira reported that Allah's Messenger (ﷺ) said:The supplication of every one of you is granted if he does not grow impatient and says: I supplicated but it was not granted"
  url: https://sunnah.com/muslim:2735a
  origin:
