- id: hadith.bukhari.608
  type: hadith
  ref: {collection: bukhari, number: 608}
  grade: sahih
  graded_by: Sahih al-Bukhari
  url: https://sunnah.com/bukhari:608
  origin:
    api: hadith-api (fawazahmed0)
    text_ar: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-bukhari/608.json
    text_en: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/eng-bukhari/608.json
    translator: Muhsin Khan
    book: 10
    hadith_in_book: 6
    retrieved: '2026-11-09'
  status: validated
  validated_by: mssnoussi92
  notes: "« حتى يخطر بين المرء ونفسه، يقول اذكر كذا، اذكر كذا، لما لم يكن يذكر… » : le Prophète ﷺ décrit l'esprit qui s'égare dans la prière (khushu, ancre de l'accroche, reel khushu-01 : on se souvient en priant de ce qu'on avait oublié) ; extrait sans le début (l'appel à la prière, « وله ضراط »)"
  text_ar: حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ "‏ إِذَا نُودِيَ لِلصَّلاَةِ أَدْبَرَ الشَّيْطَانُ وَلَهُ ضُرَاطٌ حَتَّى لاَ يَسْمَعَ التَّأْذِينَ، فَإِذَا قَضَى النِّدَاءَ أَقْبَلَ، حَتَّى إِذَا ثُوِّبَ بِالصَّلاَةِ أَدْبَرَ، حَتَّى إِذَا قَضَى التَّثْوِيبَ أَقْبَلَ حَتَّى يَخْطُرَ بَيْنَ الْمَرْءِ وَنَفْسِهِ، يَقُولُ اذْكُرْ كَذَا، اذْكُرْ كَذَا‏.‏ لِمَا لَمْ يَكُنْ يَذْكُرُ، حَتَّى يَظَلَّ الرَّجُلُ لاَ يَدْرِي كَمْ صَلَّى ‏"‏‏.‏
  text_en: Narrated Abu Huraira:Allah's Messenger (ﷺ) said, "When the Adhan is pronounced Satan takes to his heels and passes wind with noise during his flight in order not to hear the Adhan. When the Adhan is completed he comes back and again takes to his heels when the Iqama is pronounced and after its completion he returns again till he whispers into the heart of the person (to divert his attention from his prayer) and makes him remember things which he does not recall to his mind before the prayer and that causes him to forget how much he has prayed
  excerpt_ar: حَتَّى يَخْطُرَ بَيْنَ الْمَرْءِ وَنَفْسِهِ، يَقُولُ اذْكُرْ كَذَا، اذْكُرْ كَذَا‏.‏ لِمَا لَمْ يَكُنْ يَذْكُرُ، حَتَّى يَظَلَّ الرَّجُلُ لاَ يَدْرِي كَمْ صَلَّى
  excerpt_en: till he whispers into the heart of the person (to divert his attention from his prayer) and makes him remember things which he does not recall to his mind before the prayer and that causes him to forget how much he has prayed
  recording:
    reader: Abu Malik Ibn Abd'Azeez as-Salafi al-Asqalane
