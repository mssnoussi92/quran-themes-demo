  notes: "« هو اختلاس يختلسه الشيطان من صلاة العبد » : se retourner dans la prière, un vol de Satan (khushu, l'idée reçue « le khushu', c'est pour les pieux » : il se travaille, geste par geste)"
  text_ar: حَدَّثَنَا مُسَدَّدٌ، قَالَ حَدَّثَنَا أَبُو الأَحْوَصِ، قَالَ حَدَّثَنَا أَشْعَثُ بْنُ سُلَيْمٍ، عَنْ أَبِيهِ، عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ، قَالَتْ سَأَلْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم عَنْ الاِلْتِفَاتِ فِي الصَّلاَةِ فَقَالَ ‏ "‏ هُوَ اخْتِلاَسٌ يَخْتَلِسُهُ الشَّيْطَانُ مِنْ صَلاَةِ الْعَبْدِ ‏"‏‏.‏
  text_en: Narrated `Aisha:I asked Allah's Messenger (ﷺ) about looking hither and thither in prayer. He replied, "It is a way of stealing by which Satan takes away (a portion) from the prayer of a person
  excerpt_en: It is a way of stealing by which Satan takes away (a portion) from the prayer of a person
