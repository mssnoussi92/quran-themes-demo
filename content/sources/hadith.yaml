- id: hadith.bukhari.6324
  type: hadith
  ref: {collection: bukhari, number: 6324}
  grade: sahih
  graded_by: Sahih al-Bukhari
  url: https://sunnah.com/bukhari:6324
  origin:
    api: hadith-api (fawazahmed0)
    text_ar: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-bukhari/6324.json
