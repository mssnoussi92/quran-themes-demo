- id: hadith.tirmidhi.2517
  type: hadith
  ref: {collection: tirmidhi, number: 2517}
  grade: hasan
  graded_by: al-Albani
  url: https://sunnah.com/tirmidhi:2517
  origin:
    api: hadith-api (fawazahmed0)
    text_ar: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-tirmidhi/2517.json
    text_en: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/eng-tirmidhi/2517.json
    translator: Unknown
    book: 37
    hadith_in_book: 103
    grades:
    - {name: Ahmad Muhammad Shakir, grade: Hasan}
    - {name: Al-Albani, grade: Hasan}
    - {name: Zubair Ali Zai, grade: Hasan}
    retrieved: '2026-11-07'
  status: validated
  validated_by: mssnoussi92
  notes: "« اعقلها وتوكل » (reel tawakkul-02) ; la question de l'homme (« أعقلها وأتوكل أو أطلقها وأتوكل ») est hors des guillemets, donc dite par la narration ; al-Albani Hasan (Tirmidhi rapporte que Yahya al-Qattan le jugeait « منكر ») ; lecture : commence par « قال » (« قال اعقلها », sans pause : le alif de « اعقلها » ne se prononce pas après « قال »), la narration s'arrête donc à la question"
  text_ar: حَدَّثَنَا أَبُو حَفْصٍ، عَمْرُو بْنُ عَلِيٍّ حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ الْقَطَّانُ، حَدَّثَنَا الْمُغِيرَةُ بْنُ أَبِي قُرَّةَ السَّدُوسِيُّ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ، يَقُولُ قَالَ رَجُلٌ يَا رَسُولَ اللَّهِ أَعْقِلُهَا وَأَتَوَكَّلُ أَوْ أُطْلِقُهَا وَأَتَوَكَّلُ قَالَ ‏ "‏ اعْقِلْهَا وَتَوَكَّلْ ‏"‏ ‏.‏ قَالَ عَمْرُو بْنُ عَلِيٍّ قَالَ يَحْيَى وَهَذَا عِنْدِي حَدِيثٌ مُنْكَرٌ ‏.‏ قَالَ أَبُو عِيسَى وَهَذَا حَدِيثٌ غَرِيبٌ مِنْ حَدِيثِ أَنَسٍ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ وَقَدْ رُوِيَ عَنْ عَمْرِو بْنِ أُمَيَّةَ الضَّمْرِيِّ عَنِ النَّبِيِّ صلى الله عليه وسلم نَحْوُ هَذَا ‏.‏
  text_en: 'Anas bin Malik narrated that a man said:"O Messenger of Allah! Shall I tie it and rely(upon Allah), or leave it loose and rely(upon Allah)?" He said: "Tie it and rely(upon Allah)." Other chains report similar narrations'
  excerpt_en: Tie it and rely(upon Allah).
  recording:
    reader: Yusuf ibn Nuh Ahmad
