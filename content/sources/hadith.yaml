  notes: "Adhkar à lire (sans voix, à enregistrer), après le maghrib : dix tahlilas"
  text_ar: حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا اللَّيْثُ، عَنِ الْجُلاَحِ أَبِي كَثِيرٍ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ الْحُبُلِيِّ، عَنْ عُمَارَةَ بْنِ شَبِيبٍ السَّبَئِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ "‏ مَنْ قَالَ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ‏.‏ عَشْرَ مَرَّاتٍ عَلَى إِثْرِ الْمَغْرِبِ بَعَثَ اللَّهُ لَهُ مَسْلَحَةً يَحْفَظُونَهُ مِنَ الشَّيْطَانِ حَتَّى يُصْبِحَ وَكَتَبَ اللَّهُ لَهُ بِهَا عَشْرَ حَسَنَاتٍ مُوجِبَاتٍ وَمَحَا عَنْهُ عَشْرَ سَيِّئَاتٍ مُوبِقَاتٍ وَكَانَتْ لَهُ بِعَدْلِ عَشْرِ رِقَابٍ مُؤْمِنَاتٍ ‏"‏ ‏.‏ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ حَدِيثِ لَيْثِ بْنِ سَعْدٍ ‏.‏ وَلاَ نَعْرِفُ لِعُمَارَةَ بْنِ شَبِيبٍ سَمَاعًا عَنِ النَّبِيِّ صلى الله عليه وسلم ‏.‏
  text_en: 'Umarah bin Shabib As-Saba’i narrated that the Messenger of Allah (ﷺ) said:“Whoever says: none has the right to be worshipped but Allah, Alone, without partner, to Him belongs all that exists, and to Him belongs the praise, He gives life and causes death, and He is powerful over all things, (Lā ilāha illallāh, waḥdahu lā sharīka lahu, lahul-mulku wa lahul-ḥamdu, yuḥyī wa yumītu, wa huwa `alā kulli shai’in qadīr)’ ten times at the end of Al-Maghrib - Allah shall send for him protectors to guard him from Shaitan until he reaches morning, and Allah writes for him ten good deeds, Mujibat, and He wipes from him ten of the destructive evil deeds, and it shall be for him the equal of freeing ten believing slaves.”'
  parts:
    maghrib:
      excerpt_ar: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ
      excerpt_en: none has the right to be worshipped but Allah, Alone, without partner, to Him belongs all that exists, and to Him belongs the praise, He gives life and causes death, and He is powerful over all things
