  type: hadith
  ref: {collection: bukhari, number: 73}
  grade: sahih
  graded_by: Sahih al-Bukhari
  url: https://sunnah.com/bukhari:73
  origin:
    api: hadith-api (fawazahmed0)
    text_ar: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-bukhari/73.json
