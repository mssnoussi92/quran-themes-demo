  notes: "« من حفظ عشر آيات من أول سورة الكهف عصم من الدجال » (kahf-01, ancre de l'accroche : les dix premiers versets d'Al-Kahf, où l'histoire commence) ; 809b (hadith-api 809.02) dit que Shu'ba rapportait « من آخر الكهف » et Hammam « من أول الكهف » : la carte montre 809a"
  text_ar: وَحَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا مُعَاذُ بْنُ هِشَامٍ، حَدَّثَنِي أَبِي، عَنْ قَتَادَةَ، عَنْ سَالِمِ، بْنِ أَبِي الْجَعْدِ الْغَطَفَانِيِّ عَنْ مَعْدَانَ بْنِ أَبِي طَلْحَةَ الْيَعْمَرِيِّ، عَنْ أَبِي الدَّرْدَاءِ، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ ‏ "‏ مَنْ حَفِظَ عَشْرَ آيَاتٍ مِنْ أَوَّلِ سُورَةِ الْكَهْفِ عُصِمَ مِنَ الدَّجَّالِ ‏"‏
  text_en: Abu Darda' reported Allah's Apostle (ﷺ) as saying:If anyone learns by heart the first ten verses of the Surah al-Kahf, he will be protected from the Dajjal
  excerpt_en: If anyone learns by heart the first ten verses of the Surah al-Kahf, he will be protected from the Dajjal
