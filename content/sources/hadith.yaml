    translator: Muhsin Khan
    book: 80
    hadith_in_book: 21
    retrieved: '2026-11-09'
  status: validated
  validated_by: mssnoussi92
  notes: "« الحمد لله الذي أحيانا بعد ما أماتنا، وإليه النشور » : ce que le Prophète ﷺ disait au réveil (kahf-04, l'exemple de vie après la leçon de 18:21 : chaque réveil rappelle la résurrection) ; extrait : la du'a du réveil seulement"
  text_ar: حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا سُفْيَانُ، عَنْ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ، عَنْ رِبْعِيِّ بْنِ حِرَاشٍ، عَنْ حُذَيْفَةَ، قَالَ كَانَ النَّبِيُّ صلى الله عليه وسلم إِذَا أَرَادَ أَنْ يَنَامَ قَالَ ‏"‏ بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا ‏"‏‏.‏ وَإِذَا اسْتَيْقَظَ مِنْ مَنَامِهِ قَالَ ‏"‏ الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا، وَإِلَيْهِ النُّشُورُ ‏"‏‏.‏
  text_en: "Narrated Hudhaifa:Whenever the Prophet (ﷺ) intended to go to bed, he would recite: \"Bismika Allahumma amutu wa ahya (With Your name, O Allah, I die and I live).\" And when he woke up from his sleep, he would say: \"Al-hamdu lil-lahil-ladhi ahyana ba'da ma amatana; wa ilaihi an-nushur (All the Praises are for Allah Who has made us alive after He made us die (sleep) and unto Him is the Resurrection"
  excerpt_ar: الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا، وَإِلَيْهِ النُّشُورُ
  excerpt_en: All the Praises are for Allah Who has made us alive after He made us die (sleep) and unto Him is the Resurrection
