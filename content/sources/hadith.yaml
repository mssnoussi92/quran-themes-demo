- id: hadith.tirmidhi.3426
  type: hadith
  ref: {collection: tirmidhi, number: 3426}
  grade: sahih
  graded_by: al-Albani
  url: https://sunnah.com/tirmidhi:3426
  origin:
    api: hadith-api (fawazahmed0)
    text_ar: https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-tirmidhi/3426.json
