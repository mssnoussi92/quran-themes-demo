  notes: « بسم الله توكلت على الله… يقال له كفيت ووقيت » (reel tawakkul-04) ; la carte montre aussi la précision du rapporteur « يعني إذا خرج من بيته », entre les guillemets ; al-Albani Sahih
  text_ar: حَدَّثَنَا سَعِيدُ بْنُ يَحْيَى بْنِ سَعِيدٍ الأُمَوِيُّ، حَدَّثَنَا أَبِي، حَدَّثَنَا ابْنُ جُرَيْجٍ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ "‏ مَنْ قَالَ - يَعْنِي إِذَا خَرَجَ مِنْ بَيْتِهِ - بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ ‏.‏ يُقَالُ لَهُ كُفِيتَ وَوُقِيتَ ‏.‏ وَتَنَحَّى عَنْهُ الشَّيْطَانُ ‏"‏ ‏.‏ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ ‏.‏
  text_en: 'Anas bin Malik narrated that the Messenger of Allah (ﷺ) said:“Whoever says – that is: when he leaves his house – ‘In the Name of Allah, I place my trust in Allah, there is no might or power except by Allah (Bismillāh, tawakkaltu `alallāh, lā ḥawla wa lā quwwata illā billāh)’ it will be said to him: ‘You have been sufficed and protected,’ and Shaitan will become distant from him.”'
  excerpt_en: 'Whoever says – that is: when he leaves his house – ‘In the Name of Allah, I place my trust in Allah, there is no might or power except by Allah (Bismillāh, tawakkaltu `alallāh, lā ḥawla wa lā quwwata illā billāh)’ it will be said to him: ‘You have been sufficed and protected,’ and Shaitan will become distant from him.'
