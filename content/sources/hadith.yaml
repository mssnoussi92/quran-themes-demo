- id: hadith.tirmidhi.3247
  type: hadith
  ref: {collection: tirmidhi, number: 3247}
  grade: sahih
  graded_by: Al-Albani
  text_ar: حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، حَدَّثَنَا سُفْيَانُ، عَنْ مَنْصُورٍ، وَالأَعْمَشِ، عَنْ ذَرٍّ، عَنْ يُسَيْعٍ الْحَضْرَمِيِّ، عَنِ النُّعْمَانِ بْنِ بَشِيرٍ، قَالَ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ‏"‏ الدُّعَاءُ هُوَ الْعِبَادَةُ ‏"‏ ‏.‏ ثُمَّ قَرَأَ ‏:‏ ‏(‏ وقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ إِنَّ الَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِي سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ ‏)‏ قَالَ أَبُو عِيسَى ‏.‏ هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ ‏.‏
  text_en: "Narrated An-Nu'man bin Bashir:that the Prophet (ﷺ) said: \"Supplication is the worship.\" Then he recited: 'And your Lord said: 'Call upon Me, I will answer you. Verily, those who scorn my My worship, they will surely enter Hell in humiliation (40:)"
  excerpt_en: Supplication is the worship.
  url: https://sunnah.com/tirmidhi:3247
