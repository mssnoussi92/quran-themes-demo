  text_ar: حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا أَبُو عَبْدِ الرَّحْمَنِ الْمُقْرِئُ، عَنْ سَعِيدِ بْنِ أَبِي، أَيُّوبَ حَدَّثَنِي شُرَحْبِيلُ، - وَهُوَ ابْنُ شَرِيكٍ - عَنْ أَبِي عَبْدِ الرَّحْمَنِ الْحُبُلِيِّ، عَنْ عَبْدِ اللَّهِ، بْنِ عَمْرِو بْنِ الْعَاصِ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ "‏ قَدْ أَفْلَحَ مَنْ أَسْلَمَ وَرُزِقَ كَفَافًا وَقَنَّعَهُ اللَّهُ بِمَا آتَاهُ ‏"‏ ‏.‏
  text_en: Amr b. al-'As reported Allah's Messenger (ﷺ) as saying:He Is successful who has accepted Islam, who has been provided with sufficient for his want and been made contented by Allah with what He has given him

