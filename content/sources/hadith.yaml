  status: proposed
  notes: « ليس الغنى عن كثرة العرض… » la vraie richesse est celle de l'âme (reel muqarana-01, l'ancre)
  text_ar: حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا أَبُو بَكْرٍ، حَدَّثَنَا أَبُو حَصِينٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ "‏ لَيْسَ الْغِنَى عَنْ كَثْرَةِ الْعَرَضِ، وَلَكِنَّ الْغِنَى غِنَى النَّفْسِ ‏"‏‏.‏
  text_en: Narrated Abu Huraira:The Prophet (ﷺ) said, "Wealth is not in having many possessions, but rather (true) wealth is feeling sufficiency in the soul
  excerpt_en: Wealth is not in having many possessions, but rather (true) wealth is feeling sufficiency in the soul
