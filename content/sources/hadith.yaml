  text_ar: حَدَّثَنَا يُوسُفُ بْنُ مُوسَى، حَدَّثَنَا أَبُو أُسَامَةَ، حَدَّثَنَا الأَعْمَشُ، حَدَّثَنَا عَمْرُو بْنُ مُرَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ قَالَ لَمَّا نَزَلَتْ ‏{‏وَأَنْذِرْ عَشِيرَتَكَ الأَقْرَبِينَ‏}‏ وَرَهْطَكَ مِنْهُمُ الْمُخْلَصِينَ، خَرَجَ رَسُولُ اللَّهِ صلى الله عليه وسلم حَتَّى صَعِدَ الصَّفَا فَهَتَفَ ‏"‏ يَا صَبَاحَاهْ ‏"‏‏.‏ فَقَالُوا مَنْ هَذَا، فَاجْتَمَعُوا إِلَيْهِ‏.‏ فَقَالَ ‏"‏ أَرَأَيْتُمْ إِنْ أَخْبَرْتُكُمْ أَنَّ خَيْلاً تَخْرُجُ مِنْ سَفْحِ هَذَا الْجَبَلِ أَكُنْتُمْ مُصَدِّقِيَّ ‏"‏‏.‏ قَالُوا مَا جَرَّبْنَا عَلَيْكَ كَذِبًا‏.‏ قَالَ ‏"‏ فَإِنِّي نَذِيرٌ لَكُمْ بَيْنَ يَدَىْ عَذَابٍ شَدِيدٍ ‏"‏‏.‏ قَالَ أَبُو لَهَبٍ تَبًّا لَكَ مَا جَمَعْتَنَا إِلاَّ لِهَذَا ثُمَّ قَامَ فَنَزَلَتْ ‏{‏تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ‏}‏ وَقَدْ تَبَّ هَكَذَا قَرَأَهَا الأَعْمَشُ يَوْمَئِذٍ‏.‏
  text_en: Narrated Ibn `Abbas:When the Verse:-- 'And warn your tribe of near kindred.' (26.214) was revealed. Allah's Messenger (ﷺ) went out, and when he had ascended As-Safa mountain, he shouted, "O Sabahah!" The people said, "Who is that?" "Then they gathered around him, whereupon he said, "Do you see? If I inform you that cavalrymen are proceeding up the side of this mountain, will you believe me?" They said, "We have never heard you telling a lie." Then he said, "I am a plain warner to you of a coming severe punishment." Abu Lahab said, "May you perish! You gathered us only for this reason? " Then Abu Lahab went away. So the "Surat:--ul--LAHAB" 'Perish the hands of Abu Lahab!' (111.1) was revealed
