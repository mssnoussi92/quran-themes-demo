# Sources scientifiques et historiques de la série « سنريهم آياتنا » (docs/themes.md, docs/scripts/signs.md) : ce sur
# quoi repose une réplique qui donne une date ou un fait de science. Ce ne sont pas des textes cités : une étiquette
# (`label`) écrite à l'écran sous la réplique, la référence complète dans la description, et les pages sur lesquelles la
# session a vérifié le fait (`checked`), le 2026-11-12. Proposées : le propriétaire les valide avec les vidéos.

- id: science.zenith-1875
