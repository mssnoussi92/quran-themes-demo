  text_ar: "فَتَبْطُل بِسُجُودِهِ وَلَوْ لَحِقَ رَكْعَةً. قَال الْخَرَشِيُّ مِنَ الْمَالِكِيَّةِ: وَهُوَ الصَّوَابُ. (١)\nسَهْوُ الْمَأْمُومِ خَلْفَ الإِْمَامِ:\n١٤ - قَال ابْنُ الْمُنْذِرِ: أَجْمَعُوا عَلَى أَنْ لَيْسَ عَلَى مَنْ سَهَا خَلَفَ الإِْمَامِ سُجُودٌ. (٢)\nوَقَدْ رُوِيَ عَنِ النَّبِيِّ ﷺ قَال: لَيْسَ عَلَى مَنْ خَلْفَ الإِْمَامِ سَهْوٌ، فَإِنْ سَهَا الإِْمَامُ فَعَلَيْهِ وَعَلَى مَنْ خَلْفَهُ السَّهْوُ (٣) وَلأَِنَّ الْمَأْمُومَ تَابِعٌ لإِمَامِهِ، فَلَزِمَهُ مُتَابَعَتُهُ فِي السُّجُودِ وَتَرْكُهُ. (٤)\nسَهْوُ الإِْمَامِ أَوِ الْمُنْفَرِدِ عَنِ التَّشَهُّدِ الأَْوَّل:\n١٥ - مَنْ سَهَا عَنِ التَّشَهُّدِ الأَْوَّل، فَسَبَّحَ لَهُ الْمَأْمُومُونَ أَوْ تَذَكَّرَ قَبْل انْتِصَابِهِ قَائِمًا لَزِمَهُ الرُّجُوعُ، وَإِنِ اسْتَتَمَّ قَائِمًا لاَ يَعُودُ لِلتَّشَهُّدِ لأَِنَّهُ تَلَبَّسَ بِرُكْنٍ وَيَسْجُدُ لِلسَّهْوِ. لِحَدِيثِ الْمُغِيرَةِ بْنِ شُعْبَةَ - ﵁ - قَال: قَال رَسُول اللَّهِ ﷺ: إِذَا قَامَ الإِْمَامُ فِي الرَّكْعَتَيْنِ، فَإِنْ ذَكَرَ قَبْل أَنْ يَسْتَوِيَ قَائِمًا فَلْيَجْلِسْ، فَإِنِ\n_________\n(١) الخرشي على مختصر خليل (١ / ٣٣١ - ٣٣٢) .\n(٢) الإجماع لابن المنذر (ص ٤٠) .\n(٣) حديث: \" ليس على من خلف الإمام سهو. . . \" تقدم تخريجه ف / ١٢.\n(٤) رد المحتار على الدر المختار (١ / ٥٠٠)، البناية (٢ / ٦٦٤)، الخرشي على مختصر خليل ١ / ٣٣٢، روضة الطالبين ١ / ٣١١، المغني لابن قدامة ٢ / ٤٠ - ٤١.\nاسْتَوَى قَائِمًا فَلاَ يَجْلِسْ، وَيَسْجُدُ سَجْدَتَيِ السَّهْوِ. (١) وَعَنْ عَبْدِ اللَّهِ بْنِ بُحَيْنَةَ: أَنَّ النَّبِيَّ ﷺ صَلَّى فَقَامَ فِي الرَّكْعَتَيْنِ فَسَبَّحُوا، فَمَضَى، فَلَمَّا فَرَغَ مِنْ صَلاَتِهِ سَجَدَ سَجْدَتَيْنِ، ثُمَّ سَلَّمَ (٢)\nوَهَذَا قَوْل جُمْهُورِ الْفُقَهَاءِ مِنَ الْحَنَفِيَّةِ وَالْمَالِكِيَّةِ وَالشَّافِعِيَّةِ وَالْحَنَابِلَةِ (٣) .\nوَلَكِنَّ الْخِلاَفَ وَقَعَ فِيمَا لَوْ عَادَ بَعْدَ أَنِ اسْتَتَمَّ قَائِمًا، هَل تَبْطُل صَلاَتُهُ أَمْ لاَ؟\nذَهَبَ الْحَنَفِيَّةُ وَالشَّافِعِيَّةُ عَلَى الصَّحِيحِ عِنْدَهُمْ وَسَحْنُونٌ مِنَ الْمَالِكِيَّةِ إِلَى أَنَّ الْمُصَلِّيَ لَوْ عَادَ إِلَى التَّشَهُّدِ الأَْوَّل بَطَلَتْ صَلاَتُهُ. لِحَدِيثِ الْمُغِيرَةِ الَّذِي فِيهِ النَّهْيُ عَنْ أَنْ يَعُودَ وَهُوَ قَوْلُهُ: وَإِذَا اسْتَوَى قَائِمًا فَلاَ يَجْلِسْ. وَلأَِنَّهُ تَلَبَّسَ بِفَرْضٍ فَلاَ يَجُوزُ تَرْكُهُ لِوَاجِبٍ أَوْ مَسْنُونٍ. وَذَهَبَ الْمَالِكِيَّةُ عَلَى الْمَشْهُورِ فِي الْمَذْهَبِ،\n_________\n(١) حديث: \" إذا قام الإمام في الركعتين \". أخرجه أبو داود (١ / ٦٢٩ - تحقيق عزت عبيد دعاس) وقال: \" ليس في كتابي عن جابر الجعفي إلا هذا الحديث \". وقال ابن حجر في التلخيص (٢ / ٤ - ط شركة الطباعة الفنية): وهو ضعيف جدًا. ولكن له متابعان يتقوى بهما، أخرجهما الطحاوي في شرح معاني الآثار (١ / ٤٤٠ - ط مطبعة الأنوار المحمدية) .\n(٢) حديث عبد الله بن بحينة تقدم تخريجه ف / ٧.\n(٣) فتح القدير ١ / ٤٤٣ - ٤٤٤، مواهب الجليل ٢ / ٤٦ - ٦٧، روضة الطالبين ١ / ٣٠٣ - ٣٠٤، كشاف القناع ١ / ٤٠٤ - ٤٠٥."
