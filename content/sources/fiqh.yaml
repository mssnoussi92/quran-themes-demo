  text_ar: "وَيُرْوَى نَحْوُ ذَلِكَ عَنْ عَلِيٍّ وَسَعْدِ بْنِ أَبِي وَقَّاصٍ وَابْنِ مَسْعُودٍ وَعَمَّارٍ وَابْنِ عَبَّاسٍ وَابْنِ الزُّبَيْرِ وَأَنَسٍ.\nوَذَهَبَ الْمَالِكِيَّةُ وَهُوَ مُقَابِل الأَْظْهَرِ عِنْدَ الشَّافِعِيَّةِ وَرِوَايَةٌ عَنْ أَحْمَدَ: إِلَى التَّفْرِيقِ بَيْنَ الزِّيَادَةِ وَالنُّقْصَانِ فَإِنْ وَقَعَ السَّهْوُ بِالنَّقْصِ فِي الصَّلاَةِ فَالسُّجُودُ يَكُونُ قَبْل السَّلاَمِ. وَدَلِيلُهُمْ حَدِيثُ عَبْدِ اللَّهِ بْنِ مَالِكِ بْنِ بُحَيْنَةَ أَنَّ رَسُول اللَّهِ ﷺ قَامَ مِنَ اثْنَتَيْنِ مِنَ الظُّهْرِ، وَلَمْ يَجْلِسْ بَيْنَهُمَا، فَلَمَّا قَضَى صَلاَتَهُ سَجَدَ سَجْدَتَيْنِ. (١) وَأَمَّا الزِّيَادَةُ فَيَسْجُدُ بَعْدَ السَّلاَمِ لِحَدِيثِ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ ﵁ قَال: صَلَّى بِنَا رَسُول اللَّهِ ﷺ خَمْسًا فَقُلْنَا: يَا رَسُول اللَّهِ، أَزِيدَ فِي الصَّلاَةِ؟ قَال: وَمَا ذَاكَ؟ قَالُوا: صَلَّيْتَ خَمْسًا! \" إِنَّمَا أَنَا بَشَرٌ مِثْلُكُمْ، أَذْكُرُ كَمَا تَذْكُرُونَ، وَأَنْسَى كَمَا تَنْسَوْنَ \"، ثُمَّ سَجَدَ سَجْدَتَيِ السَّهْوِ (٢) وَرُوِيَ عَنِ ابْنِ مَسْعُودٍ أَنَّهُ قَال: كُل شَيْءٍ شَكَكْتَ فِيهِ مِنْ صَلاَتِكَ مِنْ نُقْصَانٍ مِنْ رُكُوعٍ أَوْ سُجُودٍ أَوْ غَيْرِ ذَلِكَ، فَاسْتَقْبِل أَكْثَرَ ظَنِّكَ، وَاجْعَل سَجْدَتَيِ السَّهْوِ مِنْ\n_________\n(١) حديث عبد الله بن مالك بن بحينة: \" أن رسول الله ﷺ قام من اثنتين من الظهر \". أخرجه البخاري (الفتح ٣ / ٩٢ - ط السلفية)، ومسلم (١ / ٣٩٩ - ط الحلبي) والسياق للبخاري.\n(٢) حديث عبد الله بن مسعود: \" صلى بنا رسول الله ﷺ خمسًا \". أخرجه مسلم (١ / ٤٠٢ - ط الحلبي) .\nهَذَا النَّحْوِ قَبْل التَّسْلِيمِ، فَأَمَّا غَيْرُ ذَلِكَ مِنَ السَّهْوِ فَاجْعَلْهُ بَعْدَ التَّسْلِيمِ. وَإِنْ جَمَعَ بَيْنَ زِيَادَةٍ وَنَقْصٍ فَيَسْجُدُ قَبْل السَّلاَمِ تَرْجِيحًا لِجَانِبِ النَّقْصِ.\nوَالْجَدِيدُ وَهُوَ الأَْظْهَرُ عِنْدَ الشَّافِعِيَّةِ وَهُوَ رِوَايَةٌ عَنْ أَحْمَدَ أَنَّهُ قَبْل السَّلاَمِ، وَرُوِيَ ذَلِكَ عَنْ أَبِي هُرَيْرَةَ وَمَكْحُولٍ وَالزُّهْرِيِّ وَيَحْيَى الأَْنْصَارِيِّ. وَدَلِيلُهُمْ حَدِيثُ ابْنِ بُحَيْنَةَ وَأُبَيٍّ - ﵁ - أَنَّهُ ﵊ سَجَدَ قَبْل السَّلاَمِ. كَمَا سَبَقَ؛ وَلأَِنَّهُ يُفْعَل لإِصْلاَحِ الصَّلاَةِ، فَكَانَ قَبْل السَّلاَمِ كَمَا لَوْ نَسِيَ سَجْدَةً مِنَ الصَّلاَةِ.\nوَأَمَّا الْحَنَابِلَةُ فَذَهَبُوا فِي الْمُعْتَمَدِ إِلَى أَنَّ السُّجُودَ كُلَّهُ قَبْل السَّلاَمِ، إِلاَّ فِي الْمَوْضِعَيْنِ اللَّذَيْنِ وَرَدَ النَّصُّ بِسُجُودِهِمَا بَعْدَ السَّلاَمِ. وَهُمَا إِذَا سَلَّمَ مِنْ نَقْصِ رَكْعَةٍ فَأَكْثَرَ، كَمَا فِي حَدِيثِ ذِي الْيَدَيْنِ أَنَّهُ ﷺ سَلَّمَ مِنْ رَكْعَتَيْنِ فَسَجَدَ بَعْدَ السَّلاَمِ. (١) وَحَدِيثِ عِمْرَانَ بْنِ حُصَيْنٍ أَنَّهُ سَلَّمَ مِنْ ثَلاَثٍ فَسَجَدَ بَعْدَ السَّلاَمِ. (٢)\nوَالثَّانِي إِذَا تَحَرَّى الإِْمَامُ فَبَنَى عَلَى غَالِبِ ظَنِّهِ كَمَا فِي حَدِيثِ ابْنِ مَسْعُودٍ عِنْدَمَا تَحَرَّى فَسَجَدَ بَعْدَ السَّلاَمِ.\n_________\n(١) حديث ذي اليدين: \" أنه سلم من ركعتين فسجد بعد السلام \". أخرجه البخاري (الفتح ٣ / ٩٨ - ط السلفية) من حديث أبي هريرة.\n(٢) حديث عمران بن حصين: \" أنه سلم من ثلاث فسجد بعد السلام \". أخرجه مسلم (١ / ٤٠٥ - ط الحلبي) ."
