  text_ar: "الْوَاجِبَاتُ وَالسُّنَنُ الَّتِي يَجِبُ بِتَرْكِهَا سُجُودُ السَّهْوِ:\n٦ - اخْتَلَفَ الْفُقَهَاءُ فِي: فِيمَا يُطْلَبُ لَهُ سُجُودُ السَّهْوِ.\nفَذَهَبَ الْحَنَفِيَّةُ إِلَى وُجُوبِ سُجُودِ السَّهْوِ بِتَرْكِ وَاجِبٍ مِنْ وَاجِبَاتِ الصَّلاَةِ سَهْوًا، وَيَجِبُ عَلَيْهِ قَضَاؤُهُ إِذَا لَمْ يَسْجُدْ لِلسَّهْوِ. قَال ابْنُ عَابِدِينَ: لاَ تَفْسُدُ بِتَرْكِهَا وَتُعَادُ وُجُوبًا فِي الْعَمْدِ وَالسَّهْوِ إِنْ لَمْ يَسْجُدْ لَهُ، وَإِنْ لَمْ يُعِدْهَا يَكُونُ فَاسِقًا آثِمًا.\nوَمِنْ وَاجِبَاتِ الصَّلاَةِ عِنْدَهُمُ: الْقَعْدَةُ الأُْولَى مِنَ الصَّلاَةِ الرُّبَاعِيَّةِ، وَدُعَاءُ الْقُنُوتِ فِي الْوِتْرِ، وَتَكْبِيرَاتُ الْعِيدَيْنِ وَغَيْرِهَا. أَمَّا الْمَالِكِيَّةُ وَالشَّافِعِيَّةُ فَقَدْ قَسَّمُوا الصَّلاَةَ إِلَى فَرَائِضَ وَسُنَنٍ. فَالْمَالِكِيَّةُ يُسْجَدُ عِنْدَهُمْ لِسُجُودِ السَّهْوِ لِثَمَانِيَةٍ مِنَ السُّنَنِ وَهِيَ: السُّورَةُ، وَالْجَهْرُ، وَالإِْسْرَارُ، وَالتَّكْبِيرُ، وَالتَّحْمِيدُ، وَالتَّشَهُّدَانِ، وَالْجُلُوسُ لَهُمَا.\nأَمَّا الشَّافِعِيَّةُ فَالسُّنَّةُ عِنْدَهُمْ نَوْعَانِ: أَبْعَاضٌ وَهَيْئَاتٌ، وَالأَْبْعَاضُ هِيَ الَّتِي يُجْبَرُ تَرْكُهَا بِسُجُودِ السَّهْوِ، فَمِنْهَا التَّشَهُّدُ الأَْوَّل وَالْقُعُودُ لَهُ، وَالصَّلاَةُ عَلَى النَّبِيِّ ﷺ فِي التَّشَهُّدِ الأَْوَّل، وَالصَّلاَةُ عَلَى الآْل فِي التَّشَهُّدِ الأَْخِيرِ، وَالْقُنُوتُ الرَّاتِبُ فِي الصُّبْحِ، وَوِتْرُ النِّصْفِ الأَْخِيرِ مِنْ رَمَضَانَ، وَقِيَامُهُ، وَالصَّلاَةُ عَلَى النَّبِيِّ ﷺ فِي الْقُنُوتِ.\nوَذَهَبَ الْحَنَابِلَةُ إِلَى أَنَّ مَا لَيْسَ بِرُكْنٍ نَوْعَانِ: وَاجِبَاتٌ وَسُنَنٌ، فَالْوَاجِبَاتُ تَبْطُل الصَّلاَةُ بِتَرْكِهَا عَمْدًا، وَتَسْقُطُ سَهْوًا أَوْ جَهْلًا، وَيُجْبَرُ تَرْكُهَا سَهْوًا بِسُجُودِ السَّهْوِ كَالتَّكْبِيرِ، لأَِنَّ النَّبِيَّ ﷺ كَانَ يُكَبِّرُ كَذَلِكَ، وَقَال ﷺ: صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي. (١) وَالتَّسْمِيعُ لِلإِْمَامِ وَالْمُنْفَرِدِ دُونَ الْمَأْمُومِ، وَالتَّحْمِيدُ وَغَيْرُهَا. (٢)\nمَوْضِعُ سُجُودِ السَّهْوِ:\n٧ - لَمْ يَتَّفِقِ الْفُقَهَاءُ عَلَى مَوْضِعِ سُجُودِ السَّهْوِ: فَقَدْ رَأَى الْحَنَفِيَّةُ أَنَّ مَوْضِعَ سُجُودِ السَّهْوِ بَعْدَ التَّسْلِيمِ مُطْلَقًا سَوَاءٌ فِي الزِّيَادَةِ أَوِ النُّقْصَانِ، أَيْ أَنَّهُ يَتَشَهَّدُ ثُمَّ يُسَلِّمُ تَسْلِيمَةً وَاحِدَةً عَلَى الأَْصَحِّ ثُمَّ يَسْجُدُ لِلسَّهْوِ ثُمَّ يَتَشَهَّدُ ثُمَّ يُسَلِّمُ كَذَلِكَ، فَإِنْ سَلَّمَ تَسْلِيمَتَيْنِ سَقَطَ السُّجُودُ لِحَدِيثِ ثَوْبَانَ ﵁ أَنَّ النَّبِيَّ ﷺ قَال: لِكُل سَهْوٍ سَجْدَتَانِ بَعْدَمَا يُسَلِّمُ. (٣)\n_________\n(١) حديث: \" صلوا كما رأيتموني أصلي \". أخرجه البخاري (الفتح ٢ / ١١١ - ط السلفية) من حديث مالك بن الحويرث.\n(٢) الفتاوى الهندية (١ / ٧١ - ٧٢) حاشية ابن عابدين ١ / ٣٠٦، الشرح الصغير (١ / ٣٠٣ - ٣٢٢ ط. دار المعارف)، القوانين الفقهية ص ٥٥ - ٥٨، كشاف القناع ١ / ٤٠٨ - ٤١٠، مغني المحتاج ١ / ١٤٨ وما بعدها.\n(٣) حديث: \" لكل سهو سجدتان بعدما يسلم \". أخرجه أبو داود (١ / ٦٣٠ - تحقيق عزت عبيد دعاس)، والبيهقي (٢ / ٣٣٧ - ط دائرة المعارف العثمانية) من حديث ثوبان، وأعله البيهقي."
