  text_ar: "وَالْحَنَابِلَةُ عَلَى أَنَّ الأَْوْلَى أَنْ لاَ يَعُودَ لِحَدِيثِ الْمُغِيرَةِ بْنِ شُعْبَةَ وَإِذَا اسْتَوَى فَلاَ يَجْلِسْ وَلاَ تَبْطُل صَلاَتُهُ إِنْ عَادَ وَلَكِنَّهُ أَسَاءَ، وَكُرِهَ خُرُوجًا مِنْ خِلاَفِ مَنْ أَوْجَبَ الْمُضِيَّ لِظَاهِرِ الْحَدِيثِ.\nوَاسْتَثْنَى الْحَنَابِلَةُ مَا لَوْ شَرَعَ الإِْمَامُ فِي الْقِرَاءَةِ فَإِنَّ صَلاَتَهُ تَبْطُل إِنْ عَادَ؛ لأَِنَّهُ شَرَعَ فِي رُكْنٍ مَقْصُودٍ، كَمَا لَوْ شَرَعَ فِي الرُّكُوعِ.\nوَذَهَبَ الْجُمْهُورُ إِلَى أَنَّ الْمُصَلِّيَ إِذَا عَادَ لِلتَّشَهُّدِ بَعْدَ أَنِ اسْتَتَمَّ قَائِمًا نَاسِيًا أَوْ جَاهِلًا مِنْ غَيْرِ عَمْدٍ فَإِنَّ صَلاَتَهُ لاَ تَبْطُل. (١) لِلْحَدِيثِ: إِنَّ اللَّهَ وَضَعَ عَنْ أُمَّتِي الْخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ. (٢)\n_________\n(١) رد المحتار ١ / ٤٩٩ - ٥٠١، مواهب الجليل ٢ / ٤٦ - ٤٧، روضة الطالبين ١ / ٣٠٣ - ٣٠٤، المغني لابن قدامة ٢ / ٢٤ - ٢٦، كشاف القناع ١ / ٤٠٤ - ٤٠٥.\n(٢) حديث: \" إن الله وضع عن أمتي الخطأ والنسيان \". أخرجه ابن ماجه (١ / ٦٥٩ - ط الحلبي) والحاكم (٢ / ١٩٨ - ط دائرة المعارف العثمانية) من حديث ابن عباس، واللفظ لابن ماجه، وصحح الحاكم إسناده ووافقه الذهبي.\nسُجُودُ الشُّكْرِ\n. التَّعْرِيفُ:\n١ - السُّجُودُ تَقَدَّمَ بَيَانُهُ، وَالشُّكْرُ لُغَةً: هُوَ الاِعْتِرَافُ بِالْمَعْرُوفِ الْمُسْدَى إِلَيْكَ، وَنَشْرُهُ، وَالثَّنَاءُ عَلَى فَاعِلِهِ، وَضِدُّهُ الْكُفْرَانُ، قَال تَعَالَى: ﴿وَمَنْ يَشْكُرْ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِ وَمَنْ كَفَرَ فَإِنَّ اللَّهَ غَنِيٌّ حَمِيدٌ﴾ (١) وَحَقِيقَةُ الشُّكْرِ: ظُهُورُ أَثَرِ النِّعْمَةِ عَلَى اللِّسَانِ وَالْقَلْبِ وَالْجَوَارِحِ، بِأَنْ يَكُونَ اللِّسَانُ مُقِرًّا بِالْمَعْرُوفِ مُثْنِيًا بِهِ، وَيَكُونُ الْقَلْبُ مُعْتَرِفًا بِالنِّعْمَةِ، وَتَكُونُ الْجَوَارِحُ مُسْتَعْمَلَةً فِيمَا يَرْضَاهُ الْمَشْكُورُ. (٢)\nوَالشُّكْرُ لِلَّهِ فِي الاِصْطِلاَحِ: صَرْفُ الْعَبْدِ النِّعَمَ الَّتِي أَنْعَمَ اللَّهُ بِهَا عَلَيْهِ فِي طَاعَتِهِ. (٣)\n_________\n(١) سورة لقمان / ١٢.\n(٢) لسان العرب، ومدارج السالكين ٢ / ٢٤٤، والمجموع للنووي ١ / ٧٤، ونهاية المحتاج ١ / ٢٢ ط. مصطفى الحلبي، وتفسير القرطبي ١ / ١٣٣ ط. دار الكتب المصرية.\n(٣) نهاية المحتاج وحاشية الشبراملسي ١ / ٢٢، وأسنى المطالب ١ / ٣، وشرح مسلم الثبوت ١ / ٤٧."
