  notes: "l'ajout et l'oubli dans la prière, début du doute"
  text_ar: "وَالسَّجْدَتَانِ (١) .\nأَسْبَابُ سُجُودِ السَّهْوِ:\nأ - الزِّيَادَةُ وَالنَّقْصُ:\n٣ - اتَّفَقَ الْفُقَهَاءُ مِنَ الْحَنَفِيَّةِ وَالْمَالِكِيَّةِ وَالشَّافِعِيَّةِ وَالْحَنَابِلَةِ عَلَى أَنَّهُ إِذَا تَعَمَّدَ الْمُصَلِّي أَنْ يَزِيدَ فِي صَلاَتِهِ قِيَامًا أَوْ قُعُودًا أَوْ رُكُوعًا أَوْ سُجُودًا، أَوْ يَنْقُصَ مِنْ أَرْكَانِهَا شَيْئًا، بَطَلَتْ صَلاَتُهُ. لأَِنَّ السُّجُودَ يُضَافُ إِلَى السَّهْوِ فَيَدُل عَلَى اخْتِصَاصِهِ بِهِ، وَالشَّرْعُ إِنَّمَا وَرَدَ بِهِ فِي السَّهْوِ قَال ﷺ: إِذَا نَسِيَ أَحَدُكُمْ فَلْيَسْجُدْ سَجْدَتَيْنِ. (٢)\nفَإِذَا زَادَ الْمُصَلِّي أَوْ نَقَصَ لِغَفْلَةٍ أَوْ نِسْيَانٍ فَقَدِ اخْتَلَفَ الْعُلَمَاءُ فِي كَيْفِيَّةِ قَضَائِهِ، وَتَفْصِيل ذَلِكَ يَأْتِي فِي ثَنَايَا الْبَحْثِ. (٣)\n_________\n(١) حديث: \" كانت الركعة نافلة والسجدتان \" جزء من حديث طويل أخرجه أبو داود (١ / ٦٢١ - ٦٢٢ - تحقيق عزت عبيد دعاس) بلفظ \" إذا شك أحدكم في صلاته فليلق الشك وليبن على اليقين، فإذا استيقن التمام سجد سجدتين، فإن كانت صلاته تامة كانت الركعة نافلة والسجدتان، وإن ك وأصله في مسلم كما تقدم.\n(٢) حديث: \" إذا نسي أحدكم فليسجد سجدتين \". أخرجه مسلم (١ / ٤٠٢ - ط الحلبي) من حديث ابن مسعود.\n(٣) الفتاوى الهندية ١ / ١٢٦، نهاية المحتاج ٢ / ٦٧، المغني لابن قدامة ٢ / ٣٤، حاشية الدسوقي ١ / ٢٨٨ - ٢٨٩.\nب - الشَّكُّ:\n٤ - إِذَا شَكَّ الْمُصَلِّي فِي صَلاَتِهِ فَلَمْ يَدْرِ كَمْ صَلَّى أَثَلاَثًا أَمْ أَرْبَعًا، أَوْ شَكَّ فِي سَجْدَةٍ فَلَمْ يَدْرِ أَسَجَدَهَا أَمْ لاَ، فَإِنَّ الْجُمْهُورَ (الْمَالِكِيَّةَ وَالشَّافِعِيَّةَ وَرِوَايَةً لِلْحَنَابِلَةِ) ذَهَبُوا إِلَى أَنَّهُ يَبْنِي عَلَى الْيَقِينِ وَهُوَ الأَْقَل، وَيَأْتِي بِمَا شَكَّ فِيهِ وَيَسْجُدُ لِلسَّهْوِ. وَدَلِيلُهُمْ حَدِيثُ أَبِي سَعِيدٍ الْخُدْرِيِّ - ﵁ - قَال: قَال رَسُول اللَّهِ ﷺ: إِذَا سَهَا أَحَدُكُمْ فِي صَلاَتِهِ فَلَمْ يَدْرِ وَاحِدَةً صَلَّى أَوْ ثِنْتَيْنِ فَلْيَبْنِ عَلَى وَاحِدَةٍ، فَإِنْ لَمْ يَدْرِ ثِنْتَيْنِ صَلَّى أَوْ ثَلاَثًا فَلْيَبْنِ عَلَى ثِنْتَيْنِ، فَإِنْ لَمْ يَدْرِ ثَلاَثًا صَلَّى أَوْ أَرْبَعًا فَلْيَبْنِ عَلَى ثَلاَثٍ، وَلْيَسْجُدْ سَجْدَتَيْنِ قَبْل أَنْ يُسَلِّمَ (١) وَلِحَدِيثِ إِذَا شَكَّ أَحَدُكُمْ فِي صَلاَتِهِ فَلْيُلْقِ الشَّكَّ، وَلْيَبْنِ عَلَى الْيَقِينِ، فَإِذَا اسْتَيْقَنَ التَّمَامَ سَجَدَ سَجْدَتَيْنِ، فَإِنْ كَانَتْ صَلاَتُهُ تَامَّةً كَانَتِ الرَّكْعَةُ نَافِلَةً وَالسَّجْدَتَانِ، وَإِنْ كَانَتْ نَاقِصَةً كَانَتِ الرَّكْعَةُ تَمَامًا لِصَلاَتِهِ، وَكَانَتِ السَّجْدَتَانِ مُرْغِمَتَيِ الشَّيْطَانِ.\n(٢) وَذَهَبَ الْحَنَفِيَّةُ إِلَى أَنَّ الْمُصَلِّيَ إِذَا شَكَّ فِي صَلاَتِهِ، فَلَمْ يَدْرِ أَثَلاَثًا صَلَّى أَمْ أَرْبَعًا وَذَلِكَ\n_________\n(١) حديث: \" إذا سها أحدكم في صلاته \". أخرجه الترمذي (٢ / ٢٤٥ - ط الحلبي) من حديث عبد الرحمن بن عوف، وقال: حديث حسن صحيح.\n(٢) حديث: \" إذا شك أحدكم في صلاته \". تقدم تخريجه ف / ٢."
  validated_by: mssnoussi92
