  text_ar: "وَفِي قَوْلٍ ثَالِثٍ عِنْدَ الشَّافِعِيَّةِ: يَتَخَيَّرُ إِنْ شَاءَ قَبْل السَّلاَمِ وَإِنْ شَاءَ بَعْدَهُ. (١)\nتَكْرَارُ السَّهْوِ فِي نَفْسِ الصَّلاَةِ:\n٨ - إِذَا تَكَرَّرَ السَّهْوُ لِلْمُصَلِّي فِي الصَّلاَةِ، لاَ يَلْزَمُهُ إِلاَّ سَجْدَتَانِ؛ لأَِنَّ تَكْرَارَهُ غَيْرُ مَشْرُوعٍ، وَلأَِنَّ النَّبِيَّ ﷺ قَامَ مِنَ اثْنَتَيْنِ، وَكَلَّمَ ذَا الْيَدَيْنِ. (٢)\nوَلأَِنَّهُ لَوْ لَمْ تَتَدَاخَل لَسَجَدَ عَقِبَ السَّهْوِ فَلَمَّا أَخَّرَ إِلَى آخِرِ صَلاَتِهِ دَل عَلَى أَنَّهُ إِنَّمَا أَخَّرَ لِيَجْمَعَ كُل سَهْوٍ فِي الصَّلاَةِ. وَهَذَا مَذْهَبُ جُمْهُورِ الْفُقَهَاءِ. (٣)\nنِسْيَانُ سُجُودِ السَّهْوِ:\n٩ - إِذَا سَهَا الْمُصَلِّي عَنْ سُجُودِ السَّهْوِ فَانْصَرَفَ مِنَ الصَّلاَةِ دُونَ سُجُودٍ فَإِنَّهُ يَعُودُ إِلَيْهِ وَيُؤَدِّيهِ عَلَى التَّفْصِيل التَّالِي:\n_________\n(١) رد المحتار على الدر المختار ١ / ٤٩٥ - ٤٩٦، البناية للعيني ٢ / ٦٤٥ - ٦٤٧، الشرح الصغير ١ / ٣٧٨ - ٣٧٩، الروضة للنووي ١ / ٣١٥ - ٣١٦، المغني لابن قدامة ٢ / ٢٢ - ٢٣، الكافي لابن قدامة ١ / ١٦٨ - ١٦٩، مغني المحتاج ١ / ٢٠٩.\n(٢) حديث: \" أن النبي ﷺ قام من اثنتين وكلم ذا اليدين \". أخرجه البخاري (الفتح ٣ / ٩٩ - ط السلفية) من حديث أبي هريرة.\n(٣) رد المحتار ١ / ٤٩٧، مواهب الجليل ٢ / ١٥، شرح المنهاج ١ / ٢٠٤، المغني لابن قدامة ٢ / ٣٩ - ٤٠.\nفَذَهَبَ الْحَنَفِيَّةُ إِلَى أَنَّهُ لاَ يَسْجُدُ إِنْ سَلَّمَ بِنِيَّةِ الْقَطْعِ مَعَ التَّحَوُّل عَنِ الْقِبْلَةِ أَوِ الْكَلاَمِ أَوِ الْخُرُوجِ مِنَ الْمَسْجِدِ، لَكِنْ إِنْ سَلَّمَ نَاسِيًا السَّهْوَ سَجَدَ مَا دَامَ فِي الْمَسْجِدِ؛ لأَِنَّ الْمَسْجِدَ فِي حُكْمِ مَكَانٍ وَاحِدٍ، وَلِذَا صَحَّ الاِقْتِدَاءُ فِيهِ وَإِنْ كَانَ بَيْنَهُمَا فُرْجَةٌ، وَأَمَّا إِذَا كَانَ فِي الصَّحْرَاءِ فَإِنْ تَذَكَّرَ قَبْل أَنْ يُجَاوِزَ الصُّفُوفَ مِنْ خَلْفِهِ أَوْ يَمِينِهِ أَوْ يَسَارِهِ أَوْ يَتَقَدَّمَ عَلَى مَوْضِعِ سُتْرَتِهِ أَوْ سُجُودِهِ سَجَدَ لِلسَّهْوِ. (١)\nوَأَمَّا الْمَالِكِيَّةُ: فَقَدْ فَرَّقُوا بَيْنَ السُّجُودِ الْقَبْلِيِّ وَالْبَعْدِيِّ، فَإِنْ تَرَكَ السُّجُودَ الْبَعْدِيَّ يَقْضِيهِ مَتَى ذَكَرَهُ، وَلَوْ بَعْدَ سِنِينَ، وَلاَ يَسْقُطُ بِطُول الزَّمَانِ سَوَاءٌ تَرَكَهُ عَمْدًا أَوْ نِسْيَانًا؛ لأَِنَّ الْمَقْصُودَ (تَرْغِيمُ الشَّيْطَانِ) كَمَا فِي الْحَدِيثِ. وَأَمَّا السُّجُودُ الْقَبْلِيُّ فَإِنَّهُمْ قَيَّدُوهُ بِعَدَمِ خُرُوجِهِ مِنَ الْمَسْجِدِ وَلَمْ يَطُل الزَّمَانُ، وَهُوَ فِي مَكَانِهِ أَوْ قُرْبِهِ. (٢)\nوَقَال الشَّافِعِيَّةُ: إِنْ سَلَّمَ سَهْوًا أَوْ طَال الْفَصْل بِحَسَبِ الْعُرْفِ فَإِنَّ سُجُودَ السَّهْوِ يَسْقُطُ عَلَى الْمَذْهَبِ الْجَدِيدِ لِفَوَاتِ الْمَحَل بِالسَّلاَمِ وَتَعَذُّرِ الْبِنَاءِ بِالطُّول. (٣)\nوَذَهَبَ الْحَنَابِلَةُ إِلَى أَنَّهُ إِنْ نَسِيَ سُجُودَ السَّهْوِ\n_________\n(١) رد المحتار على الدر المختار ١ / ٥٠٥.\n(٢) مواهب الجليل ٢ / ٢٠، الشرح الصغير ١ / ٣٨٧ - ٣٨٩، شرح المنهاج ١ / ٢٠٢، المجموع ٤ / ١٥٣.\n(٣) مغني المحتاج ١ / ٢١٣، القليوبي ١ / ٢٠٥، المجموع ٤ / ١٥٧."
