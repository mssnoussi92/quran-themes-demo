  text_ar: "اسْتِجَابَةُ الإِْمَامِ لِتَنْبِيهِ الْمَأْمُومِينَ وَمُتَابَعَتِهِمْ:\n١١ - يَرَى جُمْهُورُ الْفُقَهَاءِ مِنَ الْحَنَفِيَّةِ وَالشَّافِعِيَّةِ وَالْحَنَابِلَةِ أَنَّ الإِْمَامَ إِذَا زَادَ فِي صَلاَتِهِ وَكَانَ الإِْمَامُ عَلَى يَقِينٍ أَوْ غَلَبَ عَلَى ظَنِّهِ أَنَّهُ مُصِيبٌ، حَيْثُ إِنَّهُ يَرَى أَنَّهُ فِي الرَّابِعَةِ، وَالْمَأْمُومُونَ يَرَوْنَ أَنَّهُ فِي الْخَامِسَةِ لَمْ يَسْتَجِبْ لَهُمْ.\nوَذَهَبَ الْمَالِكِيَّةُ إِلَى أَنَّهُ إِذَا كَثُرَ عَدَدُهُمْ بِحَيْثُ يُفِيدُ عَدَدُهُمُ الْعِلْمَ الضَّرُورِيَّ فَيَتْرُكُ يَقِينَهُ وَيَرْجِعُ لَهُمْ فِيمَا أَخْبَرُوهُ بِهِ مِنْ نَقْصٍ أَوْ كَمَالٍ، وَإِلاَّ لَمْ يَعُدْ. (١)\nوَهَذَا إِذَا كَانَ الإِْمَامُ عَلَى يَقِينٍ مِنْ نَفْسِهِ، أَمَّا إِذَا شَكَّ وَلَمْ يَغْلِبْ ظَنُّهُ عَلَى أَمْرٍ عَادَ لِقَوْل الْمَأْمُومِينَ إِذَا كَانُوا ثِقَاتٍ أَوْ كَثُرَ عَدَدُهُمْ. لِحَدِيثِ ذِي الْيَدَيْنِ عِنْدَمَا أَخْبَرَ النَّبِيُّ ﷺ فَسَأَل الرَّسُول ﷺ النَّاسَ فَأَجَابُوهُ (٢) . وَهَذَا قَوْل جُمْهُورِ الْعُلَمَاءِ إِلاَّ الشَّافِعِيَّةَ، فَإِنَّهُمْ ذَهَبُوا إِلَى أَنَّ الإِْمَامَ إِذَا شَكَّ أَصَلَّى ثَلاَثًا أَمْ أَرْبَعًا أَتَى بِرَكْعَةٍ، لأَِنَّ الأَْصْل عَدَمُ إِتْيَانِهِ بِهَا وَلاَ يَرْجِعُ لِظَنِّهِ وَلاَ لِقَوْل غَيْرِهِ أَوْ فِعْلِهِ وَإِنْ كَانَ جَمْعًا كَثِيرًا، إِلاَّ أَنْ يَبْلُغُوا حَدَّ التَّوَاتُرِ بِقَرِينَةٍ. وَحَدِيثُ ذِي الْيَدَيْنِ مَحْمُولٌ\n_________\n(١) رد المحتار ١ / ٥٠٧، حاشية الطحطاوي (ص ٢٥٩) نهاية المحتاج ٢ / ٧٥، روضة الطالبين ١ / ٣٠٨، الخرشي على مختصر خليل ١ / ٣٢٢، المغني لابن قدامة ٢ / ١٨ - ٢٠.\n(٢) حديث \" ذي اليدين \". أخرجه البخاري (الفتح ٣ / ٩٨ - ط السلفية) .\nعَلَى تَذَكُّرِهِ بَعْدَ مُرَاجَعَتِهِ، أَوْ أَنَّهُمْ بَلَغُوا حَدَّ التَّوَاتُرِ. (١)\nسُجُودُ الإِْمَامِ لِلسَّهْوِ:\n١٢ - إِذَا سَهَا الإِْمَامُ فِي صَلاَتِهِ ثُمَّ سَجَدَ لِلسَّهْوِ فَعَلَى الْمَأْمُومِ مُتَابَعَتُهُ فِي السُّجُودِ سَوَاءٌ سَهَا مَعَهُ أَوِ انْفَرَدَ الإِْمَامُ بِالسَّهْوِ. قَال ابْنُ الْمُنْذِرِ: أَجْمَعَ كُل مَنْ نَحْفَظُ عَنْهُ مِنْ أَهْل الْعِلْمِ عَلَى ذَلِكَ سَوَاءٌ كَانَ قَبْل السَّلاَمِ أَوْ بَعْدَ السَّلاَمِ. لِقَوْل الرَّسُول ﷺ: إِنَّمَا جُعِل الإِْمَامُ لِيُؤْتَمَّ بِهِ. . . وَإِذَا سَجَدَ فَاسْجُدُوا (٢) وَلِحَدِيثِ ابْنِ عُمَرَ - ﵄ - لَيْسَ عَلَى مَنْ خَلْفَ الإِْمَامِ سَهْوٌ، فَإِنْ سَهَا الإِْمَامُ فَعَلَيْهِ وَعَلَى مَنْ خَلْفَهُ السَّهْوُ (٣)\nوَلأَِنَّ الْمَأْمُومَ تَابِعٌ لِلإِْمَامِ وَحُكْمُهُ حُكْمُهُ إِذَا سَهَا، وَكَذَلِكَ إِذَا لَمْ يَسْهُ (٤) .\n_________\n(١) رد المحتار ١ / ٥٠٧، نهاية المحتاج ٢ / ٧٥، الخرشي على مختصر خليل ١ / ٣٢٢، المغني لابن قدامة ٢ / ٢٠.\n(٢) حديث: \" إنما جعل الإمام ليؤتم به. . . وإذا سجد فاسجدوا \". أخرجه البخاري (الفتح ٢ / ٢١٦ - ط السلفية) ومسلم (١ / ٣٠٨ - ط الحلبي) من حديث أبي هريرة.\n(٣) حديث: \" ليس على من خلف الإمام سهو \". أخرجه الدارقطني (١ / ٣٧٧ - ط دار المحاسن) وعلقه البيهقي (٢ / ٣٥٢ - ط دائرة المعارف العثمانية) وضعفه.\n(٤) رد المحتار ١ / ٤٩٩، الخرشي على مختصر خليل ١ / ٣٣١ - ٣٣٢، روضة الطالبين ١ / ٣١٢، المغني لابن قدامة ١ / ٤١ - ٤٢."
