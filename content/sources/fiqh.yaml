  text_ar: "أَمَّا إِذَا لَمْ يَسْجُدِ الإِْمَامُ فَذَهَبَ الْحَنَفِيَّةُ وَهُوَ قَوْلٌ مُخَرَّجٌ عِنْدَ الشَّافِعِيَّةِ وَرِوَايَةٌ عِنْدَ الْحَنَابِلَةِ: إِلَى أَنَّهُ لاَ يَسْجُدُ الْمَأْمُومُ لأَِنَّهُ يَصِيرُ مُخَالِفًا، وَلِحَدِيثِ ابْنِ عُمَرَ فَإِنْ سَهَا الإِْمَامُ فَعَلَيْهِ وَعَلَى مَنْ خَلْفَهُ السَّهْوُ وَإِلَى هَذَا ذَهَبَ عَطَاءٌ وَالْحَسَنُ وَالنَّخَعِيُّ.\nوَذَهَبَ الْمَالِكِيَّةُ وَالشَّافِعِيَّةُ عَلَى الصَّحِيحِ الْمَنْصُوصِ عِنْدَهُمْ وَهُوَ رِوَايَةٌ عِنْدَ الْحَنَابِلَةِ إِلَى أَنَّ الْمَأْمُومَ يَسْجُدُ لِلسَّهْوِ إِذَا لَمْ يَسْجُدِ الإِْمَامُ، لأَِنَّهُ لَمَّا سَهَا دَخَل النَّقْصُ عَلَى صَلاَتِهِ بِالسَّهْوِ فَإِذَا لَمْ يَجْبُرِ الإِْمَامُ صَلاَتَهُ جَبَرَ الْمَأْمُومُ صَلاَتَهُ. وَبِهِ قَال الأَْوْزَاعِيُّ وَاللَّيْثُ وَأَبُو ثَوْرٍ، وَحَكَاهُ ابْنُ الْمُنْذِرِ عَنِ ابْنِ سِيرِينَ (١) .\nسُجُودُ الْمَسْبُوقِ لِلسَّهْوِ:\n١٣ - اتَّفَقَ الْفُقَهَاءُ عَلَى وُجُوبِ مُتَابَعَةِ الْمَسْبُوقِ لإِمَامِهِ فِي سُجُودِ السَّهْوِ إِذَا سَبَقَهُ فِي بَعْضِ الصَّلاَةِ، وَلَكِنَّ الْخِلاَفَ وَقَعَ فِي مِقْدَارِ الإِْدْرَاكِ مِنَ الصَّلاَةِ.\nفَذَهَبَ الْجُمْهُورُ مِنَ الْحَنَفِيَّةِ وَالشَّافِعِيَّةِ وَالْحَنَابِلَةِ إِلَى أَنَّ الْمُصَلِّيَ إِذَا أَدْرَكَ مَعَ إِمَامِهِ أَيَّ رُكْنٍ مِنْ أَرْكَانِ الصَّلاَةِ قَبْل سُجُودِ السَّهْوِ وَجَبَ\n_________\n(١) رد المحتار ١ / ٤٩٩، البناية للعيني ٢ / ٦٦١ - ٦٦٢، الخرشي على مختصر خليل ١ / ٣٣١ - ٣٣٢، روضة الطالبين ١ / ١٦٢، المجموع للنووي ٤ / ١٤٣ - ١٤٧، المغني لابن قدامة ١ / ٤١ - ٤٢، الكافي للحنابلة ١ / ١٧٠.\nعَلَيْهِ مُتَابَعَةُ إِمَامِهِ فِي سُجُودِهِ لِلسَّهْوِ، وَسَوَاءٌ كَانَ هَذَا السَّهْوُ قَبْل الاِقْتِدَاءِ أَوْ بَعْدَهُ. لِعُمُومِ قَوْلِهِ ﷺ: إِنَّمَا جُعِل الإِْمَامُ لِيُؤْتَمَّ بِهِ (١) وَلِقَوْلِهِ ﵊: فَمَا أَدْرَكْتُمْ فَصَلُّوا وَمَا فَاتَكُمْ فَأَتِمُّوا (٢) وَإِنِ اقْتَدَى بِهِ بَعْدَ السَّجْدَةِ الثَّانِيَةِ مِنَ السَّهْوِ فَلاَ سُجُودَ عَلَيْهِ.\nوَلَكِنَّهُمُ اخْتَلَفُوا فِيمَا لَوِ اقْتَدَى الْمَسْبُوقُ بِالإِْمَامِ بَعْدَ السَّجْدَةِ الأُْولَى هَل يَقْضِيهَا أَمْ لاَ؟ فَذَهَبَ الْحَنَفِيَّةُ إِلَى أَنَّهُ لاَ قَضَاءَ عَلَيْهِ بَل تَكْفِيهِ السَّجْدَةُ الثَّانِيَةُ.\nوَذَهَبَ الشَّافِعِيَّةُ وَالْحَنَابِلَةُ نَصًّا إِلَى أَنَّهُ يَقْضِي الأُْولَى بَعْدَ أَنْ يُسَلِّمَ الإِْمَامُ، يَسْجُدُهَا ثُمَّ يَقْضِي مَا فَاتَهُ (٣) . لِقَوْلِهِ ﷺ: وَمَا فَاتَكُمْ فَأَتِمُّوا.\nوَذَهَبَ الْمَالِكِيَّةُ عَلَى الْمَشْهُورِ وَهُوَ رِوَايَةٌ عَنْ أَحْمَدَ إِلَى أَنَّهُ إِذَا لَمْ يُدْرِكِ الْمَسْبُوقُ مَعَ الإِْمَامِ رَكْعَةً مِنَ الصَّلاَةِ فَلاَ سُجُودَ عَلَيْهِ، سَوَاءٌ أَكَانَ السُّجُودُ بَعْدِيًّا أَوْ قَبْلِيًّا. وَإِذَا سَجَدَ مَعَ إِمَامِهِ بَطَلَتْ صَلاَتُهُ عَامِدًا أَوْ جَاهِلًا؛ لأَِنَّهُ غَيْرُ مَأْمُومٍ حَقِيقَةً، لِذَا لاَ يَسْجُدُ بَعْدَ تَمَامِ صَلاَتِهِ، وَأَمَّا الْبَعْدِيُّ\n_________\n(١) حديث: \" إنما جعل الإمام ليؤتم به \". تقدم تخريجه ف / ١٢.\n(٢) حديث: \" فما أدركتم فصلوا وما فاتكم فأتموا \". أخرجه البخاري (الفتح ٢ / ١١٦ - ط السلفية) من حديث أبي قتادة.\n(٣) حاشية ابن عابدين ١ / ٤٩٩، روضة الطالبين ١ / ٣١٤، المجموع للنووي ٤ / ١٤٧، المغني لابن قدامة ١ / ٤١ - ٤٢، كشاف القناع ١ / ٤٠٨."
