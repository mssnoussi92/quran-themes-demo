  notes: "le doute dans la prière selon les écoles (début)"
  text_ar: "أَوَّل مَا عَرَضَ لَهُ اسْتَأْنَفَ، لِقَوْلِهِ ﷺ: إِذَا شَكَّ أَحَدُكُمْ فِي صَلاَتِهِ أَنَّهُ كَمْ صَلَّى فَلْيَسْتَقْبِل الصَّلاَةَ. (١) وَإِنْ كَانَ يَعْرِضُ لَهُ كَثِيرًا بَنَى عَلَى أَكْبَرِ رَأْيِهِ، لِقَوْلِهِ ﷺ: إِذَا شَكَّ أَحَدُكُمْ فِي صَلاَتِهِ فَلْيَتَحَرَّ الصَّوَابَ (٢) وَإِنْ لَمْ يَكُنْ لَهُ رَأْيٌ بَنَى عَلَى الْيَقِينِ، لِقَوْلِهِ ﵊: إِذَا سَهَا أَحَدُكُمْ فَلَمْ يَدْرِ وَاحِدَةً صَلَّى أَوْ ثِنْتَيْنِ فَلْيَبْنِ عَلَى وَاحِدَةٍ، فَإِنْ لَمْ يَدْرِ ثِنْتَيْنِ صَلَّى أَوْ ثَلاَثًا فَلْيَبْنِ عَلَى ثِنْتَيْنِ، فَإِنْ لَمْ يَدْرِ ثَلاَثًا صَلَّى أَوْ أَرْبَعًا فَلْيَبْنِ عَلَى ثَلاَثٍ، وَلْيَسْجُدْ سَجْدَتَيْنِ قَبْل أَنْ يُسَلِّمَ. (٣)\nوَالاِسْتِقْبَال لاَ يَكُونُ إِلاَّ بَعْدَ الْخُرُوجِ مِنَ الصَّلاَةِ وَذَلِكَ بِالسَّلاَمِ أَوِ الْكَلاَمِ أَوْ عَمَلٍ آخَرَ مِمَّا يُنَافِي الصَّلاَةَ، وَالْخُرُوجُ بِالسَّلاَمِ قَاعِدًا أَوْلَى؛ لأَِنَّ السَّلاَمَ عُرِفَ مُحَلِّلًا دُونَ الْكَلاَمِ، وَلاَ يَصِحُّ الْخُرُوجُ بِمُجَرَّدِ النِّيَّةِ بَل يَلْغُو، وَلاَ يَخْرُجُ بِذَلِكَ\n_________\n(١) حديث: \" إذا شك أحدكم في صلاته أنه كم صلى فليستقبل الصلاة \" قال الزيلعي في نصب الراية (٢ / ١٧٣ - ط المجلس العلمي): حديث غريب، يعني أنه لا أصل له كما نص في مقدمة كتابه، ثم قال: وأخرج ابن أبي شيبة في مصنفه عن ابن عمر قال في الذي لا يدري كم صلى أثلاثًا أو أربعًا؟ قال: يعيد حتى يحفظ.\n(٢) حديث: \" إذا شك أحدكم في صلاته فليتحر الصواب \". أخرجه البخاري (الفتح ١ / ٥٠٤ - ط السلفية) ومسلم (١ / ٤٠١ - ط الحلبي) من حديث ابن مسعود.\n(٣) الحديث تقدم تخريجه في نفس الفقرة.\nمِنَ الصَّلاَةِ، وَعِنْدَ الْبِنَاءِ عَلَى الأَْقَل يَقْعُدُ فِي كُل مَوْضِعٍ يُحْتَمَل أَنْ يَكُونَ آخِرَ الصَّلاَةِ تَحَرُّزًا عَنْ تَرْكِ فَرْضِ الْقَعْدَةِ الأَْخِيرَةِ وَهِيَ رُكْنٌ.\nوَذَهَبَ الْحَنَابِلَةُ فِي رِوَايَةٍ إِلَى الْبِنَاءِ عَلَى غَالِبِ الظَّنِّ، وَيُتِمُّ صَلاَتَهُ، وَيَسْجُدُ بَعْدَ السَّلاَمِ، وَدَلِيلُهُمْ حَدِيثُ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ السَّابِقُ: إِذَا شَكَّ أَحَدُكُمْ فِي صَلاَتِهِ فَلْيَتَحَرَّ الصَّوَابَ، فَلْيُتِمَّ عَلَيْهِ، ثُمَّ لْيُسَلِّمْ، ثُمَّ يَسْجُدْ سَجْدَتَيْنِ (١) .\nقَال ابْنُ قُدَامَةَ: وَاخْتَارَ الْخِرَقِيُّ التَّفْرِيقَ بَيْنَ الإِْمَامِ وَالْمُنْفَرِدِ. فَجَعَل الإِْمَامُ يَبْنِي عَلَى الظَّنِّ وَالْمُنْفَرِدُ يَبْنِي عَلَى الْيَقِينِ. وَهُوَ الظَّاهِرُ فِي الْمَذْهَبِ نَقَلَهُ عَنْ أَحْمَدَ وَالأَْثْرَمِ وَغَيْرِهِ. وَالْمَشْهُورُ عَنْ أَحْمَدَ: الْبِنَاءُ عَلَى الْيَقِينِ فِي حَقِّ الْمُنْفَرِدِ؛ لأَِنَّ الإِْمَامَ لَهُ مَنْ يُنَبِّهُهُ وَيُذَكِّرُهُ إِذَا أَخْطَأَ الصَّوَابَ، فَلْيَعْمَل بِالأَْظْهَرِ عِنْدَهُ، فَإِنْ أَصَابَ أَقَرَّهُ الْمَأْمُومُونَ، فَيَتَأَكَّدُ عِنْدَهُ صَوَابُ نَفْسِهِ، وَإِنْ أَخْطَأَ سَبَّحُوا بِهِ، فَرَجَعَ إِلَيْهِمْ فَيَحْصُل لَهُ الصَّوَابُ عَلَى كِلْتَا الْحَالَتَيْنِ وَلَيْسَ كَذَلِكَ الْمُنْفَرِدُ، إِذْ لَيْسَ لَهُ مَنْ يُذَكِّرُهُ فَيَبْنِي عَلَى الْيَقِينِ، لِيَحْصُل لَهُ إِتْمَامُ صَلاَتِهِ وَلاَ يَكُونُ مَغْرُورًا\n_________\n(١) حديث: \" إذا شك أحدكم في صلاته فليتحر الصواب \". أخرجه البخاري (الفتح ١ / ٥٠٤ - ط السلفية) ومسلم (١ / ٤٠١ - ط الحلبي) من حديث ابن مسعود، واللفظ للبخاري."
