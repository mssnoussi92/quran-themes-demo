  text_ar: "بِهَا (١) . وَهُوَ مَعْنَى قَوْلِهِ ﷺ: لاَ غِرَارَ فِي الصَّلاَةِ. (٢) فَإِنِ اسْتَوَى الأَْمْرَانِ عِنْدَ الإِْمَامِ بَنَى عَلَى الْيَقِينِ أَيْضًا.\nالأَْحْكَامُ الْمُتَعَلِّقَةُ بِسُجُودِ السَّهْوِ:\n٥ - مَذْهَبُ الْحَنَفِيَّةِ: جَاءَ فِي الْفَتَاوَى الْهِنْدِيَّةِ نَقْلًا عَنِ التتارخانية الأَْصْل أَنَّ الْمَتْرُوكَ ثَلاَثَةُ أَنْوَاعٍ: فَرْضٌ، وَسُنَّةٌ، وَوَاجِبٌ، فَفِي الْفَرْضِ إِنْ أَمْكَنَهُ التَّدَارُكُ بِالْقَضَاءِ يَقْضِي وَإِلاَّ فَسَدَتْ صَلاَتُهُ، وَفِي السُّنَّةِ لاَ تَفْسُدُ، لأَِنَّ قِيَامَ الصَّلاَةِ بِأَرْكَانِهَا وَقَدْ وُجِدَتْ، وَلاَ يُجْبَرُ تَرْكُ السُّنَّةِ بِسَجْدَتَيِ السَّهْوِ، وَفِي الْوَاجِبِ إِنْ تَرَكَ سَاهِيًا يُجْبَرُ بِسَجْدَتَيِ السَّهْوِ، وَإِنْ تَرَكَ عَامِدًا لاَ. وَنُقِل عَنِ الْبَحْرِ الرَّائِقِ أَنَّهُ لَوْ تَرَكَ سَجْدَةً مِنْ رَكْعَةٍ فَتَذَكَّرَهَا فِي آخِرِ الصَّلاَةِ سَجَدَهَا وَسَجَدَ لِلسَّهْوِ لِتَرْكِ التَّرْتِيبِ فِيهِ، وَلَيْسَ عَلَيْهِ إِعَادَةُ مَا قَبْلَهَا، وَلَوْ قَدَّمَ الرُّكُوعَ عَلَى الْقِرَاءَةِ لَزِمَهُ السُّجُودُ لَكِنْ لاَ يُعْتَدُّ بِالرُّكُوعِ فَيُفْرَضُ إِعَادَتُهُ بَعْدَ الْقِرَاءَةِ.\n_________\n(١) الفتاوى الهندية ١ / ١٣٠، البناية ٣ / ٦٨٠، وشرح الزرقاني ١ / ٢٣٦ - ٢٣٧، الشرح الصغير ١ / ٣٨٠، الجمل على شرح المنهج ١ / ٤٥٤، المجموع للنووي ٤ / ١٠٦، كشاف القناع ١ / ٤٠٦، الكافي ١ / ١٦٧ - ١٦٨.\n(٢) حديث: \" لا غرار في الصلاة \". أخرجه أحمد (٢ / ٤٦١ - ط الميمنية) والحاكم (١ / ٢٦٤ - ط دائرة المعارف العثمانية) من حديث أبي هريرة، وصححه الحاكم ووافقه الذهبي، واللفظ لأحمد.\nوَذَهَبَ الْمَالِكِيَّةُ إِلَى أَنَّ تَرْكَ الرُّكْنِ إِنْ أَمْكَنَهُ تَدَارُكَهُ وَجَبَ عَلَيْهِ التَّدَارُكُ مَعَ سُجُودِ السَّهْوِ وَذَلِكَ إِذَا أَتَى بِهِ فِي الرَّكْعَةِ نَفْسِهَا إِلَى مَا قَبْل عَقْدِ رَكْعَةٍ أُخْرَى بِالرُّكُوعِ لَهَا، فَإِنْ كَانَ تَرَكَ الرُّكْنَ فِي الرَّكْعَةِ الأَْخِيرَةِ ثُمَّ سَلَّمَ لَمْ يُمْكِنْهُ التَّدَارُكُ بِأَدَاءِ الْمَتْرُوكِ بَل عَلَيْهِ الإِْتْيَانُ بِرَكْعَةٍ أُخْرَى مَا لَمْ يَطُل الْفَصْل أَوْ يَخْرُجْ مِنَ الْمَسْجِدِ فَعَلَيْهِ اسْتِئْنَافُ الصَّلاَةِ.\nوَقَال الشَّافِعِيَّةُ: إِنْ تَرَكَ رُكْنًا سَهْوًا لَمْ يُعْتَدَّ بِمَا فَعَلَهُ بَعْدَ الْمَتْرُوكِ حَتَّى يَأْتِيَ بِمَا تَرَكَهُ، فَإِنْ تَذَكَّرَ السَّهْوَ قَبْل فِعْل مِثْل الْمَتْرُوكِ اشْتَغَل عِنْدَ الذِّكْرِ بِالْمَتْرُوكِ، وَإِنْ تَذَكَّرَ بَعْدَ فِعْل مِثْلِهِ فِي رَكْعَةٍ أُخْرَى تَمَّتِ الرَّكْعَةُ السَّابِقَةُ بِهِ وَلَغَا مَا بَيْنَهُمَا. فَإِنْ لَمْ يَعْرِفْ عَيْنَ الْمَتْرُوكِ أَخَذَ بِأَدْنَى الْمُمْكِنِ وَأَتَى بِالْبَاقِي. وَفِي الأَْحْوَال كُلِّهَا سَجَدَ لِلسَّهْوِ.\nوَعِنْدَ الْحَنَابِلَةِ مَنْ نَسِيَ رُكْنًا غَيْرَ التَّحْرِيمَةِ فَذَكَرَهُ بَعْدَ شُرُوعِهِ فِي قِرَاءَةِ الرَّكْعَةِ الَّتِي بَعْدَهَا بَطَلَتِ الرَّكْعَةُ الَّتِي تَرَكَهُ مِنْهَا فَقَطْ؛ لأَِنَّهُ تَرَكَ رُكْنًا وَلَمْ يُمْكِنِ اسْتِدْرَاكُهُ فَصَارَتِ الَّتِي شَرَعَ فِيهَا عِوَضًا عَنْهَا، وَإِنْ ذَكَرَ الرُّكْنَ الْمَنْسِيَّ قَبْل شُرُوعِهِ فِي قِرَاءَةِ الرَّكْعَةِ الَّتِي بَعْدَهَا عَادَ لُزُومًا فَأَتَى بِهِ وَبِمَا بَعْدَهُ. (١)\n_________\n(١) الفتاوى الهندية ١ / ١٢٦، بدائع الصنائع ١ / ٤٤٩، المبسوط ١ / ١٨٩، الدسوقي ١ / ٢٩٣، الشرح الصغير ١ / ١٦٠، الروضة ١ / ٣٠٠، المجموع للنووي ٤ / ١١٦، كشاف القناع ١ / ٤٠٢، المغني لابن قدامة ٢ / ٦."
