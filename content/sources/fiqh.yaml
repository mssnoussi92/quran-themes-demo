  notes: "définition et statut de la prosternation de l'oubli"
  text_ar: "سُجُودُ السَّهْوِ\n.\nالتَّعْرِيفُ:\n١ - السَّهْوُ لُغَةً: نِسْيَانُ الشَّيْءِ وَالْغَفْلَةُ عَنْهُ. (١) وَسُجُودُ السَّهْوِ عِنْدَ الْفُقَهَاءِ: هُوَ مَا يَكُونُ فِي آخِرِ الصَّلاَةِ أَوْ بَعْدَهَا لِجَبْرِ خَلَلٍ، بِتَرْكِ بَعْضِ مَأْمُورٍ بِهِ أَوْ فِعْل بَعْضِ مَنْهِيٍّ عَنْهُ دُونَ تَعَمُّدٍ (٢) .\nالْحُكْمُ التَّكْلِيفِيُّ:\n٢ - ذَهَبَ الْحَنَفِيَّةُ وَالْحَنَابِلَةُ فِي الْمُعْتَمَدِ عِنْدَهُمْ إِلَى وُجُوبِ سُجُودِ السَّهْوِ.\nقَال الْحَنَابِلَةُ: سُجُودُ السَّهْوِ لِمَا يُبْطِل عَمْدُهُ الصَّلاَةَ وَاجِبٌ، وَدَلِيلُهُمْ حَدِيثُ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ قَال: صَلَّى بِنَا رَسُول اللَّهِ ﷺ خَمْسًا، فَلَمَّا انْفَتَل تَوَشْوَشَ الْقَوْمُ بَيْنَهُمْ فَقَال: مَا شَأْنُكُمْ؟ قَالُوا: يَا رَسُول اللَّهِ هَل زِيدَ فِي الصَّلاَةِ؟ قَال: لاَ، قَالُوا: فَإِنَّك قَدْ\n_________\n(١) لسان العرب مادة: (سها) .\n(٢) الإقناع للشربيني الخطيب ٢ / ٨٩.\nصَلَّيْتَ خَمْسًا، فَانْفَتَل ثُمَّ سَجَدَ سَجْدَتَيْنِ ثُمَّ سَلَّمَ، ثُمَّ قَال: إِنَّمَا أَنَا بَشَرٌ مِثْلُكُمْ، أَنْسَى كَمَا تَنْسَوْنَ، فَإِذَا نَسِيَ أَحَدُكُمْ فَلْيَسْجُدْ سَجْدَتَيْنِ وَفِي رِوَايَةٍ: فَإِذَا زَادَ الرَّجُل أَوْ نَقَصَ فَلْيَسْجُدْ سَجْدَتَيْنِ (١) وَحَدِيثُ أَبِي سَعِيدٍ الْخُدْرِيِّ ﵁ قَال: قَال رَسُول اللَّهِ ﷺ: إِذَا شَكَّ أَحَدُكُمْ فِي صَلاَتِهِ فَلَمْ يَدْرِ كَمْ صَلَّى، أَثَلاَثًا أَمْ أَرْبَعًا؟ فَلْيَطْرَحِ الشَّكَّ وَلْيَبْنِ عَلَى مَا اسْتَيْقَنَ، ثُمَّ يَسْجُدُ سَجْدَتَيْنِ قَبْل أَنْ يُسَلِّمَ، فَإِنْ كَانَ صَلَّى خَمْسًا شَفَعْنَ لَهُ صَلاَتَهُ، وَإِنْ كَانَ صَلَّى إِتْمَامًا لأَِرْبَعٍ كَانَتَا تَرْغِيمًا لِلشَّيْطَانِ. (٢)\nوَجْهُ الدَّلاَلَةِ فِي الْحَدِيثَيْنِ أَنَّهُمَا اشْتَمَلاَ عَلَى الأَْمْرِ الْمُقْتَضِي لِلْوُجُوبِ.\nوَمَذْهَبُ الْمَالِكِيَّةِ: أَنَّ سُجُودَ السَّهْوِ سُنَّةٌ سَوَاءٌ كَانَ قَبْلِيًّا أَمْ بَعْدِيًّا وَهُوَ الْمَشْهُورُ مِنَ الْمَذْهَبِ، وَقِيل: بِوُجُوبِ الْقَبْلِيِّ، قَال صَاحِبُ الشَّامِل: وَهُوَ مُقْتَضَى الْمَذْهَبِ.\nوَمَذْهَبُ الشَّافِعِيَّةِ وَهُوَ رِوَايَةٌ عِنْدَ الْحَنَابِلَةِ إِلَى أَنَّهُ سُنَّةٌ (٣) . لِقَوْلِهِ ﷺ: كَانَتِ الرَّكْعَةُ نَافِلَةً\n_________\n(١) حديث: \" إنما أنا بشر مثلكم \". أخرجه مسلم (١ / ٤٠٢ - ٤٠٣ - ط الحلبي) .\n(٢) حديث: \" إذا شك أحدكم في صلاته فلم يدر كم صلى \". أخرجه مسلم (١ / ٤٠٢ - ط الحلبي) .\n(٣) الفتاوى الهندية ١ / ١٢٥، حاشية الدسوقي ١ / ٢٧٣، نهاية المحتاج ٢ / ٦٢، المغني ٢ / ٣٦، وكشاف القناع ١ / ٤٠٨."
  validated_by: mssnoussi92
