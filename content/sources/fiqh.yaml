  text_ar: "الَّذِي قَبْل السَّلاَمِ أَوْ بَعْدَهُ أَتَى بِهِ وَلَوْ تَكَلَّمَ، إِلاَّ بِطُول الْفَصْل (وَيُرْجَعُ فِيهِ إِلَى الْعَادَةِ وَالْعُرْفِ مِنْ غَيْرِ تَقْدِيرٍ بِمُدَّةٍ) أَوْ بِانْتِقَاضِ الْوُضُوءِ، أَوْ بِالْخُرُوجِ مِنَ الْمَسْجِدِ، فَإِنْ حَصَل شَيْءٌ مِنْ ذَلِكَ اسْتَأْنَفَ الصَّلاَةَ، لأَِنَّهَا صَلاَةٌ وَاحِدَةٌ لَمْ يَجُزْ بِنَاءُ بَعْضِهَا عَلَى بَعْضٍ مَعَ طُول الْفَصْل، كَمَا لَوِ انْتَقَضَ وُضُوءَهُ (١)\nوَإِنْ سَجَدَ لِلسَّهْوِ ثُمَّ شَكَّ هَل سَجَدَ أَمْ لاَ؟ فَعِنْدَ الْحَنَفِيَّةِ يَتَحَرَّى، وَلَكِنْ لاَ يَجِبُ عَلَيْهِ السُّجُودُ.\nوَقَال الْمَالِكِيَّةُ: إِذَا شَكَّ هَل سَجَدَ سَجْدَةً وَاحِدَةً أَوِ اثْنَتَيْنِ بَنَى عَلَى الْيَقِينِ وَأَتَى بِالثَّانِيَةِ وَلاَ سُجُودَ عَلَيْهِ ثَانِيًا لِهَذَا الشَّكِّ. وَكَذَلِكَ لَوْ شَكَّ هَل سَجَدَ السَّجْدَتَيْنِ أَوْ لاَ، فَيَسْجُدُهُمَا وَلاَ سَهْوَ عَلَيْهِ، وَإِلَيْهِ ذَهَبَ الْحَنَابِلَةُ وَالشَّافِعِيَّةُ فِي وَجْهٍ، وَالْوَجْهُ الثَّانِي وَهُوَ الأَْصَحُّ عِنْدَهُمْ أَنَّهُ لاَ يُعِيدُهُ. (٢)\nسَهْوُ الإِْمَامِ وَالْمَأْمُومِ:\n١٠ - ذَهَبَ جُمْهُورُ الْفُقَهَاءِ إِلَى جَوَازِ تَنْبِيهِ الْمَأْمُومِ لِلإِْمَامِ إِذَا سَهَا فِي صَلاَتِهِ، لِقَوْلِهِ ﷺ: مَنْ نَابَهُ\n_________\n(١) المغني لابن قدامة ٢ / ١٤، ١٥.\n(٢) الفتاوى الهندية ١ / ١٣٠، الشرح الكبير ١ / ٢٧٨ - ٢٧٩، المجموع للنووي ٤ / ١٤٠ - ١٤١، كشاف القناع ١ / ٤٠٧.\nشَيْءٌ فِي صَلاَتِهِ فَلْيَقُل: سُبْحَانَ اللَّهِ. (١)\nوَفَرَّقَ الْجُمْهُورُ مِنَ الْحَنَفِيَّةِ وَالشَّافِعِيَّةِ وَالْحَنَابِلَةِ بَيْنَ تَنْبِيهِ الرِّجَال وَتَنْبِيهِ النِّسَاءِ. فَالرِّجَال يُسَبِّحُونَ لِسَهْوِ إِمَامِهِمْ، وَالنِّسَاءُ يُصَفِّقْنَ بِضَرْبِ بَطْنِ كَفٍّ عَلَى ظَهْرِ الأُْخْرَى. لِحَدِيثِ أَبِي هُرَيْرَةَ ﵁ قَال: قَال رَسُول اللَّهِ ﷺ: التَّسْبِيحُ لِلرِّجَال وَالتَّصْفِيقُ لِلنِّسَاءِ (٢) وَلِقَوْلِهِ ﵊: إِذَا نَابَكُمْ أَمْرٌ فَلْيُسَبِّحِ الرِّجَال وَلْيَصْفَحِ (يَعْنِي لِيُصَفِّقِ) النِّسَاءُ. (٣)\nوَلَمْ يُفَرِّقِ الْمَالِكِيَّةُ بَيْنَ تَنْبِيهِ الرِّجَال وَالنِّسَاءِ فَالْجَمِيعُ يُسَبِّحُ (٤) لِعُمُومِ قَوْلِهِ ﷺ: مَنْ نَابَهُ شَيْءٌ فِي صَلاَتِهِ فَلْيَقُل: سُبْحَانَ اللَّهِ.\nوَيُكْرَهُ عِنْدَهُمْ تَصْفِيقُ النِّسَاءِ فِي الصَّلاَةِ.\n_________\n(١) حديث: \" من نابه شيء في صلاته فليقل: سبحان الله \". أخرجه البخاري (الفتح ٣ / ١٠٧ - ط السلفية) من حديث سهل بن سعد.\n(٢) حديث: \" التسبيح للرجال والتصفيق للنساء \". أخرجه البخاري (الفتح ٣ / ٧٧ - ط السلفية) ومسلم (١ / ٣١٨ - ط الحلبي) .\n(٣) حديث: \" إذا نابكم أمر فليسبح الرجال \". أخرجه البخاري (الفتح ١٣ / ١٨٢ - ط السلفية) من حديث سهل بن سعد. وأخرجه الدارمي (١ / ٣١٧ - ط دار السنة النبوية) بلفظ: \" إذا نابكم شيء في صلاتكم، فليسبح الرجال ولتصفق النساء \".\n(٤) فتح القدير ١ / ٣٥٦، البناية ٢ / ٤٢٣، مواهب الجليل ٢ / ٢٩، الشرح الصغير ١ / ٣٤٢، نهاية المحتاج ٢ / ٤٤ - ٤٥، المغني ٢ / ١٩."
