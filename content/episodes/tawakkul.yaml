  - id: end-recap
    role: conclusion
    reel: tawakkul-05
    audio: tts
    narration:
      ar: "التوكل مش قعدة… والخوف مش ضعف إيمان… ومش لازم تشيلها لوحدك… وربنا كفاية."
      en: "Trusting God isn't sitting idle… fear isn't weak faith… you don't have to carry it alone… and God is enough."
