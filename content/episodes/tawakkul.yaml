# Épisode La confiance en Dieu (التوكل), avec la peur et le sentiment d'impuissance (الخوف والشعور بالعجز) :
# 5 reels (9:16) pour Facebook, Instagram et TikTok ; l'épisode entier (16:9 et 9:16) pour YouTube. Même
# structure que les épisodes précédents (docs/design.md) : l'accroche et la promesse, une idée reçue par reel,
# la conclusion. Thème et plan choisis par le propriétaire le 2026-11-07 (docs/themes.md) ; sources, script,
# traduction, textes de publication et miniature validés par le propriétaire le même jour ; lectures et prises à
# valider à l'écoute. Toute modification d'une ligne d'un reel retire son validated_by.
# Les répliques identiques à une prise figée d'un autre épisode (« قال ربنا سبحانه وتعالى: », « تاني فكرة
# غلط… », « تالت فكرة غلط… », « وفي الآخر… آية تطمن قلبك. دي الأخيرة. ») reprennent cette prise (take_from).
episode: tawakkul
title: { ar: "التوكل", en: "Trust in God" }
narration_language: ar-egy   # VoiceTut (égyptien), comme les autres épisodes
# Textes de publication : proposés le 2026-11-07, faits des répliques du script ; validés par le
# propriétaire le même jour (validated_by), exigés par un rendu final. Le reste : video/scripts/publish.ts.
publish:
  title: { en: "Trust in God: 3 wrong ideas you might believe", ar: "تلات أفكار غلط عن التوكل… يمكن تكون مصدق واحدة منهم" }
  description:
    en: "Awake at night, thinking about tomorrow? Three wrong ideas keep us from trusting God: that it means doing nothing, that fear means weak faith, and that you have to carry everything on your own. Each one, answered from the Qur'an and the Sunnah."
    ar: "صاحي بالليل بتفكر في بكرة؟ فيه تلات أفكار غلط بتبعدنا عن التوكل: إنه يعني متعملش حاجة، وإن الخوف معناه إن إيمانك ضعيف، وإنك لازم تشيل كل حاجة لوحدك. والرد على كل فكرة من القرآن والسنة."
  hashtags: ["#Tawakkul", "#التوكل", "#Islam"]
  validated_by: mssnoussi92
# Miniature YouTube (Thumbnail169), proposée le 2026-11-07 : gros plan, fond uni, Amir (Salma dans celle des
# comparaisons).
thumbnail:
  layout: close-up
  headline: { ar: "٣ أفكار غلط", en: "3 wrong ideas" }
  kicker: { ar: "عن التوكل", en: "about trusting God" }
  character: { id: amir, pose: standing, mood: worried }
  background: plain
  validated_by: mssnoussi92
reels:
  - id: tawakkul-01
    title: { ar: "زي الطير", en: "Like the birds" }
    validated_by: mssnoussi92
    publish:
      title: { en: "Awake at night… thinking about tomorrow?", ar: "صاحي بالليل… بتفكر في بكرة؟" }
      description:
        en: "Work… money… and everything on your shoulders? The answer isn't to stop being afraid… it's to trust God. Like the birds: they go out hungry in the morning… and come back full."
        ar: "الشغل… الفلوس… وكل حاجة فوق دماغك؟ الحل مش إنك متخافش… الحل إنك تتوكل. زي الطير: بتطلع الصبح جعانة… وترجع شبعانة."
      validated_by: mssnoussi92
  - id: tawakkul-02
    title: { ar: "اعقلها وتوكل", en: "Tie it and trust" }
    validated_by: mssnoussi92
    publish:
      title: { en: "“Leave it to God”… and just sit there waiting?", ar: "«سيبها على الله»… وقاعد مستني؟" }
      description:
        en: "The first wrong idea about trusting God: that it means doing nothing. Do your part… and leave the outcome to God."
        ar: "أول فكرة غلط عن التوكل: إنه يعني متعملش حاجة. اعمل اللي عليك… وسيب النتيجة على ربنا."
      validated_by: mssnoussi92
  - id: tawakkul-03
    title: { ar: "حتى موسى خاف", en: "Even Moses felt fear" }
    validated_by: mssnoussi92
    publish:
      title: { en: "“I'm afraid… so my faith must be weak”?", ar: "«أنا خايف… يبقى إيماني ضعيف»؟" }
      description:
        en: "The second wrong idea: that fear means your faith is weak. Fear isn't weak faith… take your fear to God."
        ar: "تاني فكرة غلط: إن الخوف معناه إن إيمانك ضعيف. الخوف مش ضعف إيمان… خد خوفك وروح بيه لربنا."
      validated_by: mssnoussi92
  - id: tawakkul-04
    title: { ar: "مش لوحدك", en: "Not on your own" }
    validated_by: mssnoussi92
    publish:
      title: { en: "“If I don't carry it… no one will”?", ar: "«لو أنا مشلتهاش… محدش هيشيلها»؟" }
      description:
        en: "The third wrong idea: that you have to carry everything on your own. You're not alone… God is enough."
        ar: "تالت فكرة غلط: إنك لازم تشيل كل حاجة لوحدك. مش لوحدك… ربنا كفاية."
      validated_by: mssnoussi92
  - id: tawakkul-05
    title: { ar: "الحي اللي مبيموتش", en: "The Ever-Living" }
    validated_by: mssnoussi92
    publish:
      title: { en: "Afraid the people you lean on… will leave?", ar: "خايف اللي بتتسند عليهم… يمشوا؟" }
      description:
        en: "Lean on the One who never dies. Trusting God isn't sitting idle… fear isn't weak faith… you don't have to carry it alone… and God is enough. So sleep in peace… the One who feeds the birds won't forget you."
        ar: "اتسند على اللي مبيموتش. التوكل مش قعدة… والخوف مش ضعف إيمان… ومش لازم تشيلها لوحدك… وربنا كفاية. فنام مطمن… اللي بيرزق الطير مش هينساك."
      validated_by: mssnoussi92
scenes:
  # ---- tawakkul-01 : accroche et promesse -------------------------------------------------------
  # Miroir : l'inquiétude du soir pour le lendemain (scène type, à la deuxième personne).
  - id: hook-1
    role: hook
    reel: tawakkul-01
    audio: tts
    narration:
      ar: "صاحي بالليل… بتفكر في بكرة؟"
      en: "Awake at night… thinking about tomorrow?"
    visual:
      template: scene
      background: waiting-room
      characters:
        - { id: amir, pose: sitting, mood: worried, talking: false }
  # Contraste : tout ce qu'on porte.
  - id: hook-2
    role: hook
    reel: tawakkul-01
    audio: tts
    narration:
      ar: "الشغل… الفلوس… وكل حاجة فوق دماغك؟"
      en: "Work… money… and everything on your shoulders?"
    visual:
      template: scene
      background: street
      characters:
        - { id: salma, pose: standing, mood: worried, talking: false }
  # Nommer (ligne de l'IA, à vérifier en premier).
  - id: hook-3
    role: hook
    reel: tawakkul-01
    audio: tts
    narration:
      ar: "الحل مش إنك متخافش… الحل إنك تتوكل."
      en: "The answer isn't to stop being afraid… it's to trust God."
    visual:
      template: title-card
  # Ancre : les oiseaux qui partent le matin.
  - id: anchor
    role: evidence
    reel: tawakkul-01
    source: hadith.tirmidhi.2344
    audio: tts
    mentions: ["النبي ﷺ"]
    narration:
      ar: "والنبي صلى الله عليه وسلم قال:"
      en: "And the Prophet ﷺ said:"
    visual:
      template: source-card
  # Question en un mot, reprise du hadith (« الطير »), puis la réponse (reformulation de « تغدو خماصا وتروح بطانا »).
  - id: why
    role: evidence
    reel: tawakkul-01
    audio: tts
    narration:
      ar: "زي الطير؟"
      en: "Like the birds?"
    visual:
      template: title-card
  - id: because
    role: evidence
    reel: tawakkul-01
    audio: tts
    narration:
      ar: "بتطلع الصبح جعانة… وترجع شبعانة."
      en: "They go out hungry in the morning… and come back full."
    visual:
      template: title-card
  - id: outro
    role: outro
    reel: tawakkul-01
    audio: tts
    narration:
      ar: "بس فيه تلات أفكار غلط عن التوكل… يمكن تكون مصدق واحدة منهم. تابعنا عشان تعرف أولها."
      en: "But there are three wrong ideas about trusting God… you might believe one of them. Follow us to find out the first one."
    reel_only_end: { ar: "تابعنا عشان تعرف أولها.", en: "Follow us to find out the first one." }
    visual:
      template: title-card

  # ---- tawakkul-02 : idée reçue 1, « le tawakkul, c'est ne rien faire » ---------------------------
  - id: sit-hook
    role: hook
    reel: tawakkul-02
    audio: tts
    narration:
      ar: "«سيبها على الله»… وقاعد مستني؟"
      en: "“Leave it to God”… and just sit there waiting?"
    say_ar: "سيبها على الله… وقاعد مستني؟"
    visual:
      template: scene
      background: waiting-room
      characters:
        - { id: amir, pose: sitting, mood: calm, talking: false }
  - id: sit-wrong
    role: misconception
    reel: tawakkul-02
    audio: tts
    narration:
      ar: "أول فكرة غلط عن التوكل…"
      en: "The first wrong idea about trusting God…"
    visual:
      template: scene
      background: plain
      characters:
        - { id: narrator, pose: open-hands, mood: calm, talking: true }
  - id: sit-idea
    role: misconception
    reel: tawakkul-02
    audio: tts
    narration:
      ar: "إن التوكل… إنك متعملش حاجة."
      en: "That trusting God… means doing nothing."
    visual:
      template: title-card
  # La question de l'homme (hors des guillemets du hadith) dite par la narration ; le lecteur répond
  # « قال اعقلها وتوكل ».
  - id: sit-hadith
    role: evidence
    reel: tawakkul-02
    source: hadith.tirmidhi.2517
    audio: tts
    mentions: ["النبي ﷺ"]
    narration:
      ar: "واحد سأل النبي صلى الله عليه وسلم: أربط الناقة وأتوكل… ولا أسيبها وأتوكل؟"
      en: "A man asked the Prophet ﷺ: should I tie my camel and trust God… or leave it loose and trust God?"
    visual:
      template: source-card
  - id: sit-verse-intro
    role: evidence
    reel: tawakkul-02
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: sit-verse
    role: evidence
    reel: tawakkul-02
    source: quran.67.15
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  # Ligne de l'IA, tirée de « اعقلها وتوكل » et de « فامشوا في مناكبها ».
  - id: sit-takeaway
    role: evidence
    reel: tawakkul-02
    audio: tts
    narration:
      ar: "اعمل اللي عليك… وسيب النتيجة على ربنا."
      en: "Do your part… and leave the outcome to God."
    visual:
      template: title-card
  - id: sit-outro
    role: outro
    reel: tawakkul-02
    audio: tts
    narration:
      ar: "طب ولو أنا خايف… يبقى مش متوكل؟ تابعنا عشان تعرف."
      en: "But if I'm afraid… does that mean I don't trust God? Follow us to find out."
    reel_only_end: { ar: "تابعنا عشان تعرف.", en: "Follow us to find out." }
    visual:
      template: title-card

  # ---- tawakkul-03 : idée reçue 2, « avoir peur, c'est avoir une foi faible » ---------------------
  - id: fear-hook
    role: hook
    reel: tawakkul-03
    audio: tts
    narration:
      ar: "«أنا خايف… يبقى إيماني ضعيف»؟"
      en: "“I'm afraid… so my faith must be weak”?"
    say_ar: "أنا خايف… يبقى إيماني ضعيف؟"
    visual:
      template: scene
      background: waiting-room
      characters:
        - { id: salma, pose: sitting, mood: worried, talking: false }
  - id: fear-wrong
    role: misconception
    reel: tawakkul-03
    audio: tts
    narration:
      ar: "تاني فكرة غلط…"
      en: "The second wrong idea…"
    visual:
      template: scene
      background: plain
      characters:
        - { id: narrator, pose: open-hands, mood: calm, talking: true }
  - id: fear-idea
    role: misconception
    reel: tawakkul-03
    audio: tts
    narration:
      ar: "إن الخوف… معناه إن إيمانك ضعيف."
      en: "That fear… means your faith is weak."
    visual:
      template: title-card
  # Carte de nom (un prophète n'est jamais dessiné).
  - id: fear-musa
    role: evidence
    reel: tawakkul-03
    audio: tts
    mentions: ["موسى عليه السلام"]
    narration:
      ar: "سيدنا موسى عليه السلام… قدام السحرة."
      en: "Moses, peace be upon him… facing the sorcerers."
    visual:
      template: name-card
  - id: fear-verse-intro
    role: evidence
    reel: tawakkul-03
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: fear-verse-1
    role: evidence
    reel: tawakkul-03
    source: quran.20.67
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  - id: fear-verse-2
    role: evidence
    reel: tawakkul-03
    source: quran.20.68
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  - id: fear-hadith
    role: evidence
    reel: tawakkul-03
    source: hadith.bukhari.6369
    audio: tts
    mentions: ["النبي ﷺ"]
    narration:
      ar: "والنبي صلى الله عليه وسلم كان بيقول:"
      en: "And the Prophet ﷺ used to say:"
    visual:
      template: source-card
  # Ligne de l'IA.
  - id: fear-takeaway
    role: evidence
    reel: tawakkul-03
    audio: tts
    narration:
      ar: "الخوف مش ضعف إيمان… خد خوفك وروح بيه لربنا."
      en: "Fear isn't weak faith… take your fear to God."
    visual:
      template: title-card
  - id: fear-outro
    role: outro
    reel: tawakkul-03
    audio: tts
    narration:
      ar: "طب ولو حاسس إن كل حاجة على كتافي؟ تابعنا عشان تعرف."
      en: "But what if I feel everything is on my shoulders? Follow us to find out."
    reel_only_end: { ar: "تابعنا عشان تعرف.", en: "Follow us to find out." }
    visual:
      template: title-card

  # ---- tawakkul-04 : idée reçue 3, « je dois tout porter seul » -----------------------------------
  - id: alone-hook
    role: hook
    reel: tawakkul-04
    audio: tts
    narration:
      ar: "«لو أنا مشلتهاش… محدش هيشيلها»؟"
      en: "“If I don't carry it… no one will”?"
    say_ar: "لو أنا مشلتهاش… محدش هيشيلها؟"
    visual:
      template: scene
      background: street
      characters:
        - { id: amir, pose: standing, mood: worried, talking: false }
  - id: alone-wrong
    role: misconception
    reel: tawakkul-04
    audio: tts
    narration:
      ar: "تالت فكرة غلط…"
      en: "The third wrong idea…"
    visual:
      template: scene
      background: plain
      characters:
        - { id: narrator, pose: open-hands, mood: calm, talking: true }
  - id: alone-idea
    role: misconception
    reel: tawakkul-04
    audio: tts
    narration:
      ar: "إنك لازم تشيل كل حاجة… لوحدك."
      en: "That you have to carry everything… on your own."
    visual:
      template: title-card
  - id: alone-verse-intro
    role: evidence
    reel: tawakkul-04
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: alone-verse
    role: evidence
    reel: tawakkul-04
    source: quran.33.3
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  - id: alone-hadith
    role: evidence
    reel: tawakkul-04
    source: hadith.tirmidhi.3426
    audio: tts
    mentions: ["النبي ﷺ"]
    narration:
      ar: "والنبي صلى الله عليه وسلم قال:"
      en: "And the Prophet ﷺ said:"
    visual:
      template: source-card
  # Ligne de l'IA, tirée de « وكفى بالله وكيلا » et de « كفيت ».
  - id: alone-takeaway
    role: evidence
    reel: tawakkul-04
    audio: tts
    narration:
      ar: "مش لوحدك… ربنا كفاية."
      en: "You're not alone… God is enough."
    visual:
      template: title-card
  - id: alone-outro
    role: outro
    reel: tawakkul-04
    audio: tts
    narration:
      ar: "وفي الآخر… آية تطمن قلبك. دي الأخيرة."
      en: "And finally… a verse to put your heart at ease. That's the last one."
    visual:
      template: title-card

  # ---- tawakkul-05 : conclusion, le Vivant qui ne meurt pas ---------------------------------------
  - id: end-hook
    role: hook
    reel: tawakkul-05
    audio: tts
    narration:
      ar: "خايف اللي بتتسند عليهم… يمشوا؟"
      en: "Afraid the people you lean on… will leave?"
    visual:
      template: scene
      background: street
      characters:
        - { id: salma, pose: standing, mood: worried, talking: false }
  - id: end-verse-intro
    role: evidence
    reel: tawakkul-05
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: end-verse
    role: evidence
    reel: tawakkul-05
    source: quran.25.58
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  # Reformule le verset (« وتوكل على الحي الذي لا يموت »).
  - id: end-lean
    role: conclusion
    reel: tawakkul-05
    audio: tts
    narration:
      ar: "اتسند على اللي مبيموتش."
      en: "Lean on the One who never dies."
    visual:
      template: title-card
