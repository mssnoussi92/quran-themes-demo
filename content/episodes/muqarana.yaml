  # Ligne de l'IA, tirée de « أجدر ألا تزدروا نعمة الله عليكم ».
  - id: life-takeaway
    role: evidence
    reel: muqarana-03
    audio: tts
    narration:
      ar: "طول ما عينك على غيرك… مش هتشوف نعمة ربنا عليك."
      en: "As long as your eyes are on others… you won't see God's blessings on you."
