    reel: muqarana-02
    source: quran.89.17
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  - id: rich-hadith
    role: evidence
    reel: muqarana-02
    source: hadith.muslim.2564c
    audio: tts
    mentions: ["النبي ﷺ"]
    narration:
      ar: "والنبي صلى الله عليه وسلم قال:"
      en: "And the Prophet ﷺ said:"
    visual:
      template: source-card
  # Ligne de l'IA, tirée de « ربي أكرمن… ربي أهانن… كلا ».
  - id: rich-takeaway
    role: evidence
    reel: muqarana-02
    audio: tts
    narration:
      ar: "العطا مش دليل حب… والمنع مش دليل إهانة."
      en: "Giving isn't proof of love… and holding back isn't proof of disgrace."
