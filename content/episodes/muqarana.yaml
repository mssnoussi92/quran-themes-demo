    narration:
      ar: "طب ولو حياتهم فعلاً أحسن من حياتي؟ تابعنا عشان تعرف."
      en: "But what if their life really is better than mine? Follow us to find out."
    reel_only_end: { ar: "تابعنا عشان تعرف.", en: "Follow us to find out." }
    visual:
      template: title-card

  # ---- muqarana-03 : idée reçue 2, « leur vie est meilleure que la mienne » ---------------------
  - id: life-hook
    role: hook
    reel: muqarana-03
    audio: tts
    narration:
      ar: "«ليه حياتهم أحلى من حياتي؟»"
      en: "“Why is their life better than mine?”"
    say_ar: "ليه حياتهم أحلى من حياتي؟"
    visual:
      template: scene
      background: street
