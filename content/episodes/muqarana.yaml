    role: outro
    reel: muqarana-04
    audio: tts
    narration:
      ar: "وفي الآخر… وعد ربنا للشاكرين. دي الأخيرة."
      en: "And finally… God's promise to the grateful. That's the last one."
    visual:
      template: title-card

  # ---- muqarana-05 : conclusion, la gratitude ---------------------------------------------------
  - id: end-hook
    role: hook
    reel: muqarana-05
    audio: tts
    narration:
      ar: "حاسس إن اللي معاك… قليل؟"
      en: "Feel like what you have… isn't enough?"
    visual:
      template: scene
      background: waiting-room
      characters:
        - { id: salma, pose: sitting, mood: worried, talking: false }
  - id: end-verse-intro
    role: evidence
    reel: muqarana-05
    audio: tts
    narration:
