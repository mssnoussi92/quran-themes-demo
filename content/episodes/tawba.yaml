  # Retour à l'accroche (« الباب لسه مفتوح »).
  - id: change-outro
    role: conclusion
    reel: tawba-05
    audio: tts
    narration:
      ar: "فارجع… الباب لسه مفتوح."
      en: "So come back… the door is still open."
    visual:
      template: title-card
