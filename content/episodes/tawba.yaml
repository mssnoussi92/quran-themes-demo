  - id: change-recap
    role: conclusion
    reel: tawba-05
    audio: tts
    narration:
      ar: "مفيش ذنب أكبر من رحمته… التوبة مش مرة واحدة… ومش لبعدين… وبتبدل السيئات حسنات."
      en: "No sin is bigger than His mercy… repentance isn't a one-time thing… nor for later… and it turns bad deeds into good."
