    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  # Reformule le verset (« يبدل الله سيئاتهم حسنات »).
  - id: change-swap
    role: conclusion
    reel: tawba-05
    audio: tts
    narration:
      ar: "مش بس بيغفرها… بيبدلها حسنات."
      en: "He doesn't just forgive them… He turns them into good deeds."
