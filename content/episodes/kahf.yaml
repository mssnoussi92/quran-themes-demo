    role: conclusion
    reel: kahf-05
    audio: tts
    narration:
      ar: "وقفوا لوحدهم… ربنا ثبّتهم… ورحمهم… وصحّاهم آية للناس."
      en: "They stood alone… God steadied them… showed them mercy… and woke them as a sign for the people."
