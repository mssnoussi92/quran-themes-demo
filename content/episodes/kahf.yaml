    visual:
      template: title-card
  - id: end-life-1
    role: example
    reel: kahf-05
    audio: tts
    narration:
      ar: "زي ناس بتتخانق على تفاصيل القصة… وتنسى القصة نفسها."
      en: "Like people who fight over the details of a story… and forget the story itself."
    visual:
