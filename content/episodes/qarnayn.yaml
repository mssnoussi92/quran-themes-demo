    role: event
    reel: qarnayn-03
    audio: tts
    narration:
      ar: "وبعدها مشي… لحد ما وصل بين جبلين… لقى قوم… يدوب بيفهموا الكلام."
      en: "Then he went on… until he reached a pass between two mountains… and found a people… who could hardly understand speech."
    say_ar: "وبعدها مشي… لحد ما وصل بين جبلين… لقى قَوْم… يدوب بيفهموا الكلام."
    visual:
      template: scene
      background: mountain-pass
  - id: dam-intro
    role: evidence
    reel: qarnayn-03
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: dam-verse-1
    role: evidence
    reel: qarnayn-03
    source: quran.18.92
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  - id: dam-verse-2
    role: evidence
    reel: qarnayn-03
    source: quran.18.93
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  # 18:94-95 racontés, puis récités.
  - id: dam-2
    role: event
    reel: qarnayn-03
    audio: tts
    narration:
      ar: "قالوا له: يأجوج ومأجوج بيفسدوا في الأرض… ندفعلك فلوس… وتعمل بيننا وبينهم سد؟"
      en: "They said: Gog and Magog spread corruption on earth… shall we pay you… to build a barrier between us and them?"
    visual:
      template: title-card
  - id: dam-3
    role: event
    reel: qarnayn-03
    audio: tts
    narration:
      ar: "قال: اللي ربنا إداهولي أحسن. ساعدوني بقوتكم… وأنا أعمل بينكم وبينهم ردم."
      en: "He said: what my Lord has given me is better. Help me with your strength… and I will build a wall between you and them."
    say_ar: "قال: اللي ربنا إداهولي أحسن. ساعدوني بقُوِّتْكُم… وأنا أعمل بينكم وبينهم ردم."
    visual:
      template: title-card
  - id: dam-intro-2
    role: evidence
    reel: qarnayn-03
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: dam-verse-3
    role: evidence
    reel: qarnayn-03
    source: quran.18.94
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  - id: dam-verse-4
    role: evidence
    reel: qarnayn-03
    source: quran.18.95
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  # Lignes de l'IA, d'après 18:95.
  - id: dam-lesson-1
    role: lesson
    reel: qarnayn-03
    audio: tts
    narration:
      ar: "ما خدش فلوس من ناس محتاجة… عشان اللي ربنا إداهوله أحسن."
      en: "He took no money from people in need… because what God had given him was better."
    visual:
      template: title-card
  - id: dam-lesson-2
    role: lesson
    reel: qarnayn-03
    audio: tts
    narration:
      ar: "وما عملش كل حاجة لوحده: قالهم ساعدوني."
      en: "And he didn't do everything alone: he told them, help me."
    visual:
      template: title-card
  # Exemple de vie (scène type) : aider sans profiter.
  - id: dam-life-1
    role: example
    reel: qarnayn-03
    audio: tts
    narration:
      ar: "زي لما حد محتاج يطلب منك مساعدة… وإنت تقدر تستغله."
      en: "Like when someone in need asks you for help… and you could take advantage of him."
    visual:
      template: scene
      background: waiting-room
      characters:
        - { id: amir, pose: sitting, mood: worried, talking: false }
  - id: dam-life-2
    role: example
    reel: qarnayn-03
    audio: tts
    narration:
      ar: "أو تساعده… وتعلّمه يقف على رجله."
      en: "Or you can help him… and teach him to stand on his own feet."
    visual:
      template: scene
      background: street
      characters:
        - { id: amir, pose: standing, mood: smiling, talking: false }
  - id: dam-outro
    role: outro
    reel: qarnayn-03
    audio: tts
    narration:
      ar: "وبدأ يبني… تابعنا عشان تعرف إزاي."
      en: "And he began to build… Follow us to find out how."
    reel_only_end: { ar: "تابعنا عشان تعرف إزاي.", en: "Follow us to find out how." }
    visual:
      template: title-card

  # ---- qarnayn-04 : le fer et le cuivre, « une miséricorde de mon Seigneur » (18:96-98) --------------------
  # 18:96-97 racontés, puis récités.
  - id: build-1
    role: event
    reel: qarnayn-04
    audio: tts
    narration:
      ar: "قال: هاتوا قطع الحديد… لحد ما ساوى بين الجبلين."
      en: "He said: bring me blocks of iron… until he had levelled them between the two mountains."
    say_ar: "قال: هاتوا قِطَع الحديد… لحد ما ساوى بين الجبلين."
    visual:
      template: scene
      background: mountain-pass
  - id: build-2
    role: event
    reel: qarnayn-04
    audio: tts
    narration:
      ar: "وقال: انفخوا… لحد ما الحديد بقى نار… وقال: هاتوا نحاس دايب أصبه عليه."
      en: "He said: blow… until the iron was like fire… then he said: bring me molten copper to pour over it."
    visual:
      template: scene
      background: iron-dam
  - id: build-3
    role: event
    reel: qarnayn-04
    audio: tts
    narration:
      ar: "ويأجوج ومأجوج… ما قدروا يطلعوا عليه… ولا يخرموه."
      en: "And Gog and Magog… could neither climb over it… nor break through it."
    visual:
      template: scene
      background: iron-dam
  - id: build-intro
    role: evidence
    reel: qarnayn-04
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: build-verse-1
    role: evidence
    reel: qarnayn-04
    source: quran.18.96
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  - id: build-verse-2
    role: evidence
    reel: qarnayn-04
    source: quran.18.97
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  # 18:98 raconté, puis récité.
  - id: humble-1
    role: event
    reel: qarnayn-04
    audio: tts
    narration:
      ar: "وبعد كل ده… قال: ده رحمة من ربي. ولما ييجي وعد ربي… هيخليه تراب. ووعد ربي حق."
      en: "After all that… he said: this is a mercy from my Lord. When my Lord's promise comes… He will level it to dust. And my Lord's promise is true."
    visual:
      template: title-card
  - id: humble-intro
    role: evidence
    reel: qarnayn-04
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: humble-verse
    role: evidence
    reel: qarnayn-04
    source: quran.18.98
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  # Ligne de l'IA, d'après 18:98.
  - id: humble-lesson
    role: lesson
    reel: qarnayn-04
    audio: tts
    narration:
      ar: "ما قالش: أنا اللي عملت… قال: رحمة من ربي."
      en: "He didn't say: I did it… he said: a mercy from my Lord."
    visual:
      template: title-card
  # Exemple de vie (scène type) : le succès rendu à Dieu.
  - id: humble-life-1
    role: example
    reel: qarnayn-04
    audio: tts
    narration:
      ar: "زي لما تنجح… والناس تسقف لك."
      en: "Like when you succeed… and people applaud you."
    visual:
      template: scene
      background: street
      characters:
        - { id: salma, pose: standing, mood: smiling, talking: false }
  - id: humble-life-2
    role: example
    reel: qarnayn-04
    audio: tts
    narration:
      ar: "وقلبك بيقول: الحمد لله… ده من ربنا."
      en: "And your heart says: praise be to God… this is from Him."
    visual:
      template: scene
      background: plain
      characters:
        - { id: salma, pose: standing, mood: calm, talking: false }
  - id: humble-outro
    role: outro
    reel: qarnayn-04
    audio: tts
    narration:
      ar: "وفي الآخر… كلمة واحدة ماسكة السد. دي الأخيرة."
      en: "And finally… one word holds the barrier. That's the last one."
    reel_only_end: { ar: "دي الأخيرة.", en: "That's the last one." }
    visual:
      template: title-card

  # ---- qarnayn-05 : « إن شاء الله » (Tirmidhi 3153, 18:23-24), la conclusion ---------------------------------
  # Tirmidhi 3153 raconté, puis lu par Yusuf ibn Nuh Ahmad.
  - id: end-1
    role: conclusion
    reel: qarnayn-05
    audio: tts
    mentions: ["النبي ﷺ"]
    narration:
      ar: "النبي صلى الله عليه وسلم حكى عن السد ده… إن يأجوج ومأجوج بيحفروا فيه كل يوم."
      en: "The Prophet ﷺ told us about this barrier… Gog and Magog dig into it every day."
    visual:
      template: scene
      background: iron-dam
  - id: end-hadith
    role: conclusion
    reel: qarnayn-05
    source: hadith.tirmidhi.3153
    audio: tts
    mentions: ["النبي ﷺ"]
    narration:
      ar: "والنبي صلى الله عليه وسلم قال:"
      en: "And the Prophet ﷺ said:"
    visual:
      template: source-card
  - id: end-2
    role: conclusion
    reel: qarnayn-05
    audio: tts
    narration:
      ar: "ولما قالوا: إن شاء الله… رجعوا لقوه زي ما سابوه… وخرموه."
      en: "And when they said: if God wills… they came back to find it as they had left it… and broke through."
    visual:
      template: title-card
  # Ligne de l'IA.
  - id: end-3
    role: conclusion
    reel: qarnayn-05
    audio: tts
    narration:
      ar: "كلمة واحدة… وربنا علّمهالنا في سورة الكهف نفسها."
      en: "One word… and God taught it to us in Surat al-Kahf itself."
    visual:
      template: title-card
  - id: end-intro
    role: conclusion
    reel: qarnayn-05
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: end-verse-1
    role: conclusion
    reel: qarnayn-05
    source: quran.18.23
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  - id: end-verse-2
    role: conclusion
    reel: qarnayn-05
    source: quran.18.24
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  # Ligne de l'IA : le récapitulatif.
  - id: end-recap
    role: conclusion
    reel: qarnayn-05
    audio: tts
    mentions: ["ذو القرنين"]
    narration:
      ar: "ذو القرنين علّمنا: النعمة من ربنا… والقوة أمانة… والمساعدة من غير استغلال… والنجاح رحمة."
      en: "Dhul-Qarnayn taught us: blessings come from God… power is a trust… help without exploiting… and success is a mercy."
    say_ar: "ذو القَرْنَيْن علّمنا: النعمة من ربنا… والقُوَّة أمانة… والمساعدة من غير استغلال… والنجاح رحمة."
    visual:
      template: title-card
  - id: end-last
    role: conclusion
    reel: qarnayn-05
    audio: tts
    narration:
      ar: "فالمرة الجاية لما ربنا يفتحها عليك… قول: ده رحمة من ربي."
      en: "So next time God opens a door for you… say: this is a mercy from my Lord."
    visual:
      template: scene
      background: street
      characters:
        - { id: amir, pose: standing, mood: smiling, talking: false }
