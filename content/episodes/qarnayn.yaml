# Épisode Dhul-Qarnayn (ذو القرنين) : ce qu'on fait de la force et du succès que Dieu donne, d'après Al-Kahf
# 18:83-98, 18:23-24 et Tirmidhi 3153. Demande du propriétaire le 2026-11-08, après Moussa et al-Khadir, avec les
# mêmes règles d'épisode-histoire :
# - après chaque événement raconté, son verset récité : la narration le dit d'abord en égyptien, au plus près des
#   mots du verset, puis « قال ربنا سبحانه وتعالى: » et le verset (jamais le texte coranique par la voix de
#   synthèse) ;
# - un exemple de vie en scène type après chaque leçon ; une promesse à la fin de l'accroche ;
# - Dhul-Qarnayn, le Prophète ﷺ et les peuples rencontrés ne sont jamais dessinés (carte de nom, fonds sans
#   personne). Le Coran ne donne ni son nom ni son époque : on n'en dit rien (pas d'Alexandre, pas de récit
#   d'Israël). Récitateur : Tawfiq As-Sayegh (content/policy.yaml).
# L'épisode entier dit les reels dans l'ordre. Validés par le propriétaire le 2026-11-08 (validated_by) : sources,
# scripts et traduction, textes de publication, miniature, fonds. À valider à l'écoute des brouillons : la lecture
# de Tirmidhi 3153 et les prises de voix. Lignes de l'IA (pas une citation ni une reformulation d'une source) :
# marquées « Ligne de l'IA ».
episode: qarnayn
title: { ar: "ذو القرنين", en: "Dhul-Qarnayn" }
format: story-linear   # docs/formats.md (skill choose-format)
style: flat   # docs/styles.md (made before the styles, validated in this one)
narration_language: ar-egy   # VoiceTut (égyptien), comme les autres épisodes
# Textes de publication : faits des répliques du script, validés par le propriétaire le 2026-11-08. Le reste : video/scripts/publish.ts.
publish:
  title: { en: "Dhul-Qarnayn: what to do with the power God gives you", ar: "ذو القرنين… والقوة اللي ربنا إداهالك" }
  description:
    en: "Has God opened doors for you? So many people change the moment they get power. In Surat al-Kahf, Dhul-Qarnayn was given power over the earth: he was just with it, refused to exploit people in need, worked with them, and said of all he built: this is a mercy from my Lord."
    ar: "ربنا فتحها عليك؟ ناس كتير أول ما يمسكوا القوة بيتغيروا. في سورة الكهف، ذو القرنين ربنا مكّن له في الأرض: عدل بالقوة، وما استغلش الناس المحتاجة، واشتغل معاهم، وقال عن كل اللي بناه: ده رحمة من ربي."
  hashtags: ["#DhulQarnayn", "#ذو_القرنين", "#SurahAlKahf"]
  validated_by: mssnoussi92
# Miniature YouTube (Thumbnail169), validée le 2026-11-08 : gros plan, fond uni, Amir (Salma dans celle de Moussa
# et al-Khadir).
thumbnail:
  layout: poster
  headline: { ar: "ذو القرنين", en: "Dhul-Qarnayn" }
  kicker: { ar: "والقوة اللي في إيدك", en: "and the power in your hands" }
  color: brick
  character: { id: amir, pose: standing, mood: smiling }
  background: plain
reels:
  - id: qarnayn-01
    title: { ar: "ذو القرنين", en: "Dhul-Qarnayn" }
    validated_by: mssnoussi92
    publish:
      title: { en: "God opened doors for you… now what?", ar: "ربنا فتحها عليك… وبعدين؟" }
      description:
        en: "So many people change the moment they get power. In Surat al-Kahf, God established a man on the earth and gave him a way to everything… and he followed the way. The blessing is from God, but you have to walk with it."
        ar: "ناس كتير أول ما يمسكوا القوة بيتغيروا. في سورة الكهف، ربنا مكّن لراجل في الأرض وإداه من كل حاجة سبب… وهو مشي ورا السبب. النعمة من ربنا… بس لازم إنت تمشي فيها."
      validated_by: mssnoussi92
  - id: qarnayn-02
    title: { ar: "العدل", en: "Justice" }
    validated_by: mssnoussi92
    publish:
      title: { en: "Power is a trust… not a license", ar: "القوة أمانة… مش رخصة" }
      description:
        en: "At the setting of the sun, Dhul-Qarnayn was given the choice: punish them, or treat them with kindness. The wrongdoer is held to account, the good are honoured. And God knew everything in his hands, as He sees what you do with what is in yours."
        ar: "عند مغرب الشمس، ذو القرنين اتخيّر: يعاقبهم… ولا يعاملهم بالحسنى. الظالم يتحاسب… والكويس يتكرّم. وربنا كان عارف كل حاجة في إيده… زي ما هو شايف بتعمل إيه باللي في إيدك."
      validated_by: mssnoussi92
  - id: qarnayn-03
    title: { ar: "السد", en: "The barrier" }
    validated_by: mssnoussi92
    publish:
      title: { en: "They offered him money… he said no", ar: "عرضوا عليه فلوس… وقال لأ" }
      description:
        en: "Between two mountains, a people afraid of Gog and Magog offered Dhul-Qarnayn money for a barrier. He said: what my Lord has given me is better, help me with your strength. No money from people in need, and he didn't do it all alone."
        ar: "بين جبلين، قوم خايفين من يأجوج ومأجوج عرضوا على ذي القرنين فلوس عشان يعمل سد. قال: اللي ربنا إداهولي أحسن… ساعدوني بقوتكم. ما خدش فلوس من ناس محتاجة… وما عملش كل حاجة لوحده."
      validated_by: mssnoussi92
  - id: qarnayn-04
    title: { ar: "رحمة من ربي", en: "A mercy from my Lord" }
    validated_by: mssnoussi92
    publish:
      title: { en: "He built the barrier… and said: a mercy from my Lord", ar: "بنى السد… وقال: رحمة من ربي" }
      description:
        en: "Iron, fire and molten copper: a barrier no one could climb or break through. And after all that, he didn't say: I did it. He said: this is a mercy from my Lord."
        ar: "حديد ونار ونحاس دايب: سد محدش قدر يطلعه ولا يخرمه. وبعد كل ده… ما قالش: أنا اللي عملت. قال: ده رحمة من ربي."
      validated_by: mssnoussi92
  - id: qarnayn-05
    title: { ar: "إن شاء الله", en: "If God wills" }
    validated_by: mssnoussi92
    publish:
      title: { en: "The one word that holds the barrier", ar: "الكلمة اللي ماسكة السد" }
      description:
        en: "The Prophet ﷺ told us that Gog and Magog dig into the barrier every day, until the day they say: if God wills. A word God taught us in Surat al-Kahf itself. So next time God opens a door for you… say: this is a mercy from my Lord."
        ar: "النبي ﷺ حكى إن يأجوج ومأجوج بيحفروا في السد كل يوم… لحد اليوم اللي يقولوا فيه: إن شاء الله. كلمة ربنا علّمهالنا في سورة الكهف نفسها. فالمرة الجاية لما ربنا يفتحها عليك… قول: ده رحمة من ربي."
      validated_by: mssnoussi92
scenes:
  # ---- qarnayn-01 : accroche, qui il est, la force donnée (18:83-85) ----------------------------------------
  # Miroir : le succès, la force qu'on a reçue (scène type, à la deuxième personne).
  - id: hook-1
    role: hook
    reel: qarnayn-01
    audio: tts
    narration:
      ar: "ربنا فتحها عليك؟ نجحت… اترقيت… بقى في إيدك قوة؟"
      en: "Has God opened doors for you? You succeeded… got promoted… have power in your hands?"
    say_ar: "ربنا فتحها عليك؟ نجحت… اترقيت… بقى في إيدك قُوَّة؟"
    visual:
      template: scene
      background: street
      characters:
        - { id: amir, pose: standing, mood: smiling, talking: false }
  # Contraste : ce que la force fait aux gens.
  - id: hook-2
    role: hook
    reel: qarnayn-01
    audio: tts
    narration:
      ar: "ناس كتير… أول ما يمسكوا القوة… بيتغيروا."
      en: "So many people… the moment they get power… change."
    say_ar: "ناس كتير… أول ما يمسكوا القُوَّة… بيتغيروا."
    visual:
      template: scene
      background: waiting-room
      characters:
        - { id: salma, pose: sitting, mood: worried, talking: false }
  - id: hook-3
    role: hook
    reel: qarnayn-01
    audio: tts
    narration:
      ar: "في سورة الكهف… راجل ربنا إداه قوة… ومشي بيها لآخر الأرض."
      en: "In Surat al-Kahf… a man God gave power to… travelled with it to the ends of the earth."
    say_ar: "في سورة الكهف… راجل ربنا إداه قُوَّة… ومشي بيها لآخر الأرض."
    visual:
      template: title-card
  # Promesse : ce que l'histoire change pour toi.
  - id: hook-4
    role: promise
    reel: qarnayn-01
    audio: tts
    narration:
      ar: "قصة… هتعلمك تعمل إيه بكل نعمة في إيدك."
      en: "A story… that will teach you what to do with every blessing in your hands."
    visual:
      template: title-card
  # 18:83 raconté, puis récité.
  - id: who-1
    role: event
    reel: qarnayn-01
    audio: tts
    mentions: ["ذو القرنين", "النبي ﷺ"]
    narration:
      ar: "الناس سألوا النبي صلى الله عليه وسلم عن ذي القرنين… وربنا جاوبهم."
      en: "People asked the Prophet ﷺ about Dhul-Qarnayn… and God answered them."
    say_ar: "الناس سألوا النبي صلى الله عليه وسلم عن ذِي القَرْنَيْن… وربنا جاوبهم."
    visual:
      template: name-card
  - id: who-intro
    role: evidence
    reel: qarnayn-01
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: who-verse
    role: evidence
    reel: qarnayn-01
    source: quran.18.83
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  # Ligne de l'IA : le Coran ne dit ni son nom ni son époque.
  - id: who-2
    role: evidence
    reel: qarnayn-01
    audio: tts
    narration:
      ar: "مين هو؟ القرآن ما قالش اسمه… ولا زمنه. قال اللي يهمنا: عمل إيه."
      en: "Who was he? The Qur'an doesn't give his name… or his time. It tells us what matters: what he did."
    visual:
