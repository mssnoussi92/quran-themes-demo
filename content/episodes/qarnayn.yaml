  - id: west-life-2
    role: example
    reel: qarnayn-02
    audio: tts
    narration:
      ar: "اللي بيغلط يتحاسب… واللي بيتعب تقوله: شكرًا."
      en: "Whoever does wrong is held to account… and whoever works hard hears: thank you."
    visual:
      template: scene
      background: street
      characters:
        - { id: salma, pose: standing, mood: smiling, talking: false }
