    role: example
    reel: qarnayn-01
    audio: tts
    narration:
      ar: "زي واحد عنده موهبة… ومستنيها تشتغل لوحدها."
      en: "Like someone with a talent… waiting for it to work on its own."
    visual:
      template: scene
      background: street
      characters:
        - { id: amir, pose: standing, mood: worried, talking: false }
  - id: given-life-2
    role: example
    reel: qarnayn-01
    audio: tts
    narration:
      ar: "واللي بيشتغل على موهبته كل يوم… هو اللي بيوصل."
      en: "The one who works on his talent every day… is the one who gets there."
    visual:
      template: scene
      background: street
      characters:
        - { id: amir, pose: standing, mood: smiling, talking: false }
  - id: outro
    role: outro
    reel: qarnayn-01
    audio: tts
    narration:
      ar: "ومشي… لحد ما وصل للمكان اللي بتغرب فيه الشمس. تابعنا عشان تعرف لقى إيه هناك."
      en: "And he went on… until he reached the place where the sun sets. Follow us to find out what he found there."
    reel_only_end: { ar: "تابعنا عشان تعرف لقى إيه هناك.", en: "Follow us to find out what he found there." }
    visual:
      template: title-card

