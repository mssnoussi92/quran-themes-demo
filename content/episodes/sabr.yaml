  - id: reward-verse
    role: evidence
    reel: sabr-05
    source: quran.39.10
    audio: recitation
    visual:
      template: ayah-card
      highlight: words
  - id: reward-no-limit
    role: conclusion
    reel: sabr-05
    audio: tts
    narration:
      ar: "الصابر أجره… من غير حساب."
      en: "The patient's reward… is without limit."
    visual:
      template: title-card
  # Rappel des quatre reels en une carte (quatre morceaux).
  - id: reward-recap
    role: conclusion
    reel: sabr-05
    audio: tts
    narration:
      ar: "الصبر مش سكوت… مش استسلام… بيتعلم… وأجره من غير حساب."
      en: "Patience isn't silence… isn't giving up… it can be learned… and its reward is without limit."
