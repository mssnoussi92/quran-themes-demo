# Épisode Du'a : 5 reels (9:16) pour Facebook, Instagram et TikTok ; l'épisode entier (16:9, toutes les
# scènes dans l'ordre) pour YouTube. Plan : docs/design.md.
# Script de dua-01 réécrit le 2026-11-06 avec le skill write-hook (.claude/skills/write-hook),
# validé par le propriétaire, modifié à sa demande le même jour (promise-intro : « قال ربنا سبحانه
# وتعالى »), puis validé de nouveau, sous-titre compris (validated_by). Toute modification d'une
# ligne d'un reel retire son validated_by.
# dua-02 à dua-05 : proposés le 2026-11-06 (une idée reçue par reel, puis la conclusion), validés par le
# propriétaire le 2026-11-07, script, traduction et voix (prises figées). Fins de dua-01 à 03 changées en
# « تابعنا عشان تعرف » à sa demande le même jour (comme le repentir) : lignes et nouvelles prises validées par le propriétaire (prises figées).
episode: dua
title: { ar: "الدعاء", en: "Du'a" }
format: misconceptions   # docs/formats.md (skill choose-format)
style: flat   # docs/styles.md (made before the styles, validated in this one)
narration_language: ar-egy   # VoiceTut (égyptien), choix du propriétaire le 2026-11-06
# Textes de publication (titre, description, hashtags du thème) : proposés le 2026-11-07, faits des
# répliques validées du script, validés par le propriétaire le même jour (validated_by) ; exigés par
# un rendu final. Le reste (sources, récitateur, lecteurs, voix IA, chapitres) : video/scripts/publish.ts.
publish:
  title: { en: "Du'a: 3 wrong ideas you might believe", ar: "تلات أفكار غلط عن الدعاء… يمكن تكون مصدق واحدة منهم" }
  description:
    en: "“Ya Rabb”… how many times have you said it today? Du'a isn't just a habit… it's worship. Yet three wrong ideas keep us from it: that du'a goes against contentment, that it changes nothing since everything is written, and that God didn't answer. Each one, answered from the Qur'an and the Sunnah."
    ar: "«يا رب»… قلتها كام مرة النهارده؟ الدعاء مش مجرد عادة… الدعاء عبادة. بس فيه تلات أفكار غلط بتبعدنا عنه: إن الدعاء عكس الرضا، وإنه مش بيغير حاجة عشان كله مكتوب، وإن ربنا مردش. والرد على كل فكرة من القرآن والسنة."
  hashtags: ["#Dua", "#الدعاء", "#Islam"]
  validated_by: mssnoussi92
# Miniature YouTube de l'épisode entier (16:9) : video/src/Thumbnail.tsx, 1280x720. Proposée le
# 2026-11-07 : textes courts tirés du titre validé (« تلات أفكار غلط عن الدعاء », chiffre ٣ pour la
# lisibilité), Amir inquiet de l'accroche. Validée par le propriétaire sur l'image le même jour
# (validated_by) ; rendue avec l'épisode (render, reel = all).
thumbnail:
  layout: close-up
  headline: { ar: "٣ أفكار غلط", en: "3 wrong ideas" }
  kicker: { ar: "عن الدعاء", en: "about du'a" }
  character: { id: amir, pose: standing, mood: worried }
  background: waiting-room
  validated_by: mssnoussi92
reels:
  - id: dua-01
    title: { ar: "يا رب", en: "Ya Rabb" }
    validated_by: mssnoussi92
    publish:
      title: { en: "“Ya Rabb”… how many times have you said it today?", ar: "«يا رب»… قلتها كام مرة النهارده؟" }
      description:
        en: "When you're waiting for a test result, heart pounding… or when you want something so badly… That's not just a habit… it's worship. Why?"
        ar: "لما تكون مستني نتيجة تحليل، وقلبك بيدق… أو لما تبقى نفسك في حاجة أوي… دي مش مجرد عادة… دي عبادة. ليه؟"
      validated_by: mssnoussi92
  - id: dua-02
    title: { ar: "الدعاء والرضا", en: "Du'a and contentment" }
    validated_by: mssnoussi92
    publish:
      title: { en: "Ever said: “I'm content… I won't ask”?", ar: "عمرك قلت: «أنا راضي… مش هدعي»؟" }
      description:
        en: "The first wrong idea about du'a: that it goes against contentment. Ayyub, peace be upon him, in the depth of his trial… called on his Lord. Du'a isn't objecting… it's needing Him."
        ar: "أول فكرة غلط عن الدعاء: إن الدعاء عكس الرضا. سيدنا أيوب عليه السلام، في عز البلاء… دعا ربنا. الدعاء مش اعتراض… الدعاء احتياج."
      validated_by: mssnoussi92
  - id: dua-03
    title: { ar: "الدعاء والقدر", en: "Du'a and destiny" }
    validated_by: mssnoussi92
    publish:
      title: { en: "“It's all written anyway… why make du'a?”", ar: "«ما هو كله مكتوب… أدعي ليه؟»" }
      description:
        en: "The second wrong idea: that du'a changes nothing. Yet there is something that turns back the decree… du'a. And du'a itself… is part of God's decree."
        ar: "تاني فكرة غلط: إن الدعاء مش بيغير حاجة. بس فيه حاجة بترد القضاء… الدعاء. والدعاء نفسه… من قدر ربنا."
      validated_by: mssnoussi92
  - id: dua-04
    title: { ar: "دعيت ومحصلش حاجة", en: "“I prayed and nothing happened”" }
    validated_by: mssnoussi92
    publish:
      title: { en: "You prayed… and prayed… and nothing happened?", ar: "دعيت… ودعيت… ومحصلش حاجة؟" }
      description:
        en: "The third wrong idea: that God didn't answer your du'a. Don't rush… and don't say “I prayed and got no answer.” Your du'a… is never wasted."
        ar: "تالت فكرة غلط: إن ربنا مردش على دعاءك. متستعجلش… ومتقولش «دعيت ومحدش رد». دعاءك… عمره ما بيضيع."
      validated_by: mssnoussi92
  - id: dua-05
    title: { ar: "ربنا قريب", en: "God is near" }
    validated_by: mssnoussi92
    publish:
      title: { en: "Feel like nobody hears you?", ar: "حاسس إن محدش سامعك؟" }
      description:
        en: "God is near… and He answers. Du'a is worship… not against contentment… it turns back the decree… and it's never wasted. So never stop making du'a… and say “Ya Rabb”."
        ar: "ربنا قريب… وبيجيب. الدعاء عبادة… مش عكس الرضا… بيرد القضاء… وعمره ما بيضيع. فمتبطلش تدعي… وقول «يا رب»."
      validated_by: mssnoussi92
scenes:
  # Miroir : une question à la deuxième personne, l'émotion dès la première image.
  - id: hook-1
    role: hook
    reel: dua-01
    audio: tts
    narration:
      ar: "«يا رب»… قلتها كام مرة النهارده؟"
      en: "“Ya Rabb”… how many times have you said it today?"
    visual:
      template: scene
      background: waiting-room
      characters:
        - { id: amir, pose: sitting, mood: worried, talking: false }
  # Contraste : la peur…
  - id: hook-2
    role: hook
    reel: dua-01
    audio: tts
    narration:
      ar: "لما تكون مستني نتيجة تحليل، وقلبك بيدق…"
      en: "When you're waiting for a test result, heart pounding…"
    visual:
      template: scene
      background: waiting-room
      characters:
        - { id: amir, pose: sitting, mood: worried, talking: false }
  # … et le désir.
  - id: hook-3
    role: hook
    reel: dua-01
    audio: tts
    narration:
      ar: "أو لما تبقى نفسك في حاجة أوي…"
      en: "Or when you want something so badly…"
    visual:
      template: scene
      background: street
      characters:
        - { id: amir, pose: standing, mood: smiling, talking: false }
  # Nommer : le mot clé à l'écran.
  - id: hook-4
    role: hook
    reel: dua-01
    audio: tts
    narration:
      ar: "دي مش مجرد عادة… دي عبادة."
      en: "That's not just a habit… it's worship."
    # « عادة » : le ت ne se prononce pas (demande du propriétaire, 2026-11-07).
    say_ar: "دي مش مجرد عاده… دي عبادة."
    visual:
      template: title-card
  # Ancre : la voix lit l'introduction, puis les paroles du Prophète ﷺ prises dans le registre.
  - id: anchor
    role: evidence
    reel: dua-01
    source: hadith.tirmidhi.3247
    audio: tts
    mentions: ["النبي ﷺ"]
    narration:
      ar: "النبي صلى الله عليه وسلم قال:"
      en: "The Prophet ﷺ said:"
    visual:
      template: source-card
  # Question en un mot, réponse aussitôt.
  - id: why
    role: evidence
    reel: dua-01
    audio: tts
    narration:
      ar: "ليه؟"
      en: "Why?"
    visual:
      template: title-card
  - id: because
    role: evidence
    reel: dua-01
    audio: tts
    narration:
      ar: "عشان لما بتقول «يا رب»، إنت بتعترف إنك محتاجله… وإنه يقدر."
      en: "Because when you say “Ya Rabb”, you admit you need Him… and that He can."
    visual:
      template: title-card
  # Promesse : le verset, introduit comme parole de Dieu (formulation du propriétaire, 2026-11-06).
  - id: promise-intro
    role: promise
    reel: dua-01
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: promise
    role: promise
    reel: dua-01
    source: quran.40.60
    audio: recitation          # vraie récitation (content/policy.yaml), jamais de synthèse
    visual:
      template: ayah-card
      highlight: words
  # Boucle ouverte honnête : les 3 idées reçues sont les reels dua-02 à dua-04 (docs/design.md).
  - id: outro
    role: outro
    reel: dua-01
    audio: tts
    narration:
      ar: "بس فيه تلات أفكار غلط عن الدعاء… يمكن تكون مصدق واحدة منهم. تابعنا عشان تعرف أولها."
      en: "But there are three wrong ideas about du'a… you might believe one of them. Follow us to find out the first one."
    # L'appel à suivre, dit seulement dans le reel, à la place de « أولها في الجاي » (demande du propriétaire, 2026-11-07,
    # comme le repentir) ; les versions complètes coupent avant.
    reel_only_end: { ar: "تابعنا عشان تعرف أولها.", en: "Follow us to find out the first one." }
    visual:
      template: title-card

  # ---- dua-02 : idée reçue 1, « le du'a s'oppose au contentement » ------------------------------
  # Miroir : une phrase qu'on entend (ou qu'on se dit) au milieu d'une épreuve.
  - id: content-hook
    role: hook
    reel: dua-02
    audio: tts
    narration:
      ar: "عمرك قلت: «أنا راضي… مش هدعي»؟"
      en: "Ever said: “I'm content… I won't ask”?"
    visual:
      template: scene
      background: waiting-room
      characters:
        - { id: amir, pose: sitting, mood: worried, talking: false }
  # Le narrateur récurrent annonce l'idée reçue ; le mot clé à l'écran.
  - id: content-wrong
    role: misconception
    reel: dua-02
    audio: tts
    narration:
      ar: "أول فكرة غلط عن الدعاء…"
      en: "The first wrong idea about du'a…"
    visual:
      template: scene
      background: plain
      characters:
        - { id: narrator, pose: open-hands, mood: calm, talking: true }
  - id: content-idea
    role: misconception
    reel: dua-02
    audio: tts
    narration:
      ar: "إن الدعاء عكس الرضا."
      en: "That du'a goes against contentment."
    visual:
      template: title-card
  # Ayyub : une personne réelle, jamais dessinée (carte de nom), puis le verset récité.
  - id: content-ayyub
    role: evidence
    reel: dua-02
    audio: tts
    mentions: ["أيوب عليه السلام"]
    narration:
      ar: "سيدنا أيوب عليه السلام، في عز البلاء… دعا ربنا."
      en: "Ayyub, peace be upon him, in the depth of his trial… called on his Lord."
    visual:
      template: name-card
  - id: content-verse-intro
    role: evidence
    reel: dua-02
    audio: tts
    narration:
      ar: "قال ربنا سبحانه وتعالى:"
      en: "Our Lord, glorified and exalted is He, said:"
    visual:
      template: title-card
  - id: content-verse
    role: evidence
    reel: dua-02
    source: quran.21.83
    audio: recitation
    mentions: ["أيوب عليه السلام"]
    visual:
      template: ayah-card
      highlight: words
  - id: content-need
    role: evidence
    reel: dua-02
    audio: tts
    narration:
      ar: "الدعاء مش اعتراض… الدعاء احتياج."
      en: "Du'a isn't objecting… it's needing Him."
    visual:
      template: title-card
  # Comment demander : avec résolution, sans « si Tu veux ».
  - id: content-hadith
    role: evidence
    reel: dua-02
    source: hadith.muslim.2679a
    audio: tts
    mentions: ["النبي ﷺ"]
    narration:
      ar: "والنبي صلى الله عليه وسلم قال:"
      en: "And the Prophet ﷺ said:"
    visual:
      template: source-card
  - id: content-ask
    role: evidence
    reel: dua-02
    audio: tts
    narration:
      ar: "يعني اطلب… وإنت واثق إنه يقدر يديك."
      en: "So ask… sure that He can give it to you."
    visual:
      template: title-card
  - id: content-outro
    role: outro
    reel: dua-02
    audio: tts
    narration:
      ar: "طب ما كل حاجة مكتوبة… الدعاء هيغير إيه؟ تابعنا عشان تعرف."
      en: "But everything is already written… so what can du'a change? Follow us to find out."
    # L'appel à suivre, dit seulement dans le reel, à la place de « ده اللي جاي » (demande du propriétaire, 2026-11-07,
    # comme le repentir) ; les versions complètes coupent avant.
    reel_only_end: { ar: "تابعنا عشان تعرف.", en: "Follow us to find out." }
