# Mots d'arabe standard (فصحى) qui n'ont pas leur place dans la narration en égyptien (VoiceTut, ar-egy), avec ce
# qu'on dit à la place. scripts/validate.py les cherche dans narration.ar des reels pas encore validés, hors
# citations entre « » (un mot du verset repris tel quel, « هذا رحمة من ربي »), avec ou sans « و » / « ف » devant ;
# sans voyelles, et alif avec ou sans hamza comptent pareil. Demande du propriétaire (2026-11-08) : vérifier la
# narration égyptienne sans lui. Liste essayée le même jour sur les 305 répliques validées des sept épisodes :
# aucune alerte. Mots écartés, que l'égyptien parlé emploie aussi : « لكن », « جدًا », « إن ».
words:
  هذا: ده
  هذه: دي
  ذلك: ده
  تلك: دي
  هؤلاء: دول
  أولئك: دول
  الذي: اللي
