  - word: بيلخبط
    say: بِيْلَخْبَط
    why: "Whisper entendait « بلغبه » ; vocalisé, « بيلغبط » (خ et غ se confondent pour lui)"
    decided: { by: mssnoussi92, on: 2026-11-09, scene: khushu/drift-complaint }
  - word: عليا
    say: عَلَيَّا
    why: "« 'alayya » (sur moi) ; écrit « عليّ », il pouvait se lire « عليه » (sur lui)"
    decided: { by: mssnoussi92, on: 2026-11-09, scene: khushu/drift-complaint }
  - word: آمنوا
    say: آمَنُوا
    why: "Whisper entendait « أمينوا » ; vocalisé, « آمنوا »"
    decided: { by: mssnoussi92, on: 2026-11-09, scene: kahf/faith-1 }
  - word: صحيوا
    say: صحيو
