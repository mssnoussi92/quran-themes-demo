# « مخيّر ولا مسيّر؟ » (film `qadar`), short 1 : « النتيجة مكتوبة… هذاكر ليه؟ ». Idée du propriétaire (2026-11-17) ; forme
# choisie par lui le même jour (trois idées reçues, version courte : un verset court par short), avec sa demande : « il faut
# avoir des animations, un cas de vie réel (situation) acté pour attirer le spectateur ». Fiche : docs/themes.md.
# - Le début est une scène type jouée, muette (`silent`, `hold`, `sfx` de « بص تاني ») : une silhouette anonyme sans visage
#   (sa règle du 2026-11-15) referme son livre la veille d'un examen. Une scène type, jamais une histoire vraie.
# - L'idée reçue est montrée comme une parole (« … » entre guillemets), jamais dite par notre voix comme vraie.
# - Le fait : les Compagnons ont posé cette question même (Bukhari 4949 ; aussi 1362, 4945, 6605, 7552 ; Muslim 2647). La
#   narration raconte le lieu (une jenaza, il trace dans le sol avec un bâton : « عود », Bukhari 6605 et 7552) ; les paroles
#   du Prophète ﷺ et la question des Compagnons sont lues par une vraie voix (Abu Malik al-Asqalani, le lecteur de nos autres
#   hadiths de Bukhari : bukhari_audiobook/4949.mp3, 19,32-35,10 s, entendu mot pour mot ; proposée, à écouter par le propriétaire).
# - 92:5-10 : ce qu'il récita juste après (Bukhari 4945 : « إلى قوله للعسرى »).
# - Le sens : al-Muyassar sur 92:5-7 (« فسنرشده ونوفقه إلى أسباب الخير… ونيسِّر له أموره ») et as-Sa'di sur 92:7 (« لأنه أتى
#   بأسباب التيسير، فيسر الله له ذلك »).
# - Répliques de la session sans tafsir : « المكتوب… عمرك ما شفته », l'exemple (la scène rejouée), la phrase à retenir,
#   ce qui distingue ce short et l'annonce du suivant.
# - Recoupement : le short 2 du du'a (« كله مكتوب… أدعي ليه؟ ») ; ici l'idée reçue est dite autrement et la preuve est autre.
# - Images (new-scene, après le script) : `shut` une chambre la nuit, une lampe, la silhouette referme le livre ; `ground`
#   des palmiers au crépuscule, une tombe fraîche, des lignes tracées dans le sable, personne (ni main ni bâton) ; `paths`
#   deux chemins, l'un qui s'éclaire, l'autre de pierres ; `desk` le bureau, le livre fermé ; `open` la silhouette rouvre le
#   livre ; `dawn` le matin à la fenêtre.
# Les débuts (cartes muettes) : le sentiment que tout le monde connaît, joué par la silhouette, puis la promesse à la 3e
# seconde (demande du propriétaire, 2026-11-17 : « commencer par des questions ou un sentiment que la plupart des gens
# ressentent » ; il a choisi ces débuts sur leur aperçu).
id: amal
# « Je valide le script » du propriétaire (2026-11-17, question à choix nommant « docs/scripts/qadar.md à jour : les
# répliques des 3 shorts et du film avec les nouveaux débuts, la place des versets et des hadiths, les titres »). Ni la
# voix, ni les dessins, ni les sources proposées : il les valide sur les vidéos. La voix attend les premières mesures.
script_validated: { by: mssnoussi92, on: 2026-11-17 }
# « Je valide tout sauf la fin du film » du propriétaire (2026-11-17, question à choix nommant les 3 shorts et le film :
# voix, dessins, montage, ambiances ; couvertures et vignette ; textes et 4 accroches ; sources et 2 lectures) : ce short
# tel que livré (run 44067852358 du workflow `film`), sa couverture, son texte et son accroche. Inscrit sur sa parole.
validated: { by: mssnoussi92, on: 2026-11-17, what: [voice, montage, cover, publish, ambience] }
# Audit du 2026-11-20 (docs/scripts/audit-apres-verset.md ; sa demande : « sur toute la vidéo, si on peut jouer une scène,
# on la joue ») : validé par lui le même jour sur l'aperçu (questions à choix). La phrase qui redit 92:5-7 sort (`drop`) ; un visage simple sur la silhouette (`face`, Qadar.tsx). Le film `qadar` ne change pas.
# Validé par lui sur images le 2026-11-21 (« Je valide ») ; la vidéo refaite
# est à valider avant `page-files`.
# La vidéo refaite avec le nom de la série en haut à gauche (sa demande du même jour) validée par lui le 2026-11-21 (« Je valide les 3 »).
drop: ["meaning:0"]
handle: "@quran_words_daily"
voices: { D: "Gemini 3.8 Flash TTS, Algieba", X: "draft, no voice yet" }
text: 78-trial-amal
# Le fond, provisoire, pour les images de style (2026-11-17) : un ciel de nuit dessiné par ffmpeg (tools/trial/clip.py) ; les
# scènes jouées sont dessinées par-dessus (video/src/trial/Qadar.tsx). Un clip filmé se cherchera avec la production.
clip: { source: generated, kind: night, seconds: 20, rate: 1, position: "50% 50%", shift: 0, brightness: 1, ground: "#02040b", horizon: 1260, veil: 0.4, landscape: { side: left, horizon: 1260, brightness: 1 } }
# Ambiance sous la narration, jamais sous le verset ni le hadith : la nuit dehors (grillons ; validée à l'écoute par le
# propriétaire, docs/model.md), la nuit d'avant l'examen.
ambience: { source: bigsoundbank, id: "1880", title: "Campaign at Night #4", author: Joseph Sardin, licence: CC0, page: "https://bigsoundbank.com/campaign-at-night-4-s1880.html", from: 20, seconds: 120, level: -38 }
cover: { scene: shut, title: "كل حاجة مكتوبة… أتعب ليه؟", tag: "مخيّر ولا مسيّر؟ · ١ من ٣", focus: 1100 }
publish:
  title: { en: "“It's all written, why bother?” The Companions asked it", ar: "«كله مكتوب… أتعب ليه؟» الصحابة سألوها" }
  hook:      # légende courte de Facebook, Instagram et TikTok ; validée par lui le 2026-11-17 (« je valide tout sauf la fin du film »)
    ar: "«لو كل حاجة مكتوبة… أتعب ليه؟» الصحابة سألوا السؤال ده… وده كان الرد."
    en: "“If everything is written, why bother?” The Companions asked this… and here is the answer."
    validated: 2026-11-17
  part: 1
  hashtags: ["#القضاء_والقدر", "#مخير_ولا_مسير"]
  description:
    en: "“The result is already written, so why work?” The Companions asked the Prophet ﷺ this very question at a funeral. His answer, and the verses he recited after it: whoever brings the means, God makes the way easy for him."
    ar: "«النتيجة مكتوبة… أشتغل ليه؟» الصحابة سألوا النبي صلى الله عليه وسلم السؤال ده نفسه في جنازة. إجابته، والآيات اللي قرأها بعدها: اللي يجيب الأسباب… ربنا يسهّل له الطريق."
segments:
  # -- la scène jouée, muette
  - narration: hook
    silent: true
    hold: 2.6
    scene: shut
    sfx: [[impact, 0.5]]
    lines:
      - ar: "«لو كل حاجة مكتوبة… أتعب ليه؟»"
        en: "“If everything is written… why bother?”"
  - narration: same
    silent: true
    hold: 3.0
    scene: ground
    sfx: [[whoosh, 0.1]]
    lines:
      - ar: "لو السؤال ده جه في بالك… الصحابة سألوه قبلك."
        en: "If that question ever crossed your mind… the Companions asked it before you."
  # -- le fait, et la réponse lue par une vraie voix
  - narration: open
    scene: ground
    sources: [hadith.bukhari.4949]
    lines:
      - ar: "كانوا في جنازة… والنبي صلى الله عليه وسلم قاعد، بيخطّ في الأرض بعود."
        en: "They were at a funeral… and the Prophet ﷺ sat, tracing lines in the ground with a stick."
      - ar: "وقال لهم كلام… خلّاهم يسألوا نفس سؤالك:"
        en: "He told them something… that made them ask your very question:"
  - reading: hadith.bukhari.4949
    scene: ground
  - narration: recite
    scene: ground
    lines:
      - ar: "وبعدها قرأ الآيات دي:"
        en: "Then he recited these verses:"
  - verses: [quran.92.5, quran.92.6, quran.92.7, quran.92.8, quran.92.9, quran.92.10]
    scene: paths
  # -- le sens
  - narration: meaning
    scene: paths
    sources: [tafsir.muyassar.92.5, tafsir.saadi.92.7]
    lines:
      - ar: "يعني: اللي يدّي… ويتّقي ربنا… ويصدّق… ربنا يسهّل له طريق الخير."
        en: "Meaning: whoever gives… is mindful of God… and believes… God makes the road of good easy for him."
      - ar: "ليه؟ عشان هو جاب الأسباب… فربنا يسّرها له."
        en: "Why? Because he brought the means… so God made it easy for him."
  - narration: depth
    scene: desk
    lines:
      - ar: "المكتوب… عمرك ما شفته."
        en: "What's written… you have never seen it."
      - ar: "اللي إنت شايفه: الكتاب اللي قدامك… والوقت اللي معاك."
        en: "What you do see: the book in front of you… and the time you have."
  # -- la scène rejouée
  - narration: example
    scene: open
    lines:
      - ar: "فيرجع يفتح الكتاب… ويذاكر… ويقول: يا رب."
        en: "So he opens the book again… studies… and says: O Lord."
      - ar: "النتيجة عند ربنا… والمذاكرة عليك."
        en: "The result is with God… the studying is on you."
  - narration: close
    scene: dawn
    lines:
      - ar: "المكتوب… مش عذر إنك تقعد."
        en: "What's written… is no excuse to sit still."
      - ar: "هنا «المكتوب» بقى عذر عشان ما نعملش… وفيه جملة تانية بنقولها: «لما ربنا يهديني»."
        en: "Here, “it's written” became an excuse not to act… and there's another sentence we say: “When God guides me.”"
      - ar: "تابعنا عشان تعرف القرآن ردّ عليها إزاي."
        en: "Follow us to see how the Quran answers it."
