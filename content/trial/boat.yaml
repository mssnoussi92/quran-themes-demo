# Essai du 2026-11-11 (docs/retention.md) : le short du bateau dans le modèle proposé, pour que le propriétaire
# juge sur une vidéo avant tout chantier. Validé depuis par le propriétaire (`script_validated`, `validated`) ; ce fichier n'est pas un épisode (validate.py ne le
# lit pas) et la vidéo ne se rend que dans une session (la vidéo de mer n'est pas dans le dépôt).
# - « une question, le verset, le sens » : la narration ne raconte pas ce que le verset va dire ;
# - la voix continue sur une image qui vit : la mer filmée (Pixabay 22183, clip approuvé par le propriétaire
#   pour quran-reels) et, dessus, la silhouette dessinée de ce que dit le verset ;
# - le verset récité sur la scène (Tawfiq As-Sayegh), texte et traduction du registre ;
# - narration en égyptien, **une seule prise par voix pour tout le short** (content/voice-test/20-trial-boat.txt :
#   le palier gratuit de Gemini donne 10 requêtes par jour), recoupée sur ses pauses par tools/trial/prepare.py ;
#   voix D (Algieba) et E (Sadaltager) de Gemini 3.8 Flash TTS, V = la voix de secours (VoiceTut Mohammed) ;
#   « ركّبوهم » à la place de « شالتهم », que le propriétaire n'aimait pas.
# Lignes de l'IA : toutes les répliques.
# Version 2 (2026-11-11), après l'avis du propriétaire sur la version 1 (image et rythme bons ; script pas assez
# attirant, surtout la leçon de la fin ; l'histoire parle du qadar : tout ce qu'on voit comme un mal n'en est pas
# un ; développer la leçon avec un bon exemple ; finir en annonçant le deuxième) :
# - la promesse de l'accroche regarde le spectateur (« كل حاجة اتكسرت في حياتك ») ;
# - après 18:79 : le sens (le roi prend les bateaux sains), la phrase profonde (Moussa a vu le trou, pas le roi),
#   un exemple de vie en scène type (la petite douleur qui envoie chez le médecin), la phrase à retenir, puis
#   l'annonce du deuxième cas, sans « تابعنا » ;
# - « تلات مواقف », pas « أنواع القدر » : la lecture en trois cas est celle de prédicateurs, pas un classement du
#   Coran ni des livres de croyance (proposition de la session, le propriétaire tranche) ;
# - nouvelle scène `sea` : la mer seule, pour l'exemple (la vie du spectateur) ;
# - demandes du propriétaire sur la version 2 (2026-11-11) : il ne veut pas du mot « اتكسرت » (remplacé par
#   « حاجة وحشة حصلتلك » et « اللي خسرناه ») et veut finir par un appel à suivre : « تابعنا عشان تعرف بقية القصة »,
#   dit après l'annonce du deuxième cas (la raison de suivre) ; le nom de la page s'affiche en grand à ce moment.
#   La phrase de la version 1 « لما حاجة تتكسر في حياتك… افتكر السفينة », que la version 2 avait retirée, revient à
#   sa demande, sans ce mot : « لما حاجة وحشة تحصلك… افتكر السفينة » (elle répond à la promesse de l'accroche).
#   L'annonce du deuxième cas tient en une phrase, bâtie sur ce qui distingue les trois histoires (demande du
#   propriétaire) : ici la sagesse s'est dévoilée vite, dans la deuxième peut-être jamais pour ceux qui l'ont vécue.
# Version 1 : commit 7a36223.
# Script validé par le propriétaire le 2026-11-11 (« je valide le script », après lecture des trois shorts) : les
# répliques ci-dessous, telles qu'elles sont. Cela ne valide ni la voix, ni les images, ni les textes de
# publication ; toute réplique changée ensuite redevient à valider.
script_validated: { by: mssnoussi92, on: 2026-11-11 }
# « Je valide » du propriétaire (2026-11-11) sur la vidéo livrée dans la conversation : la voix D entendue sur la
# vidéo entière, le montage, la couverture, les textes de publication (`publish`). Inscrit sur sa parole.
# L'ambiance sonore (`ambience`), ajoutée après avec son accord, a reçu son propre « je valide » le même jour,
# sur les vidéos `…-ambience.mp4` : ce sont elles, les vidéos finales.
validated: { by: mssnoussi92, on: 2026-11-11, what: [voice, montage, cover, publish, ambience] }
# Ambiance sous la narration, jamais sous un verset ni un hadith (accord du propriétaire, 2026-11-11) : un
# enregistrement de terrain de BigSoundBank (Joseph Sardin, CC0 : tout usage, crédit non exigé), hors dépôt
# (tools/trial/ambience.py). `level` : volume de la nappe en LUFS (la voix est à -16). De petites vagues sur une plage, prises à 10 m.
# Validée par le propriétaire le 2026-11-11, après l'avoir reçue sous les vidéos (`validated`).
ambience: { source: bigsoundbank, id: "1448", title: "Small waves and beach #2", author: Joseph Sardin, licence: CC0, page: "https://bigsoundbank.com/detail-1448-small-waves-and-beach-2.html", from: 100, seconds: 80, level: -36 }
id: boat
handle: "@quran_words_daily"
clip: { source: pixabay, id: 22183, author: Artvan93, page: "https://pixabay.com/videos/id-22183/", position: "62% 50%", horizon: 827, rate: 0.85, landscape: { side: left, horizon: 465 } }
verses: khidr-solo     # épisode préparé d'où viennent les versets et leur récitation
voices: { D: "Gemini 3.8 Flash TTS, Algieba", E: "Gemini 3.8 Flash TTS, Sadaltager", V: "VoiceTut, Mohammed", X: "draft, no voice yet" }
text: 20-trial-boat   # content/voice-test/<text>.txt : toutes les répliques, dans l'ordre, une par ligne
cover: { scene: holed, title: "ليه خرق السفينة؟", tag: "موسى والخضر · ١ من ٣", focus: 1120 }   # couverture 9:16 du short (TrialCover916) ; titre validé par le propriétaire le 2026-11-11, avec le film
# Textes de publication, proposés par la session (2026-11-11), pas encore validés : tools/trial/publish.py en
# fait les textes à coller sur chaque plateforme. Faits des répliques validées du script.
publish:
  title: { en: "Why did he tear a hole in the boat?", ar: "ليه خرق السفينة؟" }
  part: 1
  description:
    en: "They let them board for free… and one of them tore a hole in the boat. Why? The answer is in Surat al-Kahf: a king was seizing every sound boat, and the damage is what saved this one. Not everything that looks bad is bad."
    ar: "ركّبوهم السفينة ببلاش… وواحد منهم خرقها. ليه؟ الإجابة في سورة الكهف: ملك بياخد كل سفينة سليمة، والعيب هو اللي حماها. مش كل حاجة شايفها شر… تبقى شر."
segments:
  - narration: open
    scene: holed
    lines:
      - ar: "ركّبوهم السفينة ببلاش… وواحد منهم خرقها! ليه؟"
        en: "They let them board the boat for free… and one of them tore a hole in it! Why?"
      - ar: "ده حصل بين موسى عليه السلام والخَضِر… والسبب… هيغيّر نظرتك لكل حاجة وحشة حصلتلك في حياتك."
        en: "It happened between Moses, peace be upon him, and al-Khidr… and the reason… will change how you see every bad thing that ever happened to you."
  - verse: quran.18.71
    scene: holed
  - narration: secret
    scene: holed
    lines:
      - ar: "السر؟ الخَضِر قاله بعدين."
        en: "The secret? Al-Khidr told him later."
  - verse: quran.18.79
    scene: fleet
  - narration: meaning
    scene: fleet
    lines:
      - ar: "الملك بياخد كل سفينة سليمة… واللي فيها عيب… بيسيبها."
        en: "The king takes every sound boat… and a damaged one… he leaves."
      - ar: "العيب اللي في السفينة… هو اللي حماها."
        en: "The damage to the boat… is what saved it."
  - narration: depth
    scene: sail
    lines:
      - ar: "موسى شاف الخرق… وما شافش الملك."
        en: "Moses saw the hole… he did not see the king."
      - ar: "وإحنا كده: بنشوف اللي خسرناه… ومش بنشوف اللي اتحمينا منه."
        en: "And so do we: we see what we lost… not what we were protected from."
  - narration: example
    scene: sea
    lines:
      - ar: "زي وجع بسيط… يوديك للدكتور… فيكتشف حاجة أكبر… بدري."
        en: "Like a small pain… that sends you to the doctor… who finds something bigger… early."
      - ar: "الوجع اللي زعّلك… هو اللي نجّاك."
        en: "The pain you resented… is what saved you."
  - narration: close
    scene: sail
    lines:
      - ar: "مش كل حاجة شايفها شر… تبقى شر."
        en: "Not everything you see as bad… is bad."
      - ar: "لما حاجة وحشة تحصلك… افتكر السفينة."
        en: "When something bad happens to you… remember the boat."
      - ar: "هنا الحكمة اتكشفت بسرعة… بس في الموقف التاني… ناس اتوجعوا… ويمكن عمرهم ما عرفوا الحكمة."
        en: "Here the wisdom showed quickly… but in the second story… people were hurt… and may never have known the wisdom."
      - ar: "تابعنا عشان تعرف بقية القصة."
        en: "Follow us to know the rest of the story."
