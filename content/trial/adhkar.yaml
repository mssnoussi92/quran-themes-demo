# Adhkar à lire, sans voix, à enregistrer (demande du propriétaire, 2026-11-17 : « un montage animé sans voix, on laisse
# les gens lire les adhkar du matin, du soir et d'après la prière, et on dit : save it ») : trois vidéos, une par moment ;
# script validé par lui le même jour (docs/scripts/adhkar-cards.md : les adhkar de la politique seulement, chacun avec sa
# référence et son nombre ; le titre seul sur la couverture ; les clips 7215, 2119, 190332). Aucune voix de synthèse.
id: adhkar
validated: { by: mssnoussi92, on: 2026-11-18, what: [publish] }      # « Je valide les textes YouTube » (question à choix, PR #51)
files: adhkar                    # début du nom des vidéos livrées : adhkar-short-<n>-<id>.mp4
