# « معاك ٥ ثواني », short 1 (content/trial/quiz.yaml ; script : docs/scripts/quiz.md) : le sens d'un mot. « سَيَّارَةٌ » de
# 12:19 n'est pas une voiture : une caravane de voyageurs (al-Muyassar, as-Sa'di). La question et ses choix sont muets ;
# le compteur, cinq secondes ; le récitateur dit 12:19 jusqu'à « هذا غلام » ; la voix dit le sens. Rien n'est dessiné
# de Yusuf : le puits, le seau, la caravane. Script écrit par la session le 2026-11-17.
id: sayyara
# « Je valide » du propriétaire (2026-11-17, question à choix nommant le script des shorts 1 et 2 de docs/scripts/quiz.md) :
# les répliques, la question, les choix. Ni la voix, ni les images, ni les textes à coller. Inscrit sur sa parole.
script_validated: { by: mssnoussi92, on: 2026-11-17 }
handle: "@quran_words_daily"
voices: { D: "Gemini 3.8 Flash TTS, Algieba", X: "draft, no voice yet" }
text: 78-trial-sayyara
# proposé, à montrer au propriétaire : une plaine nue au soleil bas (Pixabay 26085, TeeFarm, approuvé pour le film de
# Dhul-Qarnayn) ; le brouillon tourne sur la nuit générée
clip: { source: generated, kind: night, seconds: 20, rate: 1, position: "50% 50%", shift: 0, brightness: 1, ground: "#02040b", horizon: 1380, veil: 0.6 }
ambience: { source: bigsoundbank, id: "0659", title: "Wind in a Tree", author: Joseph Sardin, licence: CC0, page: "https://bigsoundbank.com/wind-in-a-tree-s0659.html", from: 10, seconds: 60, level: -36 }
cover: { scene: ask, title: "«سيارة» في سورة يوسف؟", tag: "معاك ٥ ثواني · ١", focus: 1000 }
quiz:
  head: { verse: quran.12.19, from: 2, to: 2 }        # le mot de la question, écrit en or au-dessus d'elle
  choices:
    - { ar: "عربية", en: "a car", icon: car }
    - { ar: "قافلة مسافرين", en: "a caravan of travellers", icon: caravan, right: true }
    - { ar: "كوكب سيّار", en: "a planet", icon: planet }
publish:
  title: { en: "A \"car\" in Surat Yusuf?", ar: "«سيارة» في سورة يوسف؟" }
  part: 1
  hashtags: ["#سورة_يوسف", "#معاني_الكلمات"]
  description:
    en: "\"Sayyara\" in Surat Yusuf (12:19) is not a car: al-Muyassar and as-Sa'di read it as a company of travellers, a caravan. They sent a man to fetch water, and Yusuf held on to his bucket."
    ar: "«سيارة» في سورة يوسف (يوسف 19) مش عربية: معناها قافلة مسافرين. بعتوا حد يجيب لهم مية… فاتعلّق في الدلو سيدنا يوسف عليه السلام."
segments:
  - narration: ask
    silent: true
    hold: 6.8
    scene: ask
    sfx: [[count, 0], [impact, 5.0]]
    lines:
      - ar: "في سورة يوسف يعني إيه؟"
        en: "in Surat Yusuf: what does it mean?"
  - verses: [quran.12.19]
    upto: 10
    scene: listen
  - narration: meaning
    scene: meaning
    sources: [tafsir.muyassar.12.19, tafsir.saadi.12.19]
    lines:
      - ar: "الكلمة دي… معناها: قافلة مسافرين."
        en: "This word… means: a caravan of travellers."
      - ar: "بعتوا حد يجيب لهم مية… فاتعلّق في الدلو سيدنا يوسف عليه السلام."
        en: "They sent someone to fetch water… and Yusuf, peace be upon him, held on to the bucket."
  - narration: close
    scene: close
    lines:
      - ar: "وإنت… فيه كلمة كنت فاكر معناها حاجة… وطلعت حاجة تانية؟"
        en: "And you… is there a word you thought meant one thing… and it turned out to mean another?"
      - ar: "والسؤال الجاي: آية… تفتكر خلصت بإيه؟ تابعنا."
        en: "Next question: a verse… how do you think it ends? Follow us."
