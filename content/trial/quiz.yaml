# La série « معاك 5 ثواني » (demande du propriétaire, 2026-11-17 : « un nouveau type de short, comme un jeu pour attirer
# les commentaires »). Une question écrite sur la première image, trois choix, un compteur de cinq secondes, la réponse ;
# puis le récitateur dit le verset, et la voix en donne le sens d'après un tafsir nommé. Trois formats, un short chacun
# (ses choix, 2026-11-17) : le sens d'un mot (sayyara), la fin d'un verset (khatima), qui l'a dit (qalaha) ; puis trois
# autres, un par format (sa demande du même jour : « prépare 3 autres quiz ») : dabba, sabr, hudhud.
# Fiche : docs/themes.md ; script : docs/scripts/quiz.md (validé le 2026-11-17). Le montage : video/src/trial/Quiz.tsx ;
# les morceaux de versets écrits à l'écran : tools/trial/quiz.py (quizData.ts, depuis le registre).
id: quiz
files: quiz                      # début du nom des vidéos livrées : quiz-short-<n>-<id>.mp4
title: { ar: "معاك 5 ثواني", en: "You Have 5 Seconds" }       # choisi par le propriétaire le 2026-11-17
shorts: [sayyara, khatima, qalaha, dabba, sabr, hudhud]
# Published on another page only (owner's choice, 2026-11-18): the test page on Meta, « معاك 5 ثواني », gets the
# quizzes 4 to 6, the same days and hours as the quizzes 1 to 3 on the Page's Instagram (23 and 30 November, 28
# December), signed with its name (`handles` of content/publish.yaml): `--only ma3ak` of tools/trial/videos.py renders
# them and their covers as <name>-ma3ak.mp4 and <name>-ma3ak-cover.jpg. They never go to the Page itself.
elsewhere: { ma3ak: [dabba, sabr, hudhud] }
validated: { by: mssnoussi92, on: 2026-11-18, what: [publish] }      # « je valide les textes », après l'envoi de publication-quiz.md
handle: "@quran_words_daily"
publish:
  out: docs/retention/publication-quiz.md
  series: { en: "You Have 5 Seconds", ar: "معاك 5 ثواني" }
  hashtags: ["#معاك_5_ثواني", "#تفسير_القرآن"]
  narration: { D: "Narration: AI-generated voice (Gemini TTS, Egyptian Arabic) · صوت الراوي مولَّد بالذكاء الاصطناعي", X: "No narration voice yet: draft · مسودة بدون صوت" }
