# « ذكر وحكايته », short 2 (pilote, 2026-11-17 ; content/trial/dhikr.yaml, docs/themes.md) : le dhikr du matin et du soir
# de Tirmidhi 3575 (al-Albani : Hasan). Le fait : 'Abdallah ibn Khubayb et d'autres sortent par une nuit de pluie et de
# grande obscurité chercher le Prophète ﷺ pour qu'il prie avec eux ; quand il le trouve, le Prophète ﷺ lui dit « قل »
# trois fois sans qu'il sache quoi dire ; puis : Al-Ikhlas et les deux sourates de refuge, le soir et le matin, trois
# fois, « تكفيك من كل شيء ». La narration raconte la nuit et la demande avec ses mots ; le dialogue est lu par une vraie voix.
# - Les trois sourates récitées entières (Tawfiq : 112 en 10,7 s, 113 en 20,7 s, 114 en 26,6 s), une réplique de sens
#   après chacune : al-Muyassar sur 112:1 (Il est seul dans la divinité, la seigneurie, les noms et les attributs), 113:2
#   (le mal de toutes les créatures), 114:4 (le Satan qui souffle à l'heure de l'inattention et se retire au rappel d'Allah).
# - Répliques de la session, à valider. Les nôtres sans tafsir : « التلات سور معانا من زمان… زي مفاتيح… » (ce qu'on ne
#   voit pas et l'exemple en une réplique, pour tenir sous 2:05), la phrase à retenir.
# - Images prévues (des choses et des lieux, personne ; rien sur 112, qui parle d'Allah : le clip seul) : `rain` une
#   nuit de pluie, un chemin, une lanterne ; `sky` le ciel seul ; `keys` des clés posées près de la porte.
# - La dernière réplique avant l'appel annonce le short 3 (les pauvres et les riches) : promesse à tenir.
id: qul
