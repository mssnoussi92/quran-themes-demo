publish:
  title:
    en: Far from God… and living in comfort?
    ar: بعيد عن ربنا… وعايش مرتاح؟
  part: 1
  hashtags:
  - '#ذكر_الله'
  - '#الاستدراج'
  description:
    en: 'The Quran says whoever turns away from God''s remembrance will have a narrow life (20:124). So why do so many who are far from God seem to live in comfort? The verse''s own meaning answers first:
      the narrowness is in the heart. And another verse goes further (6:44).'
    ar: 'القرآن بيقول اللي يبعد عن ذكر ربنا حياته تبقى ضنك (طه 124). طب ليه ناس كتير بعيدة عن ربنا وعايشين مرتاحين؟ الرد الأول في معنى الآية نفسها: الضيق في القلب. وآية تانية بتقول حاجة أخطر (الأنعام 44).'
  hook:      # légende courte de Facebook, Instagram et TikTok (format choisi par le propriétaire le 2026-11-15) ; proposée, pas encore validée
    ar: "القرآن بيقول اللي يبعد عن ذكر ربنا حياته تبقى ضنك… طب ليه ناس كتير عايشين مرتاحين؟"
    en: "The Quran says whoever turns away from God's remembrance will have a narrow life. So why do so many seem to live in comfort?"
segments:
- narration: open
  scene: pause
  lines:
  - ar: لحظة ركّز في الآية دي.
    en: Wait… focus on this verse.
- verse: quran.20.124
  scene: listen
- narration: meaning
  scene: listen
  sources:
  - tafsir.muyassar.20.124
  lines:
  - ar: 'يعني: اللي يبعد عن ذكر ربنا… حياته تبقى ضنك… ضيقة وصعبة.'
    en: 'Meaning: whoever turns away from remembering God… his life becomes narrow… tight and hard.'
- narration: ask
  scene: ask
  lines:
  - ar: بس استنى… في ناس كتير بعيدة عن ربنا… وعايشين مرتاحين.
    en: But wait… many people are far from God… and live in comfort.
  - ar: فلوس… وبيت… وكل اللي نفسهم فيه.
    en: Money… a house… everything they want.
  - ar: فإزاي؟
    en: So how?
- narration: inside
  scene: inside
  sources:
  - tafsir.muyassar.20.124
  - tafsir.ibn-kathir.20.124
  lines:
  - ar: 'الرد في معنى الآية نفسها: الضيق ده… مش في الجيب… ده في القلب.'
    en: 'The answer is in the verse''s own meaning: that narrowness… isn''t in the pocket… it''s in the heart.'
  - ar: ممكن يلبس اللي هو عايزه… وياكل اللي هو عايزه… ويسكن فين ما يحب…
    en: He may wear what he wants… eat what he wants… live where he likes…
  - ar: وقلبه من جوّه… قلق وحيرة.
    en: and inside, his heart… is anxious and lost.
- narration: more
  scene: facing
  lines:
  - ar: وفي آية تانية… حاجة أخطر.
    en: And another verse… says something more serious.
- verse: quran.6.44
  scene: answer
- narration: meaning2
  scene: answer
  sources:
  - tafsir.muyassar.6.44
  lines:
  - ar: 'يعني: لما نسيوا… ربنا فتح عليهم الدنيا… رزق وصحة…'
    en: 'Meaning: when they forgot… God opened the world to them… provision and health…'
  - ar: استدراج… لحد ما فرحوا بيها… خدهم فجأة.
    en: to draw them on… until they rejoiced in it… and He took them suddenly.
- narration: example
  scene: example
  lines:
  - ar: 'زي واحد كل حاجة ماشية معاه… وهو بعيد عن ربنا… فيقول: أكيد أنا كويس.'
    en: 'Like someone for whom everything goes well… while far from God… who tells himself: I must be fine.'
  - ar: النعمة مع البعد… مش علامة إنك كويس.
    en: Blessings while far from God… are no sign that you're fine.
- narration: close
  scene: end
  lines:
  - ar: الراحة الحقيقية… في القلب… مش في الجيب.
    en: Real comfort… is in the heart… not in the pocket.
  - ar: 'والحلقة الجاية… العكس: مؤمن… وحياته صعبة؟ تابعنا.'
    en: 'Next time… the opposite: a believer… whose life is hard? Follow us.'
