  lines:
  - ar: 'يعني: ربنا بيبلّغ عباده… إنه بيغفر… وبيرحم.'
    en: 'Meaning: God tells His servants… that He forgives… and He is merciful.'
- narration: ask
  scene: ask
  lines:
  - ar: 'وهنا في ناس بتقول: طالما ربنا غفور رحيم…'
    en: 'And here some people say: since God is forgiving and merciful…'
  - ar: أعمل اللي أنا عايزه… وأستغفر بعدين؟
    en: I'll do what I want… and ask forgiveness later?
- narration: more
  scene: facing
  lines:
  - ar: استنى… الرد في الآية اللي بعدها على طول.
    en: Wait… the answer is in the very next verse.
- verse: quran.15.50
  scene: answer
- narration: meaning2
  scene: answer
  sources:
  - tafsir.muyassar.15.49
  lines:
  - ar: 'يعني: الغفور… للي يتوب ويرجع.'
    en: 'Meaning: the Forgiving… for whoever repents and returns.'
  - ar: والعذاب الأليم… للي يصرّ وما يتوبش.
    en: And the painful punishment… for whoever persists without repenting.
- narration: example
  scene: example
  lines:
  - ar: 'زي واحد بيأجّل التوبة… وكل مرة يقول: بكرة.'
    en: 'Like someone who keeps putting off repentance… saying every time: tomorrow.'
  - ar: وهو ميعرفش… بكرة جاي… ولا لأ.
    en: And he doesn't know… whether tomorrow will come… or not.
- narration: close
  scene: end
  lines:
  - ar: الرحمة… باب للي راجع… مش عذر للي مكمّل.
    en: Mercy… is a door for those who return… not an excuse for those who carry on.
  - ar: تابعنا… عشان السؤال الصعب الجاي.
    en: Follow us… for the next hard question.
