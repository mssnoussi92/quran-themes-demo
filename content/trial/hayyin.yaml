# La série « وتحسبونه هيّنًا » (idée du propriétaire, 2026-11-17 : « je veux explorer une nouvelle série : الغيبة، النميمة،
# الرياء… pour الغيبة on a l'idée que حسناتك ممكن تمشي لحد انت اغتبته ; il faut bien choisir le hook et bien créer une
# situation »). Forme et titre choisis par lui le même jour (questions à choix, chaque fois la recommandation de la session) :
# trois shorts qui tiennent seuls, sans film ; le titre de 24:15, qu'as-Sa'di étend à tous les péchés pris à la légère
# (« الزجر البليغ، عن تعاطي بعض الذنوب على وجه التهاون بها ») ; chaque short s'ouvre sur une scène type jouée, muette, par
# une silhouette anonyme sans visage (comme « مخيّر ولا مسيّر؟ ») ; les trois scripts tout de suite, aucune voix avant
# « je valide le script ». Fiche et contradictions : docs/themes.md ; script : docs/scripts/hayyin.md.
# - Ce qui distingue les parties : la ghiba, ce que tu dis sur lui ; la namima, ce que tu lui rapportes ; le riya', ce que
#   tu fais pour qu'on te voie.
# - Rien de l'invisible n'est dessiné (le Jour du Jugement, les tombes de l'intérieur, les حسنات qui passent).
id: hayyin
validated: { by: mssnoussi92, on: 2026-11-19, what: [publish] }      # « je valide titres et descriptions » (question à choix nommant les 3 titres et les 3 descriptions)
files: hayyin                    # début du nom des vidéos livrées : hayyin-short-<n>-<id>.mp4
title: { ar: "وتحسبونه هيّنًا", en: "You Think It Is Small" }
shorts: [ghiba, namima, riya]
handle: "@quran_words_daily"
publish:
  title: { en: "Sins we think are small", ar: "ذنوب بنحسبها صغيرة" }      # le titre du film, proposé par la session (2026-11-21), à valider
  out: docs/retention/publication-hayyin.md
  series: { en: "You Think It Is Small", ar: "وتحسبونه هيّنًا" }
  hashtags: ["#وتحسبونه_هينا", "#تزكية_النفس"]
  narration: { D: "Narration: AI-generated voice (Gemini TTS, Egyptian Arabic) · صوت الراوي مولَّد بالذكاء الاصطناعي", V: "Narration: AI-generated voice (VoiceTut, Egyptian Arabic) · صوت الراوي مولَّد بالذكاء الاصطناعي" }

# ---------------------------------------------------------------------------------------------------------------------
# Le film (décision du propriétaire, 2026-11-21 : « un film chaque lundi », les films faits des séries qui forment un
# tout ; la série sort de la réserve, son film le 14 décembre ; ses ajouts, question à choix : « 24:15 récité »,
# « Bukhari 6478 », « ouverture : 3 gestes du quotidien »). Il reprend les trois shorts réplique par réplique (sans
# leurs appels à suivre ; les annonces « والجاية » servent de liaisons) et ajoute : l'ouverture (les trois gestes, une
# image chacun), Bukhari 6478 lu par une vraie voix (« لا يلقي لها بالًا » : la parole qu'on dit sans y penser) et son
# sens, la fin sur 24:15, le verset du nom de la série, jamais récité dans les shorts (al-Muyassar : il est venu sur la
# calomnie colportée sans savoir ; as-Sa'di : tenir un péché pour léger ne l'allège pas, cela le rend plus facile à
# refaire). Répliques à valider avant toute voix (une requête, texte 107-trial-hayyin-film) ; la lecture de Bukhari 6478
# est à trouver (archive.org, skill find-hadith-recording) et à faire écouter au propriétaire.
text: 107-trial-hayyin-film
outro: 12
thumbnail: { title: "وتحسبونه هيّنًا", tag: "3 ذنوب بنشوفها صغيرة", panels: [ghiba, namima, riya] }
chapters:
  - id: open
    title: { ar: "تلات حاجات صغيرة", en: "Three small things" }
    segments:
      - narration: film-open
        shots: [{ picture: ghiba, scene: cafe }, { picture: namima, scene: phone }, { picture: riya, scene: box }]
        lines:
          - ar: "كلمة في غياب حد…"
            en: "A word about someone who isn't there…"
          - ar: "رسالة اتنقلت…"
            en: "A message forwarded…"
          - ar: "وعمل خير… اتصوّر عشان الناس تشوفه."
            en: "And a good deed… filmed so that people see it."
      - narration: film-small
        picture: ghiba
        scene: chair
        lines:
          - ar: "تلات حاجات بنعملها كل يوم… ومش بنفكر فيها مرتين."
            en: "Three things we do every day… without a second thought."
          - ar: "والنبي صلى الله عليه وسلم قال عن الكلمة اللي بنقولها من غير ما نفكر:"
            en: "And the Prophet ﷺ spoke of the word we say without thinking:"
      - { reading: hadith.bukhari.6478 }
      - narration: film-weight
        sources: [hadith.bukhari.6478]
        lines:
          - ar: "يعني: كلمة واحدة… ممكن ترفعك درجات… وممكن تهوي بيك في النار… وانت مش واخد بالك منها."
            en: "Meaning: a single word… can raise you by degrees… or drop you into the Fire… without you even noticing it."
  - id: ghiba
    number: 1
    title: { ar: "الغيبة", en: "Backbiting" }
    segments:
      - { reuse: ghiba.hook, picture: ghiba, scene: cafe }
      - { reuse: ghiba.open, scene: chair }
      - { reading: hadith.bukhari.2449, scene: chair }
      - { reuse: ghiba.meaning, scene: table }
      - { reuse: ghiba.turn, scene: cafe }
      - { verse: quran.49.12, scene: night }
      - { reuse: ghiba.sense, scene: chair }
      - { reuse: ghiba.depth, scene: alone }
      - { reuse: ghiba.example, scene: cafe }
      - { reuse: ghiba.close, lines: [0, 1], scene: dawn, subscribe: true }
  - id: namima
    number: 2
    title: { ar: "النميمة", en: "Tale-bearing" }
    segments:
      - { reuse: namima.hook, picture: namima, scene: phone }
      - { reuse: namima.open, scene: sent }
      - { verses: [quran.68.10, quran.68.11], scene: path }
      - { reuse: namima.meaning, scene: path }
      - { reuse: namima.word, scene: steps }
      - { reading: hadith.bukhari.216, scene: graves }
      - { reuse: namima.depth, scene: phone }
      - { reuse: namima.honest, scene: sent }
      - { reuse: namima.example, scene: split }
      - { reuse: namima.close, lines: [0, 1], scene: still }
  - id: riya
    number: 3
    title: { ar: "الرياء", en: "Showing off" }
    segments:
      - { reuse: riya.hook, picture: riya, scene: box }
      - { reuse: riya.open, scene: hearts }
      - { verse: quran.2.264, scene: rock }
      - { reuse: riya.meaning, scene: bare }
      - { reuse: riya.depth, scene: soil }
      - { reuse: riya.honest, scene: box }
      - { reuse: riya.example, scene: two }
      - { reuse: riya.close, lines: [0], scene: dawn }
  - id: end
    title: { ar: "وتحسبونه هيّنًا", en: "You think it is small" }
    segments:
      - narration: film-name
        picture: ghiba
        scene: dawn
        sources: [tafsir.muyassar.24.15]
        lines:
          - ar: "تلات ذنوب… بنشوفها صغيرة."
            en: "Three sins… that we see as small."
          - ar: "والقرآن وصف الإحساس ده… في آية نزلت في كلام اتنقل على لسان الناس من غير علم:"
            en: "And the Quran described that feeling… in a verse revealed about words passed from tongue to tongue without knowledge:"
      - { verse: quran.24.15 }
      - narration: film-weight2
        sources: [tafsir.saadi.24.15]
        lines:
          - ar: "يعني: لما تشوف الذنب صغير… مش بيصغر عند ربنا."
            en: "Meaning: when you see a sin as small… it doesn't become small with God."
          - ar: "بالعكس… بيسهل عليك ترجعله تاني."
            en: "On the contrary… it makes it easier to go back to it."
      - narration: film-end
        subscribe: true
        lines:
          - ar: "قبل الكلمة… وقبل الرسالة… وقبل الصورة: افتكر الآية دي."
            en: "Before the word… before the message… before the photo: remember this verse."
          - ar: "ابعته لحد بتحبه."
            en: "Send it to someone you love."
