# « معاك 5 ثواني », short 4 (content/trial/quiz.yaml ; script : docs/scripts/quiz.md) : le sens d'un mot. « دَآبَّةُ ٱلْأَرْضِ »
# de 34:14 n'est pas la bête de la fin des temps (27:82) : c'est la termite qui mange la canne de Soulayman (al-Muyassar,
# Ibn Kathir) ; les jinns ne savaient pas qu'il était mort (la preuve qu'ils ne connaissent pas l'invisible). Le récitateur
# dit 34:14 jusqu'à « منسأته » ; la voix dit le reste. Rien n'est dessiné de Soulayman ni des jinns : les arcs d'une salle,
# une canne. Script écrit par la session le 2026-11-17.
id: dabba
# « Je valide, verset coupé » du propriétaire (2026-11-17, question à choix nommant le script du quiz 4 de
# docs/scripts/quiz.md, 34:14 récité jusqu'à « منسأته ») : les répliques, la question, les choix. Ni la voix, ni les
# images, ni les textes à coller. Inscrit sur sa parole.
script_validated: { by: mssnoussi92, on: 2026-11-17 }
handle: "@quran_words_daily"
voices: { D: "Gemini 3.8 Flash TTS, Algieba", X: "draft, no voice yet" }
text: 89-trial-dabba
# PROPOSÉ (pas encore approuvé pour ce short) : un coucher qui devient nuit (Pixabay 8451, Felix-Mittermeier, approuvé
# pour « الحجر » de « كلمة من القرآن »), sous les arcs dessinés
clip: { source: pixabay, id: 8451, author: Felix-Mittermeier, page: "https://pixabay.com/videos/id-8451/", take: { slow: 7, height: 1440 }, rate: 1, position: "50% 50%", shift: 0, brightness: 0.7, ground: "#06050c", horizon: 1380, veil: 0.8 }
ambience: { source: bigsoundbank, id: "1880", title: "Campaign at Night #4", author: Joseph Sardin, licence: CC0, page: "https://bigsoundbank.com/campaign-at-night-4-s1880.html", from: 20, seconds: 60, level: -38 }
cover: { scene: ask, title: "«دابة الأرض» في سورة سبأ؟", tag: "معاك 5 ثواني · 4", focus: 1000 }
quiz:
  head: { verse: quran.34.14, from: 10, to: 11 }      # « دَآبَّةُ ٱلْأَرْضِ », écrit en or au-dessus de la question
  choices:
    - { ar: "دابة آخر الزمان", en: "the beast of the end of time", note: { ar: "في سورة النمل · 82", en: "in an-Naml, 82" } }
    - { ar: "حشرة بتاكل الخشب", en: "an insect that eats wood", right: true }
    - { ar: "دابة للركوب", en: "a mount to ride" }
publish:
  title: { en: "\"The beast of the earth\" in Surat Saba'?", ar: "«دابة الأرض» في سورة سبأ؟" }
  part: 4
  hashtags: ["#سورة_سبأ", "#معاني_الكلمات"]
  hook:      # légende courte de Facebook, Instagram et TikTok ; proposée par la session le 2026-11-17, à valider
    ar: "«دابة الأرض» في سورة سبأ… مش اللي في بالك. معاك 5 ثواني."
    en: '"The beast of the earth" in Surat Saba''… not the one you''re thinking of. You have 5 seconds.'
  description:
    en: "\"The beast of the earth\" in Surat Saba' (34:14) is not the beast of the end of time (27:82): al-Muyassar and Ibn Kathir read it as the termite that ate Solomon's staff. He had died leaning on it, and the jinn, whom many think know the unseen, kept working without knowing."
    ar: "«دابة الأرض» في سورة سبأ (سبأ 14) مش دابة آخر الزمان: معناها الأرَضة، الحشرة اللي أكلت عصاية سيدنا سليمان. مات وهو متّكي عليها… والجن ما عرفوش."
segments:
  - narration: ask
    silent: true
    hold: 6.8
    scene: ask
    sfx: [[count, 0], [impact, 5.0]]
    lines:
      - ar: "في سورة سبأ يعني إيه؟"
        en: "in Surat Saba': what does it mean?"
  - verses: [quran.34.14]
    upto: 13
    scene: listen
  - narration: meaning
    scene: meaning
    sources: [tafsir.muyassar.34.14, tafsir.ibn-kathir.34.14]
    lines:
      - ar: "الكلمة دي هنا… معناها الأرَضة: حشرة صغيرة بتاكل الخشب."
        en: "Here this word… means the termite: a small insect that eats wood."
  - narration: fall
    scene: fall
    sources: [tafsir.muyassar.34.14]
    lines:
      - ar: "سيدنا سليمان مات وهو متّكي على عصايته… والجن فضلوا شغالين، فاكرينه عايش… لحد ما الحشرة أكلت العصاية ووقع."
        en: "Solomon died leaning on his staff… the jinn kept working, thinking he was alive… until the insect ate the staff and he fell."
  - narration: jinn
    scene: jinn
    sources: [tafsir.muyassar.34.14, tafsir.saadi.34.14]
    lines:
      - ar: "والجن اللي ناس كتير فاكرينهم بيعرفوا الغيب… ما عرفوش إنه مات قدامهم."
        en: "And the jinn, whom many think know the unseen… didn't know he had died before their eyes."
  - narration: close
    scene: close
    lines:
      - ar: "وإنت… سمعت قبل كده حد بيقول إن الجن بيعرفوا الغيب؟"
        en: "And you… have you ever heard someone say the jinn know the unseen?"
      - ar: "والسؤال الجاي: جملة قالها سيدنا يعقوب مرتين… تفتكر كمّلها بإيه؟ تابعنا."
        en: "Next question: a sentence Jacob said twice… how do you think he went on? Follow us."
