# run 44121795304, et son clip) : le montage, les dessins et le clip tels que rendus. La voix, la couverture et l'ambiance
# sous la voix restent à valider sur la vidéo finale. Inscrit sur sa parole.
# « Je valide les 3 » du propriétaire (2026-11-18, question à choix nommant la voix, les couvertures et l'ambiance sous
# la voix des vidéos avec voix du workflow `film`, run 44270232504) : ajoutés au montage validé le 2026-11-17 ; puis
# « je valide les textes » (même jour, question à choix nommant les titres et descriptions de publication-quiz.md).
# Inscrit sur sa parole.
