# « آية وحكايتها », short 2 (pilote, 2026-11-11 ; content/trial/ayah.yaml, docs/themes.md) : Ad-Duha 93:1-8.
# Le fait : le Prophète ﷺ, malade, ne se lève pas deux ou trois nuits ; une femme vient lui dire qu'elle espère qu'il
# a été abandonné ; la sourate descend (Bukhari 4950 : « اشتكى… فلم يقم ليلتين أو ثلاثا، فجاءت امرأة فقالت… »).
# - Le mot de la femme (« شيطانك ») n'est pas redit par notre voix : « اللي بيجيلك سابك ». « تشمت » est notre
#   lecture de « إني لأرجو » (elle espère). Aucun nom : le récit de nos recueils n'en donne pas.
# - Deux autres récits des livres de causes de révélation (une parole prêtée à Khadija, un chiot mort sous le lit)
#   ne sont pas dans nos recueils : ils ne sont pas racontés.
# - Le sens (al-Muyassar) : serment par le jour et par la nuit quand elle s'apaise ; « ما تركك ربك وما أبغضك بإبطاء
#   الوحي عنك » ; l'au-delà vaut mieux pour toi que ce monde ; orphelin et Il t'a abrité ; « لا تدري ما الكتاب ولا
#   الإيمان فعلّمك » (93:7 dit d'après le tafsir, mot pour mot dans le sens) ; pauvre et Il t'a pourvu, « وأغنى نفسك
#   بالقناعة ». As-Sa'di lit 93:4 autrement (chaque état à venir meilleur que le précédent) : on dit al-Muyassar.
# - La leçon (as-Sa'di, 93:8) : « فالذي أزال عنك هذه النقائص سيزيل عنك كل نقص ».
# - La récitation s'arrête à 93:8 : les trois derniers versets (les ordres) ne sont pas récités. 93:1-5 puis 93:6-8
#   sont récités d'une traite (`verses:`) : le récitateur enchaîne ces versets sans silence (coupes posées à la main).
# - Images prévues (personne, rien de l'invisible) : `night` une nuit calme ; `dawn` la première lumière ; `day` le
#   plein matin.
# - La dernière réplique avant l'appel annonce le short 3 (39:53) : promesse à tenir, ordre de publication.
id: duha
# « Je valide le reste » du propriétaire (2026-11-12), en réponse au script envoyé (docs/scripts/ayah.md), une seule
# réplique étant à changer, dans le short 3 (`hope`) : les répliques, la place des versets, ce sur quoi chaque narration
# repose, les titres. Ni la voix, ni les images (clips proposés, dessins), ni l'ambiance, ni les textes de publication,
# ni les sources proposées du registre : il les valide sur les vidéos. Toute réplique changée ensuite redevient à
# valider. La prise de voix, faite avant ce mot par erreur (docs/history.md, tâche 50), dit ce script mot pour mot.
script_validated: { by: mssnoussi92, on: 2026-11-12 }
# « Je valide tout sur les 3 shorts » du propriétaire (2026-11-12), sur les vidéos rendues par le workflow `film` et
# envoyées dans la conversation (livrée le même jour) : la voix D sur la vidéo entière, le montage (le clip
# et les dessins), la couverture, l'ambiance, les textes de publication (`publish`, docs/retention/publication-ayah.md,
# envoyés) ; et ses sources encore proposées, passées à `validated` dans le registre. Inscrit sur sa parole.
validated: { by: mssnoussi92, on: 2026-11-12, what: [voice, montage, cover, publish, ambience] }
handle: "@quran_words_daily"
voices: { D: "Gemini 3.8 Flash TTS, Algieba", V: "VoiceTut, Mohammed", X: "draft, no voice yet" }
text: 51-trial-duha     # content/voice-test/<text>.txt : toutes les répliques, dans l'ordre, une par ligne
# Le clip (validé par le propriétaire sur la vidéo, 2026-11-12) : une aube rose filmée d'un drone qui s'élève au-dessus d'une
# colline boisée et découvre une baie, ralentie cinq fois pour ne se jouer qu'une fois. Dessins : video/src/trial/Ayah.tsx.
clip: { source: pixabay, id: 2119, author: bellergy, page: "https://pixabay.com/videos/id-2119/", take: { slow: 5, height: 1440 }, rate: 1, position: "50% 50%", shift: 0, brightness: 0.7, ground: "#07060b", horizon: 1330 }
# Ambiance sous la narration, jamais sous les versets : un des trois enregistrements validés à l'écoute par le
# propriétaire sur le premier film (docs/model.md, « Ambiances ») : un pré la nuit.
ambience: { source: bigsoundbank, id: "1880", title: "Campaign at Night #4", author: Joseph Sardin, licence: CC0, page: "https://bigsoundbank.com/campaign-at-night-4-s1880.html", from: 20, seconds: 80, level: -38 }
cover: { scene: dawn, title: "قالتله: سابك… فنزل الرد", tag: "آية وحكايتها · ٢", focus: 1180 }
publish:
  title: { en: "She told him: you've been left… and the answer came down", ar: "قالتله: سابك… فنزل الرد" }
  part: 2
  hashtags: ["#سورة_الضحى", "#جبر_الخواطر"]      # les siens, d'abord (validés par le propriétaire le 2026-11-14)
  description:
    en: "The Prophet ﷺ had been ill for two or three nights when a woman came to gloat: the one who comes to you has left you. The answer did not come from him: a surah came down. Late does not mean left."
    ar: "النبي ﷺ كان تعبان ليلتين تلاتة… فجت واحدة تشمت وتقوله: اللي بيجيلك سابك. والرد ما جاش منه: نزلت سورة. اتأخر عليك… بس ما سابكش."
segments:
  - narration: open
    scene: night
    sources: [hadith.bukhari.4950]
    lines:
      - ar: "واحدة جت تشمت في النبي صلى الله عليه وسلم… وقالتله: اللي بيجيلك سابك!"
        en: "A woman came to gloat at the Prophet ﷺ… and told him: the one who comes to you has left you!"
      - ar: "كان تعبان… ليلتين تلاتة ما قامش."
        en: "He had been ill… for two or three nights he had not risen."
      - ar: "والرد عليها… ما جاش منه. نزل من السما."
        en: "And the answer to her… did not come from him. It came down from heaven."
      - ar: "ولو حسّيت يوم إن ربنا سابك… اسمع الرد ده."
        en: "And if you have ever felt that God left you… listen to this answer."
  - verses: [quran.93.1, quran.93.2, quran.93.3, quran.93.4, quran.93.5]
    scene: dawn
  - narration: meaning
    scene: dawn
    sources: [tafsir.muyassar.93.3, tafsir.muyassar.93.4]
    lines:
      - ar: "ربنا أقسم بالنهار… وبالليل لما يسكن ويضلّم."
        en: "God swore by the daylight… and by the night when it grows still and dark."
      - ar: "الوحي اتأخر… بس ربنا ما سابكش… ولا كرهك."
        en: "Revelation was late… but God has not left you… nor does He hate you."
      - ar: "والآخرة أحسن لك من الدنيا… وهيديك لحد ما ترضى."
        en: "And the hereafter is better for you than this world… and He will give you until you are content."
  - narration: turn
    scene: dawn
    lines:
      - ar: "طب والدليل؟ ربنا فكّره بتلات حاجات… من حياته هو."
        en: "And the proof? God reminded him of three things… from his own life."
  - verses: [quran.93.6, quran.93.7, quran.93.8]
    scene: day
  - narration: proof
    scene: day
    sources: [tafsir.muyassar.93.6, tafsir.muyassar.93.7]
    lines:
      - ar: "كنت يتيم… فضمّك ورعاك."
        en: "You were an orphan… and He sheltered you and cared for you."
      - ar: "ما كنتش تعرف الكتاب ولا الإيمان… فعلّمك."
        en: "You knew neither the Book nor faith… and He taught you."
      - ar: "وكنت فقير… فبعتلك رزقك وغنّى قلبك بالقناعة."
        en: "And you were poor… and He sent you your provision and made your heart rich with contentment."
  - narration: depth
    scene: day
    sources: [tafsir.saadi.93.8]
    lines:
      - ar: "اللي شال عنك ده كله زمان… هيشيل عنك اللي إنت فيه دلوقتي."
        en: "The One who lifted all that from you then… will lift what you are in now."
      - ar: "وإحنا كده: أول ما حاجة تتأخر… نقول ربنا سابنا."
        en: "And that's us: the moment something is late… we say God has left us."
  - narration: example
    scene: night
    lines:
      - ar: "زي دعوة بتدعيها من شهور… ولسه ما جاتش."
        en: "Like a prayer you have been making for months… that still hasn't come."
  - narration: close
    scene: dawn
    lines:
      - ar: "اتأخر عليك… بس ما سابكش."
        en: "It is late for you… but He has not left you."
      - ar: "لما تحس إنك لوحدك… عدّ اللي عمله معاك قبل كده."
        en: "When you feel alone… count what He has done for you before."
      - ar: "دي سورة ردّت على كلمة… وفيه آية نزلت لناس… عملوا أكبر الذنوب وجم يسألوا."
        en: "That surah answered a remark… and there is a verse that came down for people… who had done the gravest sins and came to ask."
      - ar: "تابعنا عشان تعرف حكايتها."
        en: "Follow us to hear its story."
