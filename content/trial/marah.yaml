    - { verse: quran.31.18, from: 10, to: -1, en: "indeed, Allah does not like everyone self-deluded and boastful", right: true }
    - { verse: quran.2.190, from: -5, to: -1, en: "indeed, Allah does not like transgressors", note: { ar: "البقرة 190", en: "al-Baqarah 190" } }
publish:
  title: { en: "Luqman's advice… how did it end?", ar: "وصية لقمان… خلصت بإيه؟" }
  part: 8
  hashtags: ["#سورة_لقمان", "#وصايا_لقمان"]
  hook:      # légende courte de Facebook et Instagram ; proposée par la session, validée par le propriétaire le 2026-11-19 (« je valide les 7 textes »)
    ar: "نفس الجملة في سورتين… وكل مرة خلصت بحاجة مختلفة. وصية لقمان خلصت بإيه؟ معاك 5 ثواني."
    en: "The same sentence in two surahs… each time with a different ending. How did Luqman's advice end? You have 5 seconds."
    validated: 2026-11-19
  description:
    en: "\"Do not walk upon the earth exultantly\" is in Luqman's advice to his son (31:18) and in al-Isra' (17:37), with two endings. \"Marah\" is not joy: it is walking with pride and showing off (al-Muyassar, as-Sa'di)."
    ar: "«ولا تمش في الأرض مرحا» في وصية لقمان (لقمان 18) وفي سورة الإسراء (الإسراء 37)، بنهايتين مختلفتين. والمرح هنا مش الفرح: ده المشي بتكبّر وتباهي."
segments:
  - narration: ask
    silent: true
    hold: 6.8
    at_once: true
    scene: ask
    sfx: [[count, 0], [impact, 5.0]]
    lines:
      - ar: "في وصية لقمان لابنه… كمّلها بإيه؟"
        en: "In Luqman's advice to his son… how does it go on?"
  - verse: quran.31.18
    scene: listen
  - narration: meaning
    scene: meaning
    sources: [tafsir.muyassar.31.18, tafsir.saadi.31.18]
    lines:
      - ar: "المرح هنا مش الفرح… ده إنك تمشي متكبّر ومتباهي."
        en: "\"Marah\" here isn't joy… it's walking proud and showing off."
  - narration: lesson
    scene: lesson
    sources: [tafsir.muyassar.31.18]
    lines:
      - ar: "ونفس الجملة جت في سورة الإسراء… بس خلصت بإنك مش هتخرق الأرض، ولا هتطول الجبال."
        en: "The same sentence comes in al-Isra'… but it ends: you won't tear the earth, nor reach the mountains in height."
  - narration: check
    scene: check
    sources: [tafsir.muyassar.31.18, tafsir.saadi.31.18]
    lines:
      - ar: "هناك: إنت صغير قدّام خلق ربنا… وهنا: ربنا ما بيحبش المتكبّر اللي بيتفاخر."
        en: "There: you are small before God's creation… here: God does not love the proud boaster."
  - narration: close
    scene: close
    lines:
      - ar: "وإنت… تعرف حد متواضع بجد؟ إيه اللي بيعمله؟"
        en: "And you… do you know someone truly humble? What does he do?"
      - ar: "والسؤال الجاي: جملة اتقالت وقت رحيل… مين قالها؟ تابعنا."
        en: "Next question: a sentence said at a departure… who said it? Follow us."
