# « آية وحكايتها », short 4 (content/trial/ayah.yaml, docs/themes.md) : An-Nur 24:22. Choisi par la session à la
# demande du propriétaire (2026-11-15 : « choisis le verset pour آية وحكايتها 4 », puis « oui, commence le script »).
# Le fait : Abou Bakr faisait vivre Mistah « لقرابته منه وفقره » ; après ce que Mistah avait dit d'Aïcha, et une fois
# son innocence descendue, il jure « والله لا أنفق على مسطح شيئا أبدا » ; 24:22 descend ; il dit « بلى والله إني أحب
# أن يغفر الله لي », lui rend sa pension et jure « والله لا أنزعها منه أبدا » (Bukhari 4750 ; as-Sa'di le raconte).
# - L'accusation n'est ni nommée ni racontée : « اتكلموا على بنته… كلام كذب » ; son innocence est dite (« وربنا نزّل
#   براءتها في القرآن » : « فلما أنزل الله هذا في براءتي », dans le même hadith). Mistah n'est pas nommé : « قريبه ».
# - Les mots d'Abou Bakr sont dits par la narration avec les siens (« أيوه والله… أنا بحب إن ربنا يغفرلي ») : ce
#   ne sont pas des paroles du Prophète ﷺ ; la référence s'écrit à l'écran.
# - Le sens (al-Muyassar) : que les gens de mérite et d'aisance ne jurent pas de couper le bien à leurs proches pauvres
#   « بسبب ذنب فعلوه » ; qu'ils passent sur leur faute et ne les punissent pas ; « ألا تحبون أن يتجاوز الله عنكم؟
#   فتجاوزوا عنهم ».
# - La leçon (as-Sa'di) : « إذا عاملتم عبيده بالعفو والصفح عاملكم بذلك » ; « لا تترك النفقة والإحسان بمعصية
#   الإنسان ».
# - Les deux serments face à face (« حلف مرتين… ») : Ibn Kathir, « في مقابلة ما كان قال ». Répliques de la session sans
#   tafsir : « وإحنا… بنعدّ اللي عملوه فينا… » (ce qu'on ne voit pas),
#   l'exemple (une scène type : un mot dit en ton absence, jamais un mal qui continue).
# - LIGNE D'AVERTISSEMENT, jamais coupée (idée du propriétaire, 2026-11-15 : « مش معناها إن نسامح إننا نسكت على الغلط
#   لو تكرر ») : « فالمسامحة على اللي فات… مش سكوت على الغلط لو اتكرر. », avec la réplique qui la fonde sur le récit.
#   Ibn Kathir : le pardon porte « عما تقدم منهم من الإساءة والأذى » ; il est venu après l'innocence descendue, quand
#   celui qui avait parlé s'était repenti et avait reçu sa peine (« تاب الله عليه منها، وضرب الحد عليها »). Elle dit « ne
#   pas se taire », jamais « ne plus pardonner » : al-Muyassar lit dans le verset le pardon « ولو قوبل بالإساءة ».
#   Retirées pour la place : « والجرح ما كانش صغير… كان في بنته », « يسامحهم… ويعدّيها ».
# - Images (personne, rien de l'invisible) : `cut` deux maisons sous la lune, la bourse à la porte de la première, le
#   chemin coupé, la seconde éteinte ; `back` le chemin se referme, la bourse va, la fenêtre s'allume ; `whole` tout
#   est rendu. Dessins : video/src/trial/Trial.tsx (ForgivePicture), video/src/trial/Ayah.tsx (Purse, Track).
# - La dernière réplique : l'appel générique (l'épisode 5 n'est pas choisi ; skill write-hook).
