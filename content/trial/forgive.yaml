publish:
  title: { en: "He swore to cut off his relative… and a verse came down", ar: "حلف يقطع قريبه… فنزلت آية" }
  part: 4
  hashtags: ["#صلة_الرحم", "#التسامح"]
  description:
    en: "Abu Bakr as-Siddiq used to provide for a poor relative. That relative spoke lies against his daughter, and Abu Bakr swore never to give him anything again. Then a verse came down, and he answered: yes, by God, I love that God should forgive me… and gave it back to him."
    ar: "أبو بكر الصديق رضي الله عنه كان بيصرف على قريبه الفقير… وقريبه اتكلم على بنته كلام كذب، فحلف ما يدّيلوش حاجة تاني. ونزلت آية… فقال: أيوه والله، أنا بحب إن ربنا يغفرلي، ورجّعله اللي كان بيدّيهوله."
  hook:      # légende courte de Facebook, Instagram et TikTok (format choisi par le propriétaire le 2026-11-15) ; proposée, pas encore validée
    ar: "حلف ما يدّيلوش حاجة تاني… ونزلت آية."
    en: "He swore never to give him anything again. Then a verse came down."
segments:
  - narration: open
    scene: cut
    sources: [hadith.bukhari.4750]
    lines:
      - ar: "أبو بكر الصديق رضي الله عنه حلف… ما يصرفش تاني على قريبه الفقير! ليه؟"
        en: "Abu Bakr as-Siddiq swore… never again to provide for his poor relative! Why?"
      - ar: "قريبه ده… كان من اللي اتكلموا على بنته… كلام كذب، وربنا نزّل براءتها في القرآن."
        en: "That relative… was among those who spoke against his daughter… lies, and God sent down her innocence in the Quran."
      - ar: "وساعتها نزلت آية… لكل واحد فينا حد من أهله جرحه."
        en: "And then a verse came down… for every one of us who was hurt by someone of their own family."
  - verse: quran.24.22
    scene: cut
  - narration: meaning
    scene: cut
    sources: [tafsir.muyassar.24.22]
    lines:
      - ar: "يعني: اللي ربنا وسّع عليه… ما يحلفش يقطع خيره عن قرايبه المحتاجين… عشان غلطة عملوها."
        en: "Meaning: whoever God has given plenty… should not swear to cut off his kindness to relatives in need… over a wrong they did."
      - ar: "مش بتحب ربنا يسامحك؟ سامحهم."
        en: "Don't you love for God to forgive you? Then forgive them."
  - narration: answer
    scene: back
    sources: [hadith.bukhari.4750]
    lines:
      - ar: "أبو بكر سمعها… وقال: أيوه والله… أنا بحب إن ربنا يغفرلي."
        en: "Abu Bakr heard it… and said: yes, by God… I do love for God to forgive me."
      - ar: "ورجّع لقريبه اللي كان بيدّيهوله… وحلف تاني: عمري ما هقطعه عنه."
        en: "He gave his relative back what he used to give him… and swore again: I will never take it from him."
  - narration: depth
    scene: back
    sources: [tafsir.ibn-kathir.24.22, tafsir.saadi.24.22]
    lines:
      - ar: "حلف مرتين… الأولى عشان الجرح… والتانية عشان ربنا يسامحه."
        en: "He swore twice… the first time for his wound… the second so that God would forgive him."
      - ar: "اللي يسامح عباد ربنا… ربنا يسامحه."
        en: "Whoever forgives God's servants… God forgives him."
      - ar: "وإحنا… بنعدّ اللي عملوه فينا… وناسيين إننا كمان محتاجين مسامحة."
        en: "And us… we count what they did to us… and forget that we too need forgiving."
  - narration: example
    scene: cut
    sources: [tafsir.saadi.24.22]
    lines:
      - ar: "زي قريب اتكلم عليك في غيابك… والكلام وصلك."
        en: "Like a relative who spoke about you behind your back… and the words reached you."
      - ar: "فتقول: خلاص… لا هكلّمه… ولا هقف جنبه تاني."
        en: "And you say: that's it… I won't speak to him… or stand by him again."
      - ar: "ما تقطعش خيرك عنه… عشان غلطة."
        en: "Don't cut your kindness off from him… over one wrong."
  - narration: limit
    scene: cut
    sources: [tafsir.ibn-kathir.24.22]
    lines:
      - ar: "وأبو بكر سامح بعد ما الحق اتقال… واللي غلط اتحاسب وتاب."
        en: "And Abu Bakr forgave after the truth had been told… and the one who did wrong had been held to account and repented."
      - ar: "فالمسامحة على اللي فات… مش سكوت على الغلط لو اتكرر."
        en: "So forgiving what is past… is not keeping silent about a wrong if it happens again."
  - narration: close
    scene: whole
    lines:
      - ar: "عايز ربنا يسامحك؟ سامح."
        en: "Want God to forgive you? Forgive."
      - ar: "ولما تحلف تقطع حد من أهلك… افتكر أبو بكر."
        en: "And when you swear to cut off someone of your family… remember Abu Bakr."
      - ar: "تابعنا عشان الآية الجاية وحكايتها."
        en: "Follow us for the next verse and its story."
