publish:
  title: { en: "They left their city… and hid in a cave!", ar: "سابوا مدينتهم… واستخبّوا في كهف!" }
  part: 1
  hashtags: ["#الثبات", "#قصص_القرآن"]
  description:
    en: "Young men left their city and their homes to hide in a cave, because their people wanted to force them to worship idols. They went in with a single prayer. They did their part, and asked God for the rest."
    ar: "شباب سابوا مدينتهم وبيوتهم واستخبّوا في كهف، عشان قومهم كانوا عايزين يجبروهم يعبدوا أصنام. ودخلوا بدعوة واحدة… عملوا اللي عليهم، وطلبوا الباقي من ربنا."
  hook:      # légende courte de Facebook, Instagram et TikTok : proposée, à valider par le propriétaire
    ar: "سابوا مدينتهم… واستخبّوا في كهف بدعوة واحدة."
    en: "They left their city… and hid in a cave with a single prayer."
segments:
  - narration: open
    scene: leave
    sources: [tafsir.muyassar.18.10]
    lines:
      - ar: "شباب هربوا بدينهم لكهف… ومعاهمش غير دعوة واحدة. قالوا إيه؟"
        en: "Young men fled to a cave with their faith… with nothing but a single prayer. What did they say?"
      - ar: "قومهم كانوا عايزين يجبروهم يعبدوا أصنام… فسابوا مدينتهم وبيوتهم."
        en: "Their people wanted to force them to worship idols… so they left their city and their homes."
      - ar: "ودعوتهم دي… لكل واحد حاسس إنه لوحده."
        en: "And that prayer of theirs… is for anyone who feels alone."
  - verse: quran.18.10
    scene: cave
  - narration: meaning
    scene: cave
    sources: [tafsir.muyassar.18.10]
    lines:
      - ar: "طلبوا من ربنا رحمة… تثبّتهم وتحفظهم… وإنه يدلّهم على الطريق الصح."
        en: "They asked God for mercy… to keep them firm and safe… and to show them the right path."
  - narration: depth
    scene: cave
    sources: [tafsir.saadi.18.10]
    lines:
      - ar: "عملوا اللي عليهم: بعدوا عن الفتنة… وطلبوا الباقي من ربنا."
        en: "They did their part: they got away from those who would turn them from their faith… and asked God for the rest."
      - ar: "ما اعتمدوش على نفسهم… ولا على حد. وعشان كده… ربنا استجاب لهم."
        en: "They relied neither on themselves… nor on anyone. And that is why… God answered them."
  - narration: example
    scene: cave
    lines:
      - ar: "زي لما تبقى الوحيد في الشلة… اللي رافض حاجة غلط."
        en: "Like being the only one in your group… saying no to something wrong."
      - ar: "ابعد خطوة… واطلب من ربنا يثبّتك."
        en: "Step away… and ask God to keep you firm."
  - narration: close
    scene: dawn
    lines:
      - ar: "ولما تحس إنك لوحدك… ادعي بدعوتهم: سورة الكهف، آية عشرة."
        en: "And when you feel alone… pray their prayer: Surat al-Kahf, verse ten."
      - ar: "دخلوا الكهف… وناموا. واللي حصل وهما نايمين… أغرب."
        en: "They went into the cave… and slept. And what happened while they slept… is stranger."
      - ar: "تابعنا عشان تعرف بقية القصة."
        en: "Follow us to find out the rest of the story."
