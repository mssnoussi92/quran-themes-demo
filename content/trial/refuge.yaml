# Les gens de la caverne (film `kahf`), short 1 : la fuite et leur du'a (18:10). Version courte, choisie par le
# propriétaire le 2026-11-15 (« la caverne, version courte » ; « oui, ce plan ») : un verset court par short, environ 60 à
# 75 s, une image qui bouge dès la première seconde ; le reste de l'histoire va au film, pour YouTube. Pourquoi : les
# premières mesures (docs/retention.md, 2026-11-15) : sur Facebook et Instagram, on part au bout de 4 à 8 s.
# - La question d'abord (propriétaire, 2026-11-15 : « la question la plus forte d'abord ») : celle à laquelle le verset
#   répond, ce qu'ils ont dit dans leur seule du'a.
# - Le fait : ils quittent leur ville pour une caverne ; pourquoi (al-Muyassar : « خشية من فتنة قومهم لهم، وإرغامهم على
#   عبادة الأصنام ») ; ce qu'ils demandent (al-Muyassar : « رحمة، تثبتنا بها، وتحفظنا من الشر، ويسِّر لنا الطريق الصواب »).
# - La leçon (as-Sa'di) : « فجمعوا بين السعي والفرار من الفتنة… وبين تضرعهم وسؤالهم لله… وعدم اتكالهم على أنفسهم وعلى
#   الخلق، فلذلك استجاب الله دعاءهم ».
# - Répliques de la session sans tafsir : l'exemple (une scène type), la phrase à retenir, l'annonce du short 2.
# - La du'a n'est pas dite par notre voix : la réplique donne sa référence (« سورة الكهف، آية عشرة »).
# - Images (personne, jamais les jeunes ; rien de l'invisible) : `leave` la ville la nuit derrière, des traces de pas qui
#   s'en éloignent vers la colline ; `cave` les traces entrent dans la caverne ; `dawn` le jour se lève sur l'entrée.
