# Adhkar à lire, sans voix, à enregistrer (demande du propriétaire, 2026-11-17 ; script validé par lui le même jour :
# docs/scripts/adhkar-cards.md). Chaque dhikr est une carte (`card:`) : ses mots pris dans le registre (une partie du
# hadith, son extrait), sa référence, sa traduction, le nombre de fois (nos mots) ; personne ne le lit, l'ambiance continue
# dessous. Les sourates sont récitées par Tawfiq (jamais d'ambiance sous elles). Nos lignes : l'ouverture, la fin, les
# étiquettes et les nombres. Clip et ambiance choisis par lui (le clip) ou proposés (l'ambiance, une de celles qu'il a validées).
id: sabah
# « Je valide les trois » du propriétaire (2026-11-17, question à choix nommant les trois vidéos envoyées, rendues par le
# workflow `film`, run 44192660389) : les cartes, les nombres, le clip, l'ambiance, la couverture, et les seize hadiths
# proposés au registre. Le script l'était le même jour. Les textes à coller restent à valider. Inscrit sur sa parole.
script_validated: { by: mssnoussi92, on: 2026-11-17 }
validated: { by: mssnoussi92, on: 2026-11-18, what: [montage, cover, ambience, publish] }   # la vidéo le 2026-11-17 (« je valide les trois »), ses textes YouTube le 2026-11-18
handle: "@quran_words_daily"
voices: { X: "no voice: the adhkar are written to be read" }
clip: { source: pixabay, id: 2119, author: bellergy, page: "https://pixabay.com/videos/id-2119/", take: { slow: 5, height: 1440 }, rate: 1, position: "50% 50%", shift: 0, brightness: 0.65, ground: "#07060b", horizon: 1330 }
ambience: { source: bigsoundbank, id: "0659", title: "Wind in a Tree", author: Joseph Sardin, licence: CC0, page: "https://bigsoundbank.com/wind-in-a-tree-s0659.html", from: 5, seconds: 110, level: -37 }
cover: { scene: sky, title: "أذكار الصباح", tag: "من البخاري ومسلم والترمذي", focus: 1000 }
publish:
  title: { en: "Morning adhkar, from Bukhari, Muslim, Tirmidhi", ar: "أذكار الصباح… من البخاري ومسلم والترمذي" }
  part: 2
  hashtags: ["#أذكار_الصباح"]
  hook:      # légende courte de Facebook, Instagram et TikTok ; proposée par la session, validée par le propriétaire le 2026-11-17 (question à choix : « je valide les trois »)
    ar: "أذكار الصباح… من البخاري ومسلم والترمذي بس. احفظها وارجعلها بكرة الصبح."
    en: "Morning adhkar, only from al-Bukhari, Muslim and at-Tirmidhi. Save it for tomorrow morning."
    validated: 2026-11-17
  description:
    ar: "أذكار الصباح، من أحاديث صحيحة وحسنة بس: البخاري ومسلم والترمذي، كل ذكر بمصدره وعدد مراته. احفظ الفيديو وارجعله كل صباح."
    en: "The morning adhkar, only from hadiths graded sahih or hasan (al-Bukhari, Muslim, at-Tirmidhi), each with its source and how many times. Save it and come back to it every morning."
segments:
  - narration: open
    silent: true
    hold: 5.5
    scene: sky
    lines:
      - ar: "أذكار الصباح… من البخاري ومسلم والترمذي."
        en: "Morning adhkar… from al-Bukhari, Muslim and at-Tirmidhi."
      - ar: "احفظ الفيديو… وارجعله كل صباح."
        en: "Save this video… and come back to it every morning."
  - card: hadith.bukhari.6306
    part: sayyid
    scene: sky
    count: "مرة واحدة"
  - card: hadith.tirmidhi.3391
    part: sabah
    scene: sky
    count: "مرة واحدة"
  - card: hadith.tirmidhi.3392
    part: alim
    scene: sky
    count: "مرة واحدة"
  - card: hadith.tirmidhi.3388
    part: bismillah
    scene: sky
    count: "3 مرات"
  - card: hadith.muslim.2726a
    part: kalimat
    scene: sky
    count: "3 مرات"
  - card: hadith.muslim.2692
    part: subhan
    scene: sky
    count: "100 مرة"
  - card: hadith.bukhari.3293
    part: tahlil
    scene: sky
    count: "100 مرة في اليوم"
  - card: hadith.tirmidhi.3575
    part: qul
    scene: sky
    count: "3 مرات"
  - verses: [quran.112.1, quran.112.2, quran.112.3, quran.112.4]
    scene: sky
  - verses: [quran.113.1, quran.113.2, quran.113.3, quran.113.4, quran.113.5]
    scene: sky
  - verses: [quran.114.1, quran.114.2, quran.114.3, quran.114.4, quran.114.5, quran.114.6]
    scene: sky
  - narration: close
    silent: true
    hold: 4
    scene: sky
    lines:
      - ar: "احفظه… وارجعله بكرة الصبح."
        en: "Save it… and come back to it tomorrow morning."
