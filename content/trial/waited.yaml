# Le du'a dans le modèle, short 3 (2026-11-11, docs/themes.md) : « j'ai demandé et rien n'est venu ». Le fait :
# Zakariya, vieux, qui demande encore et dit n'avoir jamais été déçu en demandant (Maryam 19:4), et la réponse
# (Al-Anbiya 21:89-90) ; puis Bukhari 6340 (exaucé tant qu'on ne se hâte pas). Une idée par short : Tirmidhi 3573
# (donné, ou un mal écarté) est dit dans le film seulement.
# - Rien n'est dit de son âge au-delà du verset (les os affaiblis, la tête blanche) ; aucune durée.
# - « عمري ما دعيتك ورجعت خايب » : le sens de la fin de 19:4, dit après le verset (al-Sa'di : Tu ne m'as
#   jamais renvoyé déçu ni privé de réponse).
# - L'exemple (la graine qu'on déterre chaque jour) est une scène type, bâtie sur le hadith : ce qui perd une
#   demande, c'est la hâte, pas le retard.
# - Dernier short : il résume les trois raisons de se taire, puis l'appel à suivre que le propriétaire a
#   validé pour le dernier short de Moussa et al-Khadir. Ce qu'il promet (« القصة الجاية ») est à lui de tenir.
# - `kept` : réplique validée de l'ancien épisode, sans ses guillemets ; les autres sont de l'IA.
# Rien n'est validé : le propriétaire lit le script avant toute voix.
id: waited
handle: "@quran_words_daily"
clip: { source: pixabay, id: 29238, author: Dans4, page: "https://pixabay.com/videos/id-29238/", position: "48.6% 50%", shift: 520, brightness: 0.95, ground: "#050a14", landscape: { side: right, horizon: 770, brightness: 0.95 } }
voices: { D: "Gemini 3.8 Flash TTS, Algieba", V: "VoiceTut, Mohammed", X: "draft, no voice yet" }
text: 32-trial-waited
# Ambiance sous la narration, jamais sous un verset ni un hadith : un des trois enregistrements validés par le
# propriétaire sur le premier film (docs/model.md, « Ambiances »).
ambience: { source: bigsoundbank, id: "1880", title: "Campaign at Night #4", author: Joseph Sardin, licence: CC0, page: "https://bigsoundbank.com/campaign-at-night-4-s1880.html", from: 20, seconds: 80, level: -38 }
# Couverture et textes de publication, proposés (à valider avec les vidéos ; le titre, avec le script).
cover: { scene: niche, title: "شاب… وما بطّلش يدعي", tag: "الدعاء · ٣ من ٣", focus: 1230 }
publish:
  title: { en: "He grew old… and never stopped asking", ar: "شاب… وما بطّلش يدعي" }
  part: 3
  description:
    en: "I asked and nothing happened. Zechariah, peace be upon him, was old, his hair white, and still asking: never, he said, had he been disappointed in calling on his Lord. What loses a du'a is not the delay, it is the hurry."
    ar: "دعيت… وما حصلش حاجة. سيدنا زكريا عليه السلام كان كبير، راسه شابت، ولسه بيدعي… وقال إنه عمره ما رجع من دعاء ربنا خايب. اللي بيضيّع الدعاء مش التأخير… الاستعجال."
segments:
  - narration: open
    scene: niche
    lines:
      - ar: "راسه شابت… وعضمه ضعف… ولسه بيدعي! ليه ما بطّلش؟"
        en: "His hair had turned white… his bones were weak… and still he asked! Why didn't he stop?"
      - ar: "ده سيدنا زكريا عليه السلام… وإنت دعيت… وقلت: ما حصلش حاجة."
        en: "That was Zechariah, peace be upon him… and you asked… and said: nothing happened."
  - verse: quran.19.4
    scene: niche
  - narration: never
    scene: niche
    lines:
      - ar: "بيقول: يا رب… عمري ما دعيتك ورجعت خايب."
        en: "He is saying: my Lord… never have I called on You and come back empty-handed."
      - ar: "وربنا رد عليه؟"
        en: "And did God answer him?"
  - verse: quran.21.89
    scene: niche
  - verse: quran.21.90
    scene: two
  - narration: meaning
    scene: two
    lines:
      - ar: "استجاب له… وادّاله يحيى… وهو في السن ده."
        en: "He answered him… and gave him John… at that age."
      - ar: "والنبي صلى الله عليه وسلم قال:"
        en: "And the Prophet ﷺ said:"
  - reading: hadith.bukhari.6340
    scene: two
  - narration: haste
    scene: two
    lines:
      - ar: "يعني متستعجلش… ومتقولش دعيت ومحدش رد."
        en: "So don't rush… and don't say “I prayed and got no answer.”"
        kept: dua.answer-haste
  - narration: depth
    scene: far
    lines:
      - ar: "اللي بيضيّع الدعاء… مش التأخير. الاستعجال."
        en: "What loses a du'a… is not the delay. It is the hurry."
  - narration: example
    scene: sky
    lines:
      - ar: "زي اللي زرع بذرة… وكل يوم يحفر يشوفها طلعت ولا لأ."
        en: "Like one who planted a seed… and digs it up every day to see if it has sprouted."
      - ar: "التأخير ما موّتهاش… استعجاله هو اللي موّتها."
        en: "The delay did not kill it… his hurry did."
  - narration: close
    scene: two
    lines:
      - ar: "لما تقول دعيت وما حصلش… افتكر سيدنا زكريا: شاب… وما بطّلش."
        en: "When you say: I asked and nothing happened… remember Zechariah: he grew old… and never stopped."
      - ar: "تلات حاجات بتسكّتنا… وتلات نداءات في القرآن بتردّ عليها."
        en: "Three things keep us silent… and three calls in the Quran answer them."
      - ar: "تابعنا عشان القصة الجاية."
        en: "Follow us for the next story."
