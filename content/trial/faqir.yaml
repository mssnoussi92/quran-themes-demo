# « معاك 5 ثواني », page test, quiz 12 (content/trial/ma3ak.yaml ; script : docs/scripts/quiz.md) : qui l'a dit.
# « رَبِّ إِنِّى لِمَآ أَنزَلْتَ إِلَىَّ مِنْ خَيْرٍ فَقِيرٌ » (28:24) : Moussa à Madyan, affamé et seul, après avoir abreuvé le
# troupeau des deux femmes (al-Muyassar, as-Sa'di, Ibn Kathir) ; les deux autres choix, de vraies prières de détresse :
# Ayyoub (21:83) et Younous (21:87). Rien n'est dessiné de Moussa ni des deux femmes : un puits, des moutons, l'ombre
# d'un arbre. Script écrit par la session le 2026-11-18.
id: faqir
# « Je valide les 7 scripts » du propriétaire (2026-11-18, question à choix nommant les sept quiz du lot de la page test
# et leurs répliques, choix et dessins) : inscrit sur sa parole. Ni la voix, ni les images, ni les textes à coller.
script_validated: { by: mssnoussi92, on: 2026-11-18 }
handle: "@ma3ak.5.thawani"
voices: { D: "Gemini 3.8 Flash TTS, Algieba", X: "draft, no voice yet" }
text: 100-trial-faqir
# des dunes de jour, un drone qui avance (Pixabay 16139, AcornStudioSpain, approuvé pour la caravane et pour la huppe) :
# le désert de Madyan à midi ; PROPOSÉ pour ce short, à montrer au propriétaire sur le brouillon muet
clip: { source: pixabay, id: 16139, author: AcornStudioSpain, page: "https://pixabay.com/videos/id-16139/", take: { slow: 5, height: 1440 }, rate: 1, position: "50% 50%", shift: 0, brightness: 0.8, ground: "#0b0907", horizon: 1380, veil: 0.8 }
ambience: { source: bigsoundbank, id: "0659", title: "Wind in a Tree", author: Joseph Sardin, licence: CC0, page: "https://bigsoundbank.com/wind-in-a-tree-s0659.html", from: 10, seconds: 60, level: -36 }
cover: { scene: ask, title: "مين دعا الدعوة دي؟", tag: "معاك 5 ثواني", focus: 1000 }
quiz:
  head: { verse: quran.28.24, from: 8, to: -1 }       # « رَبِّ إِنِّى لِمَآ أَنزَلْتَ إِلَىَّ مِنْ خَيْرٍ فَقِيرٌ »
  choices:
    - { ar: "سيدنا موسى بعد ما سقى للبنتين", en: "Moses, after watering the two women's flock", right: true }
    - { ar: "سيدنا أيوب في مرضه", en: "Job, in his illness", note: { ar: "دعاؤه · الأنبياء 83", en: "his prayer, al-Anbiya' 83" } }
    - { ar: "سيدنا يونس في بطن الحوت", en: "Jonah, in the whale's belly", note: { ar: "دعاؤه · الأنبياء 87", en: "his prayer, al-Anbiya' 87" } }
publish:
  title: { en: "Who made this prayer?", ar: "مين دعا الدعوة دي؟" }
  part: 12
  hashtags: ["#سورة_القصص", "#دعاء"]
  hook:      # légende courte de Facebook et Instagram ; proposée par la session, à valider
    ar: "«رب إني لما أنزلت إلي من خير فقير»… نبي قالها وهو جعان ولوحده. مين؟ معاك 5 ثواني."
    en: "\"My Lord, I am in need of whatever good You send me\"… a prophet said it, hungry and alone. Who? You have 5 seconds."
  description:
    en: "\"My Lord, indeed I am, for whatever good You would send down to me, in need\" (28:24): Moses at Midian, hungry and alone, after watering the two women's flock without asking for a wage (al-Muyassar, as-Sa'di). Relief came at once (28:25)."
    ar: "«رب إني لما أنزلت إلي من خير فقير» (القصص 24): دعا بيها سيدنا موسى في مدين، جعان ولوحده، بعد ما سقى للبنتين من غير ما يطلب أجر… وعلى طول جاله الفرج (القصص 25)."
segments:
  - narration: ask
    silent: true
    hold: 6.8
    scene: ask
    sfx: [[count, 0], [impact, 5.0]]
    lines:
      - ar: "مين دعا الدعوة دي… وإمتى؟"
        en: "Who made this prayer… and when?"
  - verse: quran.28.24
    scene: listen
  - narration: meaning
    scene: meaning
    sources: [tafsir.muyassar.28.24, tafsir.ibn-kathir.28.24]
    lines:
      - ar: "سيدنا موسى كان هربان من فرعون… ماشي من مصر لمدين… جعان ولوحده."
        en: "Moses was fleeing Pharaoh… walking from Egypt to Midian… hungry and alone."
  - narration: lesson
    scene: lesson
    sources: [tafsir.saadi.28.24]
    lines:
      - ar: "ساعد البنتين وسقى لهم من غير ما يطلب أجر… وبعدين قعد في الضل ودعا."
        en: "He helped the two women and watered their flock without asking for a wage… then he sat in the shade and prayed."
  - narration: check
    scene: check
    sources: [tafsir.muyassar.28.24, tafsir.saadi.28.24]
    lines:
      - ar: "ما طلبش حاجة معيّنة… قال: أنا محتاج لأي خير تبعتهولي… وعلى طول جاله الفرج."
        en: "He didn't ask for anything specific… he said: I need any good You send me… and relief came at once."
  - narration: close
    scene: close
    lines:
      - ar: "وإنت… إيه الدعوة اللي بتقولها لما تحس إنك محتاج؟"
        en: "And you… what prayer do you say when you feel in need?"
      - ar: "والسؤال الجاي: كلمة في قصة سيدنا موسى وهو رضيع… تفتكر معناها إيه؟ تابعنا."
        en: "Next question: a word in the story of Moses as a baby… what do you think it means? Follow us."
