# « معاك 5 ثواني », short 2 (content/trial/quiz.yaml ; script : docs/scripts/quiz.md) : la fin d'un verset. Après « وإن تغفر
# لهم », 5:118 finit par « العزيز الحكيم » : un pardon qui vient de la puissance, pas de la faiblesse (as-Sa'di). Les
# choix sont pris dans des versets du registre (39:53, 5:118, 2:127) ; un mauvais choix n'est jamais écrit dans le verset.
# La scène est une parole du Jour du Jugement (5:116-118) : jamais figurée, une nuit seulement. Script écrit par la
# session le 2026-11-17.
id: khatima
# « Je valide » du propriétaire (2026-11-17, question à choix nommant le script des shorts 1 et 2 de docs/scripts/quiz.md) :
# les répliques, la question, les choix. Ni la voix, ni les images, ni les textes à coller. Inscrit sur sa parole.
script_validated: { by: mssnoussi92, on: 2026-11-17 }
handle: "@quran_words_daily"
voices: { D: "Gemini 3.8 Flash TTS, Algieba", X: "draft, no voice yet" }
text: 87-trial-khatima
# la nuit générée, choisie par le propriétaire le 2026-11-17 (la scène, au Jour du Jugement, n'est jamais figurée)
clip: { source: generated, kind: night, seconds: 20, rate: 1, position: "50% 50%", shift: 0, brightness: 1, ground: "#02040b", horizon: 1380, veil: 0.6 }
ambience: { source: bigsoundbank, id: "1880", title: "Campaign at Night #4", author: Joseph Sardin, licence: CC0, page: "https://bigsoundbank.com/campaign-at-night-4-s1880.html", from: 20, seconds: 60, level: -38 }
cover: { scene: ask, title: "تفتكر الآية دي خلصت بإيه؟", tag: "معاك 5 ثواني · 2", focus: 1000 }
quiz:
  head: { verse: quran.5.118, from: 5, to: 9 }        # « وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ », puis la fin en blanc
  blank: { verse: quran.5.118, from: 10, to: 11 }     # ce qui remplit le blanc à la réponse : la bonne fin seulement
  choices:
    - { verse: quran.39.53, from: -2, to: -1, en: "the Forgiving, the Merciful" }
    - { verse: quran.5.118, from: 10, to: 11, en: "the Almighty, the Wise", right: true }
    - { verse: quran.2.127, from: -2, to: -1, en: "the Hearing, the Knowing" }
publish:
  title: { en: "How do you think this verse ends?", ar: "تفتكر الآية دي خلصت بإيه؟" }
  part: 2
  hashtags: ["#سورة_المائدة", "#أسماء_الله_الحسنى"]
  hook:      # légende courte de Facebook, Instagram et TikTok ; proposée par la session, validée par le propriétaire le 2026-11-17 (« je valide les 3 accroches »)
    ar: "آية فيها كلام عن المغفرة… تفتكر خلصت بإيه؟ الإجابة مش اللي متوقعها."
    en: 'A verse about forgiveness… how do you think it ends? Not what you''d expect.'
    validated: 2026-11-17
  description:
    en: "After \"and if You forgive them\", you would expect \"the Forgiving, the Merciful\". The verse (5:118) ends with \"the Almighty, the Wise\": as-Sa'di explains a forgiveness that comes from full power, not from weakness, and given with wisdom."
    ar: "آية فيها كلام عن المغفرة… والطبيعي نستنى آخرها «غفور رحيم». بس الآية (المائدة 118) خلصت بـ«العزيز الحكيم»: مغفرة عن قدرة، مش عن عجز."
segments:
  - narration: ask
    silent: true
    hold: 6.8
    scene: ask
    sfx: [[count, 0], [impact, 5.0]]
    lines:
      - ar: "تفتكر الآية خلصت بإيه؟"
        en: "How do you think the verse ends?"
  - verse: quran.5.118
    scene: listen
  - narration: meaning
    scene: meaning
    sources: [tafsir.saadi.5.118]
    lines:
      - ar: "دي كلمة سيدنا عيسى عليه السلام لربنا… عن الناس."
        en: "These are the words of Jesus, peace be upon him, to God… about people."
      - ar: "العزيز… بيغفر وهو قادر، مش عن عجز."
        en: "The Almighty… forgives with full power, not out of weakness."
      - ar: "والحكيم… بيغفر للي عمل أسباب المغفرة."
        en: "And the Wise… forgives the one who did what brings forgiveness."
  - narration: close
    scene: close
    lines:
      - ar: "وإنت… فيه آية خلصت بغير اللي كنت متوقعه؟"
        en: "And you… is there a verse that ended differently from what you expected?"
      - ar: "والسؤال الجاي: جملة في القرآن… مين قالها؟ تابعنا."
        en: "Next question: a sentence in the Quran… who said it? Follow us."
