# Le film long de l'essai (2026-11-11, docs/retention.md) : toute l'histoire de Moussa et d'al-Khadir en une
# vidéo 16:9 d'environ 8 minutes, bâtie sur les trois shorts (content/trial/boat.yaml, boy.yaml, wall.yaml).
#
# Validé par le propriétaire le 2026-11-11 (« je valide et tu peux commencer le montage », en réponse aux trois
# questions de la session) : la structure (chaque histoire avec son secret, plutôt que l'ordre du Coran), les
# répliques nouvelles, les titres des miniatures. Cela ne valide ni la voix ni le montage ; une réplique
# changée redevient à valider.
#
# - `reuse` : des répliques d'un short (<short>.<narration>, `lines` : leurs numéros à partir de 0, toutes par
#   défaut) : leur prise est reprise telle quelle, aucune requête de voix ;
# - `narration` : des répliques propres au film (texte de voix content/voice-test/23-trial-film.txt, UNE requête
#   pour toutes) ; celles marquées « khidr » sont des répliques validées de l'ancien film, redites par la voix D ;
# - `verse` : récité (Tawfiq As-Sayegh) ; `reading` : hadith lu par une vraie voix (registre, lecture validée) ;
# - `picture` et `scene` : l'image filmée et ce qui est dessiné dessus (ceux des shorts), gardés d'un segment
#   au suivant ; `shots` : une image par morceau de la réplique (l'ouverture) ;
# - `subscribe: true` : le rappel d'abonnement passe pendant ce segment (jamais sur un verset, un hadith ou la
#   garde ; jamais dans les 30 premières secondes) ; `outro` : secondes d'image calme à la fin, pour l'écran de
#   fin de YouTube.
id: film
files: khidr                     # début du nom des vidéos livrées : khidr-film-16x9.mp4, khidr-short-<n>-<id>.mp4
ambience_after: true             # ce film seulement : l'ambiance a été posée sous les vidéos rendues (ambience.py --mix), les validées s'appellent …-ambience.mp4
title: { ar: "موسى والخضر… مش كل حاجة شايفها شر تبقى شر", en: "Moses and al-Khidr: not everything that looks bad is bad" }
script_validated: { by: mssnoussi92, on: 2026-11-11 }
# « Je valide » du propriétaire (2026-11-11) sur la vidéo livrée dans la conversation : la voix D entendue sur la
# vidéo entière, le montage, la vignette, le rappel d'abonnement, les textes de publication (`publish`). Inscrit sur sa parole.
# L'ambiance sonore (`ambience`), ajoutée après avec son accord, a reçu son propre « je valide » le même jour,
# sur les vidéos `…-ambience.mp4` : ce sont elles, les vidéos finales.
validated: { by: mssnoussi92, on: 2026-11-11, what: [voice, montage, thumbnail, subscribe, publish, ambience] }
# Le même film en vertical (9:16, pour Facebook : tools/trial/videos.py, `only: tall`). « Je valide tout » du propriétaire
# (2026-11-12), sur la vidéo envoyée dans la conversation et son texte Facebook : le montage vertical (la voix et
# l'ambiance sont celles du film, déjà validées) et ce texte. Inscrit sur sa parole.
tall: { validated: { by: mssnoussi92, on: 2026-11-12, what: [montage, publish] } }
handle: "@quran_words_daily"
voices: { D: "Gemini 3.8 Flash TTS, Algieba", V: "VoiceTut, Mohammed", X: "draft, no voice yet" }
text: 23-trial-film
verses: khidr
outro: 12
# Miniature YouTube 1280x720 (TrialThumb169) : les trois histoires côte à côte, le nom de l'histoire en grand.
thumbnail: { title: "موسى والخضر", tag: "٣ مواقف… و٣ أسرار", panels: [boat, boy, wall], file: miniature-film-16x9.jpg, validated: { by: mssnoussi92, on: 2026-11-11 } }
# Textes de publication, proposés par la session (2026-11-11), pas encore validés : tools/trial/publish.py en
# fait les textes à coller (YouTube avec ses chapitres, et les trois shorts, qui prennent `series` et `hashtags`).
publish:
  out: docs/retention/publication-moussa-khidr.md      # où tools/trial/publish.py écrit les textes à coller
  title: { en: "Moses and al-Khidr: what looks bad is not always bad", ar: "موسى والخضر: مش كل شر… شر" }
  series: { en: "Moses and al-Khidr", ar: "موسى والخضر" }
  description:
    en: "A boat torn open, a father and mother who lost their son, a wall rebuilt for free: three things Moses, peace be upon him, could not keep silent about on his journey with al-Khidr (Surat al-Kahf), and the secret of each. A wisdom shown quickly, a wisdom never shown to those who lived it, and a good hidden until its time."
    ar: "سفينة اتخرقت، أب وأم خسروا ابنهم، وجدار اتبنى ببلاش: تلات مواقف موسى عليه السلام ما قدرش يسكت عليها في رحلته مع الخضر (سورة الكهف)، وسر كل واحد منهم. حكمة اتكشفت بسرعة، وحكمة ما اتكشفتش لأصحابها، وخير مستخبي لحد وقته."
  hashtags: ["#سورة_الكهف", "#قصص_القرآن"]      # validés par le propriétaire le 2026-11-14 (« je valide les hashtags ») ; avant : ["#Qadr", "#القدر", "#SurahAlKahf"]
  narration: { D: "Narration: AI-generated voice (Gemini TTS, Egyptian Arabic) · صوت الراوي مولَّد بالذكاء الاصطناعي", V: "Narration: AI-generated voice (VoiceTut, Egyptian Arabic) · صوت الراوي مولَّد بالذكاء الاصطناعي" }
chapters:
  - id: open                     # 0:00 : les trois images, la promesse
    title: { ar: "تلات مواقف", en: "Three stories" }
    segments:
      - narration: film-open
        shots: [{ picture: boat, scene: holed }, { picture: boy, scene: home }, { picture: wall, scene: leaning }]
        lines:
          - ar: "سفينة اتخرقت… أب وأم خسروا ابنهم… وجدار اتبنى ببلاش."
            en: "A boat torn open… a father and mother who lost their son… and a wall rebuilt for free."
      - narration: film-promise
        picture: boat
        scene: sea
        lines:
          - ar: "تلات مواقف… موسى عليه السلام نفسه ما قدرش يسكت عليها… وفي كل واحد منهم سر."
            en: "Three stories… that Moses himself, peace be upon him, could not keep silent about… and in each one, a secret."
          - ar: "والتلاتة مع بعض… هيغيّروا نظرتك لكل حاجة وحشة حصلتلك."
            en: "And together… they will change how you see every bad thing that ever happened to you."
  - id: meeting                  # la rencontre et la condition
    title: { ar: "الشرط", en: "The condition" }
    segments:
      - narration: film-meeting
        picture: boat
        scene: sea
        lines:
          - ar: "موسى عليه السلام عرف إن فيه عبد… ربنا علّمه علم ما عندوش… فراح له… وطلب يتعلم منه."
            en: "Moses, peace be upon him, learned of a servant… whom God had taught a knowledge he did not have… so he went to him… and asked to learn from him."
      - verse: quran.18.67
      - verse: quran.18.68
      - narration: film-condition
        lines:
          - ar: "يعني هتشوف حاجات… مش هتقدر تفهمها… عشان مش شايف الصورة كلها."      # khidr, meet-takeaway
            en: "In other words: you'll see things… you won't be able to understand… because you don't see the whole picture."
          - ar: "وشرط عليه شرط واحد."
            en: "And he set him one condition."
      - verse: quran.18.70
  - id: boat
    title: { ar: "السفينة", en: "The boat" }
    number: 1
    segments:
      - reuse: boat.open
        lines: [0]
        picture: boat
        scene: holed
      - verse: quran.18.71
      - verse: quran.18.72
      - verse: quran.18.73
      - reuse: boat.secret
      - verse: quran.18.79
        scene: fleet
      - reuse: boat.meaning
      - reuse: boat.depth
        scene: sail
      - reuse: boat.example
        scene: sea
      - reuse: boat.close
        lines: [0]               # la phrase à retenir ; « افتكر السفينة » ferme le film
        scene: sail
      - reuse: boat.close
        lines: [2]               # l'annonce du deuxième
        subscribe: true
  - id: boy
    title: { ar: "الغلام", en: "The boy" }
    number: 2
    segments:
      - reuse: boy.open
        lines: [0]
        picture: boy
        scene: home
      - verse: quran.18.74
      - verse: quran.18.75
      - verse: quran.18.76
      - reuse: boy.secret
      - verse: quran.18.80
      - verse: quran.18.81
        scene: given
      - reuse: boy.meaning       # la garde y est : elle ne se coupe jamais
      - reuse: boy.depth
        scene: far
      - reuse: boy.example
        scene: sky
      - reuse: boy.close
        lines: [0, 1]
        scene: far
  - id: wall
    title: { ar: "الجدار", en: "The wall" }
    number: 3
    segments:
      - reuse: wall.open
        lines: [0]
        picture: wall
        scene: leaning
      - verse: quran.18.77
      - narration: film-parting
        scene: raised
        lines:
          - ar: "وهنا الخَضِر قاله: هنا نفترق… بس هقولك سر اللي مقدرتش تصبر عليه."      # khidr, parting-say
            en: "Then al-Khidr said: this is where we part… but I'll tell you the secret of what you couldn't be patient with."
      - verse: quran.18.78
      - verse: quran.18.82
        scene: treasure
      - reuse: wall.meaning
      - reuse: wall.depth
        scene: far
      - reuse: wall.example
        scene: land
      - reuse: wall.close
        lines: [0]
        scene: far
  - id: end                      # ce qui relie les trois, le verset, le moineau
    title: { ar: "ليه مش بنشوفها؟", en: "Why can't we see it?" }
    segments:
      - reuse: wall.close
        lines: [1]               # « تلات مواقف: حكمة اتكشفت بسرعة… »
        picture: boat
        scene: sail
      - narration: film-hate
        lines:
          - ar: "ممكن تكره حاجة… وهي خير ليك. وتحب حاجة… وهي شر ليك."      # khidr, end-hate
            en: "You may hate something… while it's good for you. And love something… while it's bad for you."
      - verse: quran.2.216
      - narration: film-sparrow
        scene: bird
        lines:
          - ar: "طب ليه مش بنشوفها؟"      # khidr, end-why
            en: "So why can't we see it?"
          - ar: "وهم في السفينة… عصفور وقف على طرفها… ونقر في البحر."      # khidr, ship-bird
            en: "While they were on the boat… a sparrow landed on its edge… and pecked at the sea."
          - ar: "والنبي صلى الله عليه وسلم حكى إن الخَضِر قال:"      # khidr, ship-hadith
            en: "And the Prophet ﷺ told us that al-Khidr said:"
      - reading: hadith.bukhari.3401
      - reuse: boat.close
        lines: [1]               # « لما حاجة وحشة تحصلك… افتكر السفينة. »
        scene: sail
      - narration: film-follow
        subscribe: true
        lines:
          - ar: "اشترك… عشان القصة الجاية."
            en: "Subscribe… for the next story."
