name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Content against schemas and editorial rules
        run: uv run --with jsonschema --with pyyaml scripts/validate.py

      - name: Python syntax
        run: python3 -m py_compile tools/tts/say.py tools/sources/fetch.py scripts/validate.py

      - name: Registry texts are exactly the APIs' (quran.com, hadith-api)
        run: uv run --with ruamel.yaml tools/sources/fetch.py --check

      - name: Shell scripts
        run: shellcheck infra/*.sh scripts/*.sh

  video:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Episode data from content/ (sources resolved from the registry)
        run: npm run data

      - name: TypeScript
        run: npm run typecheck
