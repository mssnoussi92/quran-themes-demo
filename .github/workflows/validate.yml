name: validate

# On a pull request and on main. A push to a branch that has a pull request ran everything twice
# (43 runs out of 191 repeated a commit already checked, 2026-11-06 to 2026-11-09): a branch
# without a pull request is checked by hand (workflow_dispatch) or by opening one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Content against schemas and editorial rules
        run: uv run --with jsonschema --with pyyaml scripts/validate.py

      # The rules themselves: each must still refuse what it was written to refuse (a character
      # beside a named person, a verse read by the synthetic voice, a source outside the policy,
      # a final render without the owner's validation), and promote must refuse a candidate whose
      # content changed. Tried on a copy of the real content with one thing broken (tests/).
      - name: The rules still refuse what they must
        run: uv run --with pytest --with jsonschema --with pyyaml pytest -q tests

      # The files of the film-and-shorts model (content/trial/) against the rules: quotes by id and in the policy,
      # no quotation said by the synthetic voice, voice texts equal to the lines, reuse and fields.
      - name: Film and shorts rules
        run: uv run --with pyyaml python3 tools/trial/rules.py --all

      - name: Python syntax
        run: python3 -m py_compile tools/tts/say.py tools/tts/gemini.py tools/trial/prepare.py tools/trial/film.py tools/trial/publish.py tools/trial/clip.py tools/trial/ambience.py tools/trial/check.py tools/trial/sources.py tools/trial/script.py tools/trial/rules.py tools/audio/align.py tools/sources/fetch.py tools/audio/build.py tools/audio/listen.py scripts/validate.py scripts/finalize.py

      - name: Registry texts are exactly the APIs' (quran.com, hadith-api)
        run: uv run --with ruamel.yaml tools/sources/fetch.py --check

      - name: Shell scripts
        run: shellcheck infra/*.sh scripts/*.sh

  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Episode data from content/ (sources resolved from the registry)
        run: npm run data

      - name: TypeScript
        run: npm run typecheck

      # Title, captions and hashtags of every video within the platforms' limits.
      - name: Publication texts
        run: for f in ../content/episodes/*.yaml; do node scripts/publish.ts "$(basename "$f" .yaml)" all > /dev/null; done

      # The list « à vérifier » of a candidate render (render workflow, mode candidate) builds for every episode.
      - name: Candidate review list
        run: for f in ../content/episodes/*.yaml; do node scripts/review.ts "$(basename "$f" .yaml)" > /dev/null; done
