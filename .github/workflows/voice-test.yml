name: voice-test

# Reads the Egyptian narration and the hadith of content/voice-test/ with VoiceTut on CPU, one job
# per voice (VoiceTut takes minutes per sentence on a runner's CPU), converts the takes to MP3 and
# attaches them to the "voice-test-latest" pre-release (easy to download and play on a phone).
# SILMA is no longer read here: its torchaudio needs the system FFmpeg libraries (apt), and the
# owner chose VoiceTut (2026-11-06); its earlier takes stay in the release.
# Voice comparison of 2026-11-11 (free first, docs/retention.md): `gemini_voices` has Gemini TTS
# (Google AI Studio, free tier) say the five lines of content/voice-test/10-boat-standard.txt and
# 11-boat-egyptian.txt, one file per voice and text, named by its label (C-boat-standard.mp3) so the
# owner can listen without knowing which engine is which. The key is the repository secret
# GEMINI_API_KEY: it never passes through a session. `voicetut_speakers: none` skips VoiceTut; an empty
# `gemini_voices` skips Gemini.

on:
  workflow_dispatch:
    inputs:
      voicetut_speakers:
        description: "VoiceTut voices, comma-separated, or none. Men: Ahmed, Ali, Hassan, Karim, Mahmoud, Mohammed, Mostafa, Ramy, Shaker, Tareq, Yehia, Youssef. Women: Hadeer, Hanan, Mariam, Rana, Sarah, Yasmin, Yara"
        default: Mohammed,Ahmed,Karim,Mahmoud,Hanan
      gemini_voices:
        description: "Gemini TTS voices as label=Voice, comma-separated (empty: none), e.g. C=Charon,D=Algieba. Needs the secret GEMINI_API_KEY"
        default: ""
  # By hand only: the voice is chosen (Mohammed, 2026-11-06). A push to main that touched tools/tts
  # or requirements/ used to start five synthesis jobs nobody listened to (3 runs out of 5).

permissions:
  contents: write

concurrency:
  group: voice-test
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - id: matrix
        env:
          SPEAKERS: ${{ inputs.voicetut_speakers }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os, re
          # "none" skips VoiceTut (an empty input is replaced by its default by GitHub: run 6 of 2026-11-11
          # started five VoiceTut jobs nobody asked for).
          asked = os.environ["SPEAKERS"].strip()
          voices = [] if asked.lower() == "none" else [v.strip() for v in asked.split(",") if v.strip()]
          bad = [v for v in voices if not re.fullmatch(r"[A-Za-z]+", v)]
          if bad:
              raise SystemExit(f"invalid voice name(s): {bad}")
          egy = "content/voice-test/02-narration-egy.txt content/voice-test/03-hadith-bukhari-6340.txt"
          jobs = [{"engine": "voicetut", "voice": v, "texts": egy} for v in voices]
          print("matrix=" + json.dumps({"include": jobs}))
          print(f"count={len(jobs)}")
          EOF

  synthesize:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    name: synthesize (${{ matrix.engine }} ${{ matrix.voice }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # No apt: the Ubuntu mirror can hang for an hour (voice-test, 2026-11-06). Static ffmpeg build
      # from imageio-ffmpeg (pip, pinned as in quran-reels), put on PATH as "ffmpeg".
      - name: ffmpeg (static build)
        run: |
          uv venv .venv-tools
          uv pip install --python .venv-tools/bin/python imageio-ffmpeg==0.8.1
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(.venv-tools/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ffmpeg" -hide_banner -version | head -1

      - name: Cache model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.engine }}-${{ hashFiles(format('requirements/{0}.txt', matrix.engine)) }}

      - name: Install ${{ matrix.engine }} (CPU PyTorch)
        run: |
          uv venv --python 3.12 ".venv-${{ matrix.engine }}"
          uv pip install --python ".venv-${{ matrix.engine }}/bin/python" --torch-backend cpu \
            -r "requirements/${{ matrix.engine }}.txt"

      - name: Synthesize and convert to MP3
        env:
          ENGINE: ${{ matrix.engine }}
          VOICE: ${{ matrix.voice }}
          TEXTS: ${{ matrix.texts }}
        run: |
          # shellcheck disable=SC2086  # TEXTS is a list of paths and globs
          ".venv-$ENGINE/bin/python" tools/tts/say.py --engine "$ENGINE" --speaker "$VOICE" \
            --in $TEXTS --out-dir build/tts
          for f in build/tts/*.wav; do
            ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -qscale:a 2 "${f%.wav}.mp3"
          done
          ls -la build/tts

      - uses: actions/upload-artifact@v7
        with:
          name: voice-test-${{ matrix.engine }}-${{ matrix.voice }}
          path: build/tts/*.mp3
          if-no-files-found: error

  # Gemini TTS by its API: no model to install, a few requests spaced out (free tier).
  gemini:
    if: ${{ inputs.gemini_voices != '' }}
    name: synthesize (gemini)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: ffmpeg (static build)
        run: |
          uv venv .venv-tools
          uv pip install --python .venv-tools/bin/python imageio-ffmpeg==0.8.1
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(.venv-tools/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Where the key is, without ever printing it: a repository secret is what the next step reads; a
      # repository *variable* of the same name is not a secret (its value shows in logs and settings).
      - name: Is the key there?
        env:
          AS_SECRET: ${{ secrets.GEMINI_API_KEY != '' }}
          AS_VARIABLE: ${{ vars.GEMINI_API_KEY != '' }}
        run: |
          echo "repository secret GEMINI_API_KEY set: $AS_SECRET"
          echo "repository variable GEMINI_API_KEY set: $AS_VARIABLE"

      - name: Synthesize and convert to MP3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICES: ${{ inputs.gemini_voices }}
        run: |
          python3 tools/tts/gemini.py --voices "$VOICES" --out-dir build/tts \
            --in content/voice-test/10-boat-standard.txt content/voice-test/11-boat-egyptian.txt
          for f in build/tts/*.wav; do
            ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -qscale:a 2 "${f%.wav}.mp3"
          done
          ls -la build/tts

      - uses: actions/upload-artifact@v7
        with:
          name: voice-test-gemini
          path: build/tts/*.mp3
          if-no-files-found: error

  publish:
    needs: [synthesize, gemini]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: voice-test-*
          merge-multiple: true
          path: mp3

      - name: Attach MP3 files to the voice-test-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ls mp3/*.mp3
          notes="AI-generated voices. VoiceTut (Egyptian): one file per voice. SILMA (MSA + English): takes of 2026-11-06. Voice comparison of 2026-11-11: <label>-boat-standard.mp3 and <label>-boat-egyptian.mp3, the same five lines by each voice. Run: $RUN_URL"
          if ! gh release view voice-test-latest >/dev/null 2>&1; then
            gh release create voice-test-latest --prerelease --title "Voice test (latest)" --notes "$notes"
          fi
          gh release upload voice-test-latest mp3/*.mp3 --clobber
          gh release edit voice-test-latest --notes "$notes"
