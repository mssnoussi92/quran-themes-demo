name: render

# Renders an episode with its real audio (recitation + VoiceTut narration), easy to play on a phone:
#   reel = <reel id>  that reel in 9:16, attached to the "<reel>-latest" pre-release;
#   reel = all        the whole episode in 16:9 (YouTube) and in 9:16, and every reel in 9:16 (Facebook,
#                     Instagram, TikTok), all attached to the "<episode>-latest" pre-release. The whole
#                     episode leaves out the ends said only in a reel ("that's next", reel_only_end).
#                     With it, the episode's YouTube thumbnail (Thumbnail169, <episode>-thumbnail.png),
#                     flagged in the notes until the owner validates it on the image.
# The pre-release notes give, for each video, the title, description and hashtags to paste on each
# platform (video/scripts/publish.ts: the episode's `publish` texts, sources, credits, chapters).
# Modes:
#   candidate  (owner's decision, 2026-11-08: one validation, at the end) everything Claude checked,
#              nothing validated yet: the narration takes stored as candidates (tools/audio/build.py
#              --candidate) or locked, never a new synthesis. Attached to a *draft* release
#              "<episode|reel>-candidate", visible only to the repository's owner, whose notes start
#              with the list « à vérifier » (video/scripts/review.ts) and keep the final notes aside
#              (final-notes.md). On the owner's « je valide »: scripts/finalize.py validate, then the
#              promote workflow turns these very videos into "<…>-latest".
#   final      every quoted source, script, publication text and narration take validated by the
#              owner (validate.py --release, build.py --require-locked): a new render of a validated
#              episode (a change to the compositions), straight to "<…>-latest".
#   draft      whatever exists, missing lines synthesised in CI (VoiceTut): a quick look, never published.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode (content/episodes/<episode>.yaml)"
        default: dua
      reel:
        description: "Reel id, or all: the 16:9 episode and every reel"
        default: dua-01
      speaker:
        description: "VoiceTut voice for the narration (see tools/tts/say.py --help)"
        default: Mohammed
      mode:
        description: "candidate (for the owner's one validation), final (all validated), draft (a quick look)"
        type: choice
        options: [candidate, final, draft]
        default: candidate

permissions:
  contents: write

# One run per episode and reel: « all » of two episodes run side by side.
concurrency:
  group: render-${{ inputs.episode }}-${{ inputs.reel }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    # The paper-cut style (docs/styles.md) renders about six times slower than the flat one on a
    # runner without GPU (0.24 s a frame against 0.04): about 3 h 30 for a nine-minute episode in
    # both formats and its reels. GitHub's limit for a job is 360 minutes.
    timeout-minutes: 330
    env:
      EPISODE: ${{ inputs.episode }}
      REEL: ${{ inputs.reel }}
      SPEAKER: ${{ inputs.speaker }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs
        run: |
          [[ "$EPISODE" =~ ^[a-z0-9-]+$ && "$REEL" =~ ^[a-z0-9-]+$ && "$SPEAKER" =~ ^[A-Za-z]+$ ]] \
            || { echo "::error::invalid episode, reel or speaker"; exit 1; }
          test -f "content/episodes/$EPISODE.yaml" || { echo "::error::no content/episodes/$EPISODE.yaml"; exit 1; }

      - uses: astral-sh/setup-uv@v6

      # The reels to render: the one asked for, or all of the episode's.
      - name: Reels
        run: |
          if [ "$REEL" = all ]; then
            reels=$(uv run --with pyyaml python -c "import sys, yaml; print(' '.join(r['id'] for r in yaml.safe_load(open(sys.argv[1]))['reels']))" "content/episodes/$EPISODE.yaml")
          else
            reels="$REEL"
          fi
          echo "REELS=$reels" >> "$GITHUB_ENV"
          echo "reels: $reels"

      - name: Sources and editorial rules
        run: |
          if [ "$MODE" != final ]; then
            # A candidate shows the owner what the checks left (dialect, spellings, format): the list « à vérifier ».
            uv run --with jsonschema --with pyyaml scripts/validate.py | tee validate.txt
          else
            for reel in $REELS; do
              uv run --with jsonschema --with pyyaml scripts/validate.py --release --reel "$reel"
            done
            # The whole episode's own order and lines (`whole`: scenes said only there), when it has one.
            if [ "$REEL" = all ]; then
              uv run --with jsonschema --with pyyaml scripts/validate.py --release --whole "$EPISODE"
            fi
          fi

      # No apt: the Ubuntu mirror can hang for an hour (voice-test, 2026-11-06). Static ffmpeg build
      # from imageio-ffmpeg (pip, pinned as in quran-reels), put on PATH as "ffmpeg".
      - name: ffmpeg (static build)
        run: |
          uv venv .venv-tools
          uv pip install --python .venv-tools/bin/python imageio-ffmpeg==0.8.1
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(.venv-tools/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ffmpeg" -hide_banner -version | head -1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Video dependencies
        working-directory: video
        run: npm ci --no-audit --no-fund && npm run data

      # Platform limits (title, caption length, hashtags) checked before the long render.
      - name: Publication texts
        working-directory: video
        run: node scripts/publish.ts "$EPISODE" "$REEL" > /dev/null

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-voicetut-${{ hashFiles('requirements/voicetut.txt') }}

      # The reciter's files of whole surahs (Tawfiq As-Sayegh, mp3quran.net), each verse cut out of them
      # where content/recitations/<reciter>.json says: downloaded once (surah 2 is 110 MB).
      - name: Cache surah recitations
        uses: actions/cache@v4
        with:
          path: build/recitations
          key: recitations-${{ hashFiles('content/recitations/**') }}
          restore-keys: recitations-

      # Lines already synthesised with the same text and voice are reused (tools/audio/build.py).
      - name: Cache episode audio
        uses: actions/cache@v4
        with:
          path: build/audio/${{ inputs.episode }}
          key: audio-${{ inputs.episode }}-${{ inputs.speaker }}-${{ hashFiles('content/**') }}
          restore-keys: audio-${{ inputs.episode }}-${{ inputs.speaker }}-

      - name: Install VoiceTut (CPU PyTorch)
        run: |
          uv venv --python 3.12 .venv-voicetut
          uv pip install --python .venv-voicetut/bin/python --torch-backend cpu -r requirements/voicetut.txt

      # A final render uses only the narration takes the owner validated (content/audio/<episode>/), a
      # candidate only those Claude checked and stored, or validated ones: both fail rather than synthesise
      # a new take nobody checked. A draft synthesises missing lines.
      - name: Audio (recitation and narration)
        run: |
          locked=()
          if [ "$MODE" != draft ]; then
            locked=($([ "$MODE" = final ] && echo --require-locked || echo --require-committed))
            if [ "$REEL" != all ]; then locked+=(--reel "$REEL"); fi
          fi
          python3 tools/audio/build.py --episode "$EPISODE" --speaker "$SPEAKER" \
            --tts-python .venv-voicetut/bin/python "${locked[@]}"

      - name: Render
        working-directory: video
        run: |
          npm run data
          if [ "$REEL" = all ]; then
            props=$(printf '{"episode":"%s","reel":null,"format":"episode","data":null}' "$EPISODE")
            npx remotion render Episode169 "out/$EPISODE-16x9.mp4" --props="$props"
            props=$(printf '{"episode":"%s","reel":null,"format":"reel","data":null}' "$EPISODE")
            npx remotion render Reel916 "out/$EPISODE-9x16.mp4" --props="$props"
            if grep -q '^thumbnail:' "../content/episodes/$EPISODE.yaml"; then
              props=$(printf '{"episode":"%s","layout":null,"data":null}' "$EPISODE")
              npx remotion still Thumbnail169 "out/$EPISODE-thumbnail.png" --props="$props"
            fi
          fi
          for reel in $REELS; do
            props=$(printf '{"episode":"%s","reel":"%s","format":"reel","data":null}' "$EPISODE" "$reel")
            npx remotion render Reel916 "out/$reel.mp4" --props="$props"
          done
          for f in out/*.mp4; do echo "$f"; ffmpeg -hide_banner -i "$f" 2>&1 | grep -E "Duration|Stream" || true; done
          # Loudness of each video (every part is levelled to -16 LUFS by tools/audio/build.py): about
          # -16 LUFS integrated, true peak under -1 dBTP.
          for f in out/*.mp4; do
            echo "$f: $(ffmpeg -hide_banner -nostats -i "$f" -vn -af ebur128=peak=true -f null - 2>&1 | grep -A14 Summary | grep -E ' I:| Peak:' | tr -s ' ' | tr '\n' ' ')"
          done

      # Candidate: a draft release (private), its notes the list « à vérifier » then the texts as they are
      # now; the final notes (as validated) and the commit rendered kept as assets for the promote workflow.
      - name: Attach the candidate videos to a draft release
        if: inputs.mode == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          name=$([ "$REEL" = all ] && echo "$EPISODE" || echo "$REEL")
          tag="$name-candidate"
          header="Candidate render, not validated yet. Narration: AI-generated voice (VoiceTut, $SPEAKER). Verses: real recitation. Run: $RUN_URL"
          {
            echo "$header"; echo
            (cd video && node scripts/review.ts "$EPISODE" --warnings ../validate.txt)
            echo; echo "---"; echo
            (cd video && node scripts/publish.ts "$EPISODE" "$REEL")
          } > notes.md
          (cd video && node scripts/publish.ts "$EPISODE" "$REEL" --as-validated) > video/out/final-notes.md
          printf '{"episode": "%s", "reel": "%s", "commit": "%s", "run": "%s"}\n' "$EPISODE" "$REEL" "$GITHUB_SHA" "$RUN_URL" > video/out/candidate.json
          # One candidate at a time: the previous draft of the same name goes.
          for id in $(gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id"); do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
          shopt -s nullglob
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Candidate $name: to watch, then « je valide »" --notes-file notes.md \
            video/out/*.mp4 video/out/*.png video/out/final-notes.md video/out/candidate.json
          echo "draft release: $(gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$tag\") | .html_url")"

      - name: Attach the MP4 files and the publication texts to the pre-release
        if: inputs.mode != 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$REEL" = all ]; then
            tag="$EPISODE-latest"; title="Episode $EPISODE (latest): whole episode (16:9, 9:16) and reels"
          else
            tag="$REEL-latest"; title="Reel $REEL (latest)"
          fi
          kind=$([ "$MODE" = draft ] && echo "Draft (script or sources not all validated yet)" || echo "Release render")
          header="$kind. Narration: AI-generated voice (VoiceTut, $SPEAKER). Verses: real recitation. Run: $RUN_URL"
          (cd video && node scripts/publish.ts "$EPISODE" "$REEL" --header "$header") > notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "$title" --notes-file notes.md
          fi
          shopt -s nullglob
          gh release upload "$tag" video/out/*.mp4 video/out/*.png --clobber
          gh release edit "$tag" --notes-file notes.md
